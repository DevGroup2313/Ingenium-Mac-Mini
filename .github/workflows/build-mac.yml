# INGENIUM  |  Copyright (c) 2026 Yannie D. Forest. All rights reserved.
# NO LICENCE IS GRANTED. See LICENCE.txt.
#
# Builds the Mac apps in GitHub's cloud, one after the other: for Intel Macs,
# and (R70) for Macs with Apple silicon, such as a Mac mini, whose engine uses
# the graphics chip (Metal). Each gets the native engine (llama.cpp, compiled
# here once and then kept in the build cache), its built-in models and the
# app itself; then the app must answer a question with its own engine, and
# its thinking model must think, before it is published on the Releases page.
#
# Cost: this repository is private, and GitHub counts every minute on a Mac
# ten times against the free monthly allowance. Each app with the engine
# already cached takes about 6 to 12 minutes (60 to 120 allowance minutes);
# the first Apple silicon build compiles its engine too.
name: Build Ingenium for Mac

on:
  push:
    branches: ['**']
    paths:
      - 'ingenium.html'
      - 'ingenium_app.py'
      - 'ingenium.spec'
      - 'app.json'
      - 'desktop_model.json'
      - 'tools/**'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    name: mac (${{ matrix.chip }})
    strategy:
      fail-fast: false
      # one at a time: both apps go on the same Releases page
      max-parallel: 1
      matrix:
        include:
          - chip: Intel
            runner: macos-15-intel
            plat: macos-x64
            models: desktop
            zip: Mac-Intel
          - chip: Apple silicon
            runner: macos-15
            plat: macos-arm64
            models: mac-arm
            zip: Mac-Apple-Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      INGENIUM_CHIP: ${{ matrix.chip }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read who the app is (app.json)
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json, re
          c = json.load(open("app.json"))
          name = re.sub(r"\s+", " ", re.sub(r"[^A-Za-z0-9 ._-]", "", str(c.get("name") or ""))).strip() or "Ingenium"
          file = re.sub(r"[^A-Za-z0-9._-]", "", str(c.get("file_name") or "")) or "Ingenium"
          print("APP_NAME=" + name)
          print("APP_FILE=" + file)
          PY

      - name: The engine, from the build cache when it was compiled before
        id: engine
        uses: actions/cache@v5
        with:
          path: engine/${{ matrix.plat }}
          # one compile per engine release: change v1 to v2 to compile again
          key: engine-${{ matrix.plat }}-b11321-portable-v1

      - name: Compile the engine (llama.cpp b11321; only when not cached)
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          command -v cmake || brew install cmake
          bash tools/build_engine_mac.sh engine/${{ matrix.plat }} portable "$RUNNER_TEMP/engine-build"

      # R78: llama.cpp's trainer (llama-finetune), for "Train a small model from
      # zero": compiled once from the same release, for the processor only, and
      # kept in its own build cache, so the engine is not compiled again
      - name: The trainer, from the build cache when it was compiled before
        id: trainer
        uses: actions/cache@v5
        with:
          path: engine-trainer/${{ matrix.plat }}
          key: trainer-${{ matrix.plat }}-b11321-v1

      - name: Compile the trainer (llama.cpp b11321; only when not cached)
        if: steps.trainer.outputs.cache-hit != 'true'
        run: |
          command -v cmake || brew install cmake
          bash tools/build_engine_mac.sh engine-trainer/${{ matrix.plat }} trainer "$RUNNER_TEMP/engine-build"

      - name: The trainer joins the engine
        run: |
          cp engine-trainer/${{ matrix.plat }}/llama-finetune engine/${{ matrix.plat }}/llama-finetune
          chmod 755 engine/${{ matrix.plat }}/llama-finetune

      # 6.10.5: the kinds of model each engine lists (its src/llama-arch.cpp), for the app's choice between two engines; the proven
      # engine's cached build predates the list, so it is read from the same release's source
      - name: The proven engine's list of model kinds
        run: |
          E=engine/${{ matrix.plat }}
          if [ ! -s "$E/ARCHS.txt" ]; then
            curl -fsSL --retry 4 "https://raw.githubusercontent.com/ggml-org/llama.cpp/b11321/src/llama-arch.cpp" \
              | grep -oE '\{ *LLM_ARCH_[A-Z0-9_]+ *, *"[^"]+" *\}' | sed -E 's/.*"([^"]+)".*/\1/' | grep -v '^(unknown)$' | tr '\n' ' ' > "$E/ARCHS.txt"
          fi
          echo "Proven engine: $(cat "$E/VERSION.txt"), $(wc -w < "$E/ARCHS.txt" | tr -d ' ') model kinds"

      # 6.10.5, her words: "I want the option of a newer engine where it tested and proven to work and work well but I still want the
      # llama engine kept optional or in some cases as a backup or default". A newer llama.cpp (b12000, 29 October 2026), compiled as
      # the proven one is; it goes into the app only if the app's own self-test answers with it (below), and a failed compile
      # leaves the app with the proven engine alone
      - name: The newer engine, from the build cache when it was compiled before
        id: engine_next
        uses: actions/cache@v5
        with:
          path: engine-next/${{ matrix.plat }}
          key: engine-next-${{ matrix.plat }}-b12000-portable-v1

      - name: Compile the newer engine (llama.cpp b12000; only when not cached)
        if: steps.engine_next.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          ING_ENGINE_TAG: b12000
          ING_ENGINE_COMMIT: 68d20b8
        run: |
          command -v cmake || brew install cmake
          bash tools/build_engine_mac.sh engine-next/${{ matrix.plat }} portable "$RUNNER_TEMP/engine-build-next" \
            || { rm -rf engine-next/${{ matrix.plat }}; echo "::warning::the newer engine did not compile; the app carries the proven engine only"; exit 1; }

      - name: The built-in models, from the build cache when they were downloaded before
        uses: actions/cache@v5
        with:
          path: ~/.cache/ingenium-models
          key: model-${{ hashFiles('desktop_model.json') }}

      - name: Get the built-in models (each checked against its SHA-256)
        run: |
          # the built-in models must be the ones the page's lineup names (R70)
          python3 tools/check_lineup.py
          python3 tools/prepare_desktop_model.py "$RUNNER_TEMP/models" ${{ matrix.models }}

      - name: Install the build tools
        run: python3 -m pip install --disable-pip-version-check pyinstaller==6.22.3 pywebview==6.2.1 certifi

      - name: The edit panel's clipboard (R78), copied and pasted through the app's own code
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          sys.path.insert(0, ".")
          import ingenium_app as a
          t = "Ingenium paste test \u2713 https://example.org/live?id=42&ref=outside"
          w = a._clipboard_write(t)
          r = a._clipboard_read()
          ok = bool(w.get("ok")) and bool(r.get("ok")) and r.get("text") == t
          print("* Clipboard through the app: %s (write %s; read back %s)" % ("works" if ok else "FAILED", w, ascii((r.get("text") if r.get("ok") else r.get("error")) or "")[:90]))
          sys.exit(0 if ok else 1)
          EOF

      - name: Training from zero (R78), through the app's own code with its own engine
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          echo "### Training a small model from zero" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/train_smoke.py | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}

      - name: The speech models dictation writes with (Mini's release speech-vendor, checked by SHA-256)
        # 6.57: her choice, "Carry them": dictation works offline from the first launch. When the file cannot be fetched or its
        # fingerprint differs, the app is built without it and fetches the model once, the first time she dictates.
        continue-on-error: true
        run: |
          WANT="$(head -n 1 tools/speech_vendor.sha256 | cut -d' ' -f1)"
          rm -rf speech
          if curl -fsSL --retry 4 --max-time 900 -o "$RUNNER_TEMP/speech.zip" "https://github.com/DevGroup2313/Ingenium-Mac-Mini/releases/download/speech-vendor/speech-vendor.zip"; then
            GOT="$(shasum -a 256 "$RUNNER_TEMP/speech.zip" | cut -d' ' -f1)"
            if [ "$GOT" = "$WANT" ]; then
              mkdir speech && unzip -q "$RUNNER_TEMP/speech.zip" -d speech
              echo "* Speech models carried for dictation: $(du -sh speech | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::The speech files' fingerprint is $GOT, not $WANT: this app fetches its speech model once instead"
            fi
          else
            echo "::warning::The speech files could not be fetched: this app fetches its speech model once instead"
          fi

      - name: The folder search's files (Mini's release rag-vendor, checked by SHA-256)
        # 6.59: the chat answers from her folders (modules/r257.js). The folder search's own files are this repository's rag/
        # (release.py writes them); its third-party files (SQLite with FTS5 and sqlite-vec, Transformers.js, the ONNX runtime, pdf.js,
        # mammoth and the reading model bge-small-en-v1.5) come from Mini's release rag-vendor, checked against tools/rag_vendor.sha256.
        # Not fetched, or another fingerprint: rag/ is left out and the app is built without the folder search (no card, no switch).
        continue-on-error: true
        run: |
          rm -rf rag/vendor "$RUNNER_TEMP/ragv"
          if [ ! -f rag/main.js ] || [ ! -f tools/rag_vendor.sha256 ]; then echo "::warning::No rag/ here: the app is built without the folder search"; rm -rf rag; exit 0; fi
          WANT="$(head -n 1 tools/rag_vendor.sha256 | cut -d' ' -f1)"
          if curl -fsSL --retry 4 --max-time 900 -o "$RUNNER_TEMP/rag-vendor.zip" "https://github.com/DevGroup2313/Ingenium-Mac-Mini/releases/download/rag-vendor/rag-vendor.zip"; then
            GOT="$(shasum -a 256 "$RUNNER_TEMP/rag-vendor.zip" | cut -d' ' -f1)"
            if [ "$GOT" = "$WANT" ]; then
              mkdir -p "$RUNNER_TEMP/ragv" && unzip -q "$RUNNER_TEMP/rag-vendor.zip" -d "$RUNNER_TEMP/ragv"
              if [ -f "$RUNNER_TEMP/ragv/sqlite/sqlite3.wasm" ] && [ -d "$RUNNER_TEMP/ragv/models/Xenova/bge-small-en-v1.5" ]; then
                mv "$RUNNER_TEMP/ragv" rag/vendor
                echo "* The folder search carried beside the page: $(du -sh rag | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::The folder search's files are incomplete: the app is built without the folder search"; rm -rf rag
              fi
            else
              echo "::warning::The folder search's files have the fingerprint $GOT, not $WANT: the app is built without the folder search"; rm -rf rag
            fi
          else
            echo "::warning::The folder search's files could not be fetched: the app is built without the folder search"; rm -rf rag
          fi

      - name: The folder search's reranker (Hugging Face, its pinned revision, each file checked by SHA-256)
        # 6.62: the optional reranker (off until she switches it on; loaded only then), fetched from the revision tools/rag_reranker.sha256
        # names, each file checked; when a file cannot be had, the reranker is left out and the app says so if she switches it on
        continue-on-error: true
        run: |
          if [ ! -d rag/vendor ] || [ ! -f tools/rag_reranker.sha256 ]; then echo "::warning::No folder search here, so no reranker"; exit 0; fi
          # 6.64: the list read without carriage returns (a Windows checkout ends its lines with CR LF; 6.63's Windows app lost the reranker)
          tr -d '\r' < tools/rag_reranker.sha256 > "$RUNNER_TEMP/rag_reranker.sha256"
          M="$(sed -n 's/^# model //p' "$RUNNER_TEMP/rag_reranker.sha256")"; REV="$(sed -n 's/^# revision //p' "$RUNNER_TEMP/rag_reranker.sha256")"; D="rag/vendor/models/$M"; ok=1
          while read -r SUM F; do
            case "$SUM" in ''|'#'*) continue;; esac
            mkdir -p "$D/$(dirname "$F")"
            # 6.63: rag-vendor.zip carries the reranker since 6.62's vendor.json; a file already there with its fingerprint is kept
            if [ -f "$D/$F" ] && [ "$(shasum -a 256 < "$D/$F" | cut -d' ' -f1)" = "$SUM" ]; then continue; fi
            if ! curl -fsSL --retry 4 -o "$D/$F" "https://huggingface.co/$M/resolve/$REV/$F"; then ok=0; continue; fi
            GOT="$(shasum -a 256 < "$D/$F" | cut -d' ' -f1)"; [ "$GOT" = "$SUM" ] || { echo "::warning::$F has the fingerprint $GOT, not $SUM"; ok=0; }
          done < "$RUNNER_TEMP/rag_reranker.sha256"
          if [ "$ok" = 1 ]; then echo "* The reranker carried in rag/vendor (off until she switches it on): $(du -sh "$D" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          else rm -rf "$D"; echo "::warning::The reranker is left out of this app"; fi

      - name: Build the app
        run: |
          # the build number: the version, the day and this repository's run number;
          # the app shows it in About (stamped into the page) and macOS in Get Info
          V="6.80.$(date -u +%Y%m%d).${{ github.run_number }}"
          echo "INGENIUM_VERSION=$V" >> "$GITHUB_ENV"
          python3 tools/stamp_build.py ingenium.html "$V"
          echo "Fingerprint (SHA-256) of the page inside this app ($INGENIUM_CHIP): $(shasum -a 256 ingenium.html | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          INGENIUM_VERSION="$V" python3 -m PyInstaller --noconfirm --clean ingenium.spec

      - name: Put the engine and the models inside, and seal the app
        run: |
          ENGINE_NEXT="$( [ -f engine-next/${{ matrix.plat }}/llama-server ] && echo engine-next/${{ matrix.plat }} )" \
            bash tools/finish_mac_app.sh "dist/${APP_FILE}.app" engine/${{ matrix.plat }} "$RUNNER_TEMP/models"
          # 6.10.1: the Touch ID helper (tools/IngeniumKey.swift), said in the summary
          if [ -x "dist/${APP_FILE}.app/Contents/MacOS/IngeniumKey" ]; then echo "* Touch ID helper: built; on this runner it answers $("dist/${APP_FILE}.app/Contents/MacOS/IngeniumKey" info || true)" >> "$GITHUB_STEP_SUMMARY"; else echo "* Touch ID helper: NOT built" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Get Velox's speed-up file for the test (not carried in the app; checked by SHA-256)
        continue-on-error: true
        run: |
          curl -sSL --retry 4 --max-time 600 -o "$RUNNER_TEMP/speedup.gguf" "https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-DSpark-GGUF/resolve/main/LFM2.5-1.2B-Instruct-DSpark-Q4_K_M.gguf"
          echo "5cf9bb2947638dd74a47b486b817f407831c0da420aeebb6973fb66c25af51e4  $RUNNER_TEMP/speedup.gguf" | shasum -a 256 -c - || rm -f "$RUNNER_TEMP/speedup.gguf"

      - name: Self-test (the app's own engine must answer with its built-in model)
        run: |
          set +e
          WHICH=none; [ -f "dist/${APP_FILE}.app/Contents/Resources/models/builtin.json" ] && WHICH=builtin
          SPD=(); [ -f "$RUNNER_TEMP/speedup.gguf" ] && SPD=(--selftest-drafter "$RUNNER_TEMP/speedup.gguf")
          "dist/${APP_FILE}.app/Contents/MacOS/${APP_FILE}" --selftest-model "$WHICH" --selftest-out "$RUNNER_TEMP/selftest.json" "${SPD[@]}" --selftest-share
          code=$?
          set -e
          python3 - "$RUNNER_TEMP/selftest.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          t = r.get("timings") or {}
          print("### Mac (%s) self-test %s" % (__import__("os").environ.get("INGENIUM_CHIP", ""), "passed" if r.get("ok") else "FAILED"))
          print("* Engine: %s, %s" % ((r.get("engine") or {}).get("version"), (r.get("engine") or {}).get("platform")))
          print("* Model: %s, loaded in %s s" % ((r.get("builtin") or {}).get("name"), r.get("load_seconds")))
          print("* Reply: `%s` at %.1f tokens a second" % (r.get("reply"), t.get("predicted_per_second") or 0))
          print("* Refuses requests without the session key: %s" % r.get("locked"))
          th = r.get("think") or {}
          if th: print("* Thinking model %s thought (%s characters): `%s`" % (th.get("model"), th.get("chars"), (th.get("text") or "")[:90].replace("\n", " ")))
          sp = r.get("speedup") or {}
          if sp: print("* Speed-up file: %s; %.1f and %.1f tokens a second without it (before and after), %.1f with it (%s guesses taken of %s); same reply: %s%s" % (
              "used" if sp.get("used") else "NOT used", ((sp.get("without") or {}).get("per_second") or 0), ((sp.get("again") or {}).get("per_second") or 0),
              ((sp.get("with") or {}).get("per_second") or 0),
              (sp.get("with") or {}).get("accepted"), (sp.get("with") or {}).get("drafted"), sp.get("same_reply"), (" (" + sp["error"] + ")") if sp.get("error") else ""))
          sh = r.get("share") or {}
          if sh: print("* Lending its models to other devices (R74): %s; reached at %s (%s); wrong code refused: %s; reply `%s`, first word after %.2f s%s" % (
              "works" if sh.get("ok") else "FAILED", sh.get("address"), "over the network" if sh.get("over_network") else "on this machine only",
              sh.get("refuses_wrong_code"), sh.get("reply"), sh.get("first_word_seconds") or 0, (" (" + sh["error"] + ")") if sh.get("error") else ""))
          if r.get("error"): print("* Error: %s" % r["error"])
          PY
          if [ "$code" != 0 ]; then cat "$RUNNER_TEMP/selftest.json"; echo "::error::the app's engine did not answer correctly"; exit 1; fi

      # 6.10.5: the same self-test on the newer engine; it stays in the app only when it answers, and the summary sets its speed
      # beside the proven engine's on this machine
      - name: Self-test of the newer engine (kept in the app only when it answers, and is proved to be the one that answered)
        env:
          NEXT_COMMIT: 68d20b8   # llama.cpp b12000, as compiled above
        run: |
          set +e
          A="dist/${APP_FILE}.app"
          if [ ! -x "$A/Contents/MacOS/engine-next/${{ matrix.plat }}/llama-server" ]; then
            echo "### Newer engine: not in this build; the app carries the proven engine only" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          WHICH=none; [ -f "$A/Contents/Resources/models/builtin.json" ] && WHICH=builtin
          SPD=(); [ -f "$RUNNER_TEMP/speedup.gguf" ] && SPD=(--selftest-drafter "$RUNNER_TEMP/speedup.gguf")
          "$A/Contents/MacOS/${APP_FILE}" --selftest-model "$WHICH" --selftest-out "$RUNNER_TEMP/selftest-next.json" --selftest-engine newer "${SPD[@]}"
          code=$?
          python3 - "$RUNNER_TEMP/selftest-next.json" "$RUNNER_TEMP/selftest.json" "$RUNNER_TEMP/next-verdict" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, sys
          def load(p):
              try: return json.load(open(p))
              except Exception: return {}
          n, o = load(sys.argv[1]), load(sys.argv[2])
          ne, oe = n.get("engine") or {}, o.get("engine") or {}
          ps = lambda r: (r.get("timings") or {}).get("predicted_per_second") or 0
          one = lambda t: " ".join(str(t or "").split())
          # 6.11: the engine that answered must be the newer one, by its own word (the commit it was compiled from)
          commit = os.environ.get("NEXT_COMMIT", "")
          proved = ne.get("kind") == "newer" and bool(commit) and commit in str(ne.get("build") or "")
          good = bool(n.get("ok")) and proved
          open(sys.argv[3], "w").write("pass" if good else "fail")
          print("### Mac (%s) newer engine self-test %s" % (os.environ.get("INGENIUM_CHIP", ""), "passed" if good else "FAILED"))
          print("* The engine that answered: %s (%s); its own word: `%s`" % (ne.get("version"), ne.get("kind"), one(ne.get("build"))))
          if not proved: print("* It is not proved to be the newer engine (commit %s), so the app keeps the proven engine only." % commit)
          print("* The proven engine, in the self-test before: %s; its own word: `%s`" % (oe.get("version"), one(oe.get("build"))))
          print("* Reply: `%s` at %.1f tokens a second (the proven engine: %.1f on this machine; a reply of a few words, so the speeds are rough)" % (n.get("reply"), ps(n), ps(o)))
          sp, so = n.get("speedup") or {}, o.get("speedup") or {}
          if sp: print("* Speed-up file on the newer engine: %s; %.1f tokens a second without it, %.1f with it (the proven engine: %.1f and %.1f)" % (
              "used" if sp.get("used") else "NOT used", ((sp.get("without") or {}).get("per_second") or 0), ((sp.get("with") or {}).get("per_second") or 0),
              ((so.get("without") or {}).get("per_second") or 0), ((so.get("with") or {}).get("per_second") or 0)))
          if n.get("error"): print("* Error: %s" % n["error"])
          PY
          if [ "$code" != 0 ] || [ "$(cat "$RUNNER_TEMP/next-verdict" 2>/dev/null)" != pass ]; then
            cat "$RUNNER_TEMP/selftest-next.json" 2>/dev/null
            echo "::warning::the newer engine did not answer correctly, or was not proved to be the engine that answered; it is taken out, and the app carries the proven engine only"
            rm -rf "$A/Contents/MacOS/engine-next" "$A/Contents/Resources/engine-next"
            codesign --force --sign - --timestamp=none "$A" && codesign --verify --deep --strict "$A" && echo "The app's seal is whole again."
          fi
          exit 0

      - name: Check the oldest macOS each program file in the app needs
        # R74: the release says "macOS 13.3 or newer"; this proves it file by file
        run: |
          python3 - "dist/${APP_FILE}.app" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, re, subprocess, sys
          app = sys.argv[1]; worst = (0, 0); rows = []
          for root, _d, files in os.walk(app):
              for f in files:
                  p = os.path.join(root, f)
                  if os.path.islink(p) or os.path.getsize(p) < 4096:
                      continue
                  with open(p, "rb") as fh:
                      magic = fh.read(4)
                  if magic not in (b"\xcf\xfa\xed\xfe", b"\xca\xfe\xba\xbe", b"\xce\xfa\xed\xfe"):
                      continue
                  out = subprocess.run(["otool", "-l", p], capture_output=True, text=True).stdout
                  # only LC_BUILD_VERSION (minos) and LC_VERSION_MIN_MACOSX (version) state it
                  want, v = None, None
                  for line in out.splitlines():
                      t = line.strip()
                      if t in ("cmd LC_BUILD_VERSION", "cmd LC_VERSION_MIN_MACOSX"):
                          want = "minos" if t.endswith("BUILD_VERSION") else "version"
                      elif want and t.startswith(want + " "):
                          m = re.match(r"\w+ (\d+)\.(\d+)", t)
                          if m:
                              v = max(v or (0, 0), (int(m.group(1)), int(m.group(2))))
                          want = None
                  if v:
                      worst = max(worst, v)
                      rows.append((v, os.path.relpath(p, app)))
          rows.sort(reverse=True)
          print("### Oldest macOS the app runs on: %d.%d" % worst)
          for v, f in rows[:5]:
              print("* %d.%d: `%s`" % (v[0], v[1], f))
          if worst > (13, 3):
              print("* **Newer than the 13.3 the release promises.**")
              sys.exit(1)
          PY

      - name: Zip the app (alone, and with its models)
        run: |
          # R74: the app alone is the main download; it fetches its models the
          # first time it opens. The copy with the models is for a Mac without internet.
          # 6.58: the copy with the models leaves the speech models out: with them it is over GitHub's limit of 2 GB for one file
          # (2.18 GB in 6.57's run); there dictation fetches its model once. The app alone, the main download, keeps them.
          rm -rf "$RUNNER_TEMP/full" && mkdir -p "$RUNNER_TEMP/full"
          ditto "dist/${APP_FILE}.app" "$RUNNER_TEMP/full/${APP_FILE}.app"
          rm -rf "$RUNNER_TEMP/full/${APP_FILE}.app/Contents/Resources/speech" "$RUNNER_TEMP/full/${APP_FILE}.app/Contents/Frameworks/speech"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/full/${APP_FILE}.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/full/${APP_FILE}.app" "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}-with-models.zip"
          # 6.59: the folder search adds about 39 MB; should the copy with the models pass 2,140,000,000 bytes (GitHub refuses a file of
          # 2 GiB), it is made again without the folder search's third-party files, and the summary says so
          SZ=$(stat -f%z "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}-with-models.zip")
          if [ "$SZ" -gt 2140000000 ]; then
            echo "::warning::The copy with the models is $SZ bytes: made again without the folder search"
            rm -f "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}-with-models.zip"
            rm -rf "$RUNNER_TEMP/full/${APP_FILE}.app/Contents/Resources/rag" "$RUNNER_TEMP/full/${APP_FILE}.app/Contents/Frameworks/rag"
            codesign --force --sign - --timestamp=none "$RUNNER_TEMP/full/${APP_FILE}.app"
            ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/full/${APP_FILE}.app" "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}-with-models.zip"
          fi
          echo "* The copy with the models: $(stat -f%z "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}-with-models.zip") bytes" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/full"
          rm -rf "$RUNNER_TEMP/lite" && mkdir -p "$RUNNER_TEMP/lite"
          ditto "dist/${APP_FILE}.app" "$RUNNER_TEMP/lite/${APP_FILE}.app"
          rm -rf "$RUNNER_TEMP/lite/${APP_FILE}.app/Contents/Resources/models"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/lite/${APP_FILE}.app"
          # the app alone must still start and run its engine
          "$RUNNER_TEMP/lite/${APP_FILE}.app/Contents/MacOS/${APP_FILE}" --selftest-model none --selftest-out "$RUNNER_TEMP/lite.json"
          python3 -c "import json,sys;r=json.load(open(sys.argv[1]));print('* The app alone (no models): engine runs: %s' % r.get('ok'))" "$RUNNER_TEMP/lite.json" >> "$GITHUB_STEP_SUMMARY"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/lite/${APP_FILE}.app" "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}.zip"
          ls -la "$RUNNER_TEMP"/*.zip

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}.zip" "${APP_FILE}-${{ matrix.zip }}.zip"
          if [ -d "dist/${APP_FILE}.app/Contents/Resources/models" ]; then set -- "$@" "$RUNNER_TEMP/${APP_FILE}-${{ matrix.zip }}-with-models.zip" "${APP_FILE}-${{ matrix.zip }}-with-models.zip"; fi
          # R74: the name used before the app alone became the main download is retired
          OBSOLETE="${APP_FILE}-${{ matrix.zip }}-no-model.zip" bash tools/publish_release.sh Mac "$@"
