#
# The model studio, on a real open model (Ingenium 6.6): SmolLM2 135M Instruct in 16 bits (Hugging Face's own team, Apache
# 2.0; checked by the fingerprint lineup-sources.yml read), trained further on a novel in the public domain (Project
# Gutenberg) with the desktop app's own code, patched as release.py patches it (source/build/desktop/app_train_65.py and
# app_studio_65.py), by llama.cpp b11321's own trainer, the release the Mac and Windows apps carry. It reports, for each
# learning rate, the time a pass takes and the model before and after: perplexity on part of the novel it never trains on,
# a passage begun in the novel's words, and a question in chat (source/rig/studio_check.py). It builds and publishes nothing.
name: The model studio, on a real model

on:
  push:
    branches: ['**']
    paths:
      - 'source/build/desktop/app_train_65.py'
      - 'source/build/desktop/app_studio_65.py'
      - 'source/rig/studio_check.py'
      - '.github/workflows/studio-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Get the sources
        uses: actions/checkout@v5

      - name: llama.cpp's trainer, from the build cache when it was compiled before
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/llama-bin
          key: studio-llama-b11321-linux-v1

      - name: Compile llama.cpp b11321 (the trainer, perplexity and the server; only when not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/llama.cpp-b11321"
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch b11321 https://github.com/ggml-org/llama.cpp "$src"
          got="$(git -C "$src" rev-parse HEAD)"
          case "$got" in b0aca3c*) echo "Source checked: commit ${got:0:7}." ;; *) echo "::error::the source is not the expected commit ($got)"; exit 1 ;; esac
          cmake -S "$src" -B "$RUNNER_TEMP/llama-build" -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_NATIVE=OFF > "$RUNNER_TEMP/cmake.log" 2>&1 || { tail -40 "$RUNNER_TEMP/cmake.log"; exit 1; }
          cmake --build "$RUNNER_TEMP/llama-build" --config Release --target llama-finetune llama-perplexity llama-server -j 4 > "$RUNNER_TEMP/build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/llama-bin"
          cp -a "$RUNNER_TEMP/llama-build/bin/." "$RUNNER_TEMP/llama-bin/"
          ls "$RUNNER_TEMP/llama-bin"

      - name: SmolLM2 135M Instruct, 16 bits (checked by its fingerprint)
        run: |
          f="$RUNNER_TEMP/SmolLM2-135M-Instruct-f16.gguf"
          curl -fsSL --retry 4 -o "$f" "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-f16.gguf"
          echo "f535f83ec568d040f88ddc04a199fa6da90923bbb41d4dcaed02caa924d6ef57  $f" | sha256sum -c -
          ls -la "$f"

      - name: A novel in the public domain (Project Gutenberg, Pride and Prejudice)
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/novel.txt" "https://www.gutenberg.org/cache/epub/1342/pg1342.txt"
          wc -c "$RUNNER_TEMP/novel.txt"

      - name: Train it further with the app's own code, and measure it before and after
        timeout-minutes: 100
        run: |
          python3 source/rig/studio_check.py "$RUNNER_TEMP/llama-bin" "$RUNNER_TEMP/SmolLM2-135M-Instruct-f16.gguf" "$RUNNER_TEMP/novel.txt" "$RUNNER_TEMP/studio" 3e-6 1e-6 1e-5:8 3e-6:8
          rc=$?
          { echo '### The model studio, on SmolLM2 135M Instruct'; echo '```'; cat "$RUNNER_TEMP/studio/studio.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Keep the report with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-check
          path: ${{ runner.temp }}/studio/studio.txt
          if-no-files-found: ignore
