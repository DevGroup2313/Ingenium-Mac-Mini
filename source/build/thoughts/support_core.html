<script id="sc-core">
/* THE SUPPORT MODULE · see the note at the top of its styles. One factory, SupportCore.create(host). */
(function(){
"use strict";
if(window.SupportCore)return;
var LANGF=null;
function isFr(){try{return !!(LANGF&&LANGF()==="fr");}catch(e){return false;}}
function T(en,fr){return isFr()?fr:en;}
function el(tag,cls,attrs,kids){var n=document.createElement(tag);if(cls)n.className=cls;
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==="text")n.textContent=v;else if(k==="on")for(var e in v)n.addEventListener(e,v[e]);else n.setAttribute(k,v===true?"":v);}
  (kids||[]).forEach(function(c){if(c)n.appendChild(typeof c==="string"?document.createTextNode(c):c);});return n;}
function pad(n){return ("0"+n).slice(-2);}
function dayStr(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function hhmm(d){d=d||new Date();try{return d.toLocaleTimeString(isFr()?"fr-FR":undefined,{hour:"numeric",minute:"2-digit"});}catch(e){return pad(d.getHours())+":"+pad(d.getMinutes());}}
function mins(n){n=Math.max(0,Math.round(n));var h=Math.floor(n/60),m=n%60;return h?(h+" h"+(m?" "+m+" min":"")):(m+" min");}
function span(ms){var m=Math.round(ms/6e4);if(m<1)return T("less than a minute","moins d’une minute");return mins(m);}
function hm(s){var m=/(\d{1,2})[:h](\d{2})/.exec(String(s||""));return m?(+m[1])*60+(+m[2]):null;}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function trunc(t,n){t=String(t||"").replace(/\s+/g," ").trim();return t.length>n?t.slice(0,n-1).trimEnd()+"…":t;}

/* the seven supports, each with its own switch */
var DEF={calm:false,tiny:true,time:true,energy:true,inbox:true,routines:true,focus:true};
function rows(dayWord){return [
  ["calm","🌿",T("Calm mode","Mode calme"),T("No motion, no sounds, softer colours and fewer things on the screen at once. Turn it on when the room feels loud.","Aucun mouvement, aucun son, des couleurs adoucies et moins de choses à l’écran. Activez-le quand la pièce semble bruyante.")],
  ["tiny","🪜",T("Smaller steps","Petites étapes"),T("Break any task into small steps, shown one at a time, with a two-minute Just start.","Découpez une tâche en petites étapes, montrées une à la fois, avec un Juste commencer de deux minutes.")],
  ["time","⏳",T("Time you can see","Le temps visible"),T("A bar of the time left in the current block, the next item, and a quiet word five minutes before it.","Une barre du temps restant dans le bloc en cours, le prochain moment, et un mot discret cinq minutes avant.")],
  ["energy","🔋",T("Low-energy days","Jours de faible énergie"),T("One press, and the day keeps only what is essential. The next morning starts afresh.","Une pression, et la journée ne garde que l’essentiel. Le lendemain matin repart à neuf.")],
  ["inbox","💭",T("The Inbox","La Boîte"),T("Catch a thought with Ctrl and the full stop, or the 💭 at the side, and sort it later.","Saisissez une pensée avec Ctrl et le point, ou le 💭 sur le côté, et triez plus tard.")],
  ["routines","🌅",T("Routines","Routines"),T("Step-by-step routines for starting and ending the "+dayWord.en+", offered at the right hour.","Des routines pas à pas pour commencer et finir la "+dayWord.fr+", proposées au bon moment.")],
  ["focus","🎧",T("Focus room","Salle de concentration"),T("A quiet full-screen space with one task, the timer and a soft sound made on this device.","Un espace plein écran et calme, avec une tâche, le minuteur et un son doux fait sur cet appareil.")]];}

/* smaller steps, offered from the words of the task when no model is asked */
function stepTemplates(title){var t=String(title||"");
  if(/\b(code|bug|build|app|feature|test|commit|release|deploy|fix|function|script|css|html|page|screen|button|room|editor|bakery|workshop|repo|github)\w*/i.test(t))
    return T("Open the file and find the place|Read the last thing you changed|Write the smallest piece that works|Run it and look at the result|Save, and note what comes next","Ouvrir le fichier et trouver l’endroit|Relire le dernier changement|Écrire le plus petit morceau qui marche|Le lancer et regarder le résultat|Enregistrer, et noter la suite").split("|");
  if(/writ|draft|ink|sentence|essay|proposal|synthesis|chapter|report|letter|thesis|paper|abstract|écri|rédig|chapitre|mémoire|thèse|lettre/i.test(t))
    return T("Open the document|Read the last paragraph you wrote|Write one rough sentence|Write the next sentence","Ouvrir le document|Relire le dernier paragraphe écrit|Écrire une phrase brouillonne|Écrire la phrase suivante").split("|");
  if(/read|book|article|page|librar|lire|livre|lecture/i.test(t))
    return T("Find the book and your place|Read one page|Mark one line that matters|Read the next page","Trouver le livre et la page|Lire une page|Marquer une ligne qui compte|Lire la page suivante").split("|");
  if(/call|phone|email|e-mail|message|reply|text|appel|téléphon|courriel|répond/i.test(t))
    return T("Find the number or the message|Write the first line|Send it","Trouver le numéro ou le message|Écrire la première ligne|L’envoyer").split("|");
  if(/clean|tidy|wash|laundry|kitchen|dishes|ranger|nettoy|lessive|vaisselle/i.test(t))
    return T("Choose one small area|Put away five things|Wipe the one surface|Look, and choose the next area","Choisir un petit coin|Ranger cinq choses|Essuyer une seule surface|Regarder, et choisir le coin suivant").split("|");
  if(/walk|stretch|lunch|tea|agora|move|break|marche|pause|déjeuner|thé/i.test(t))
    return T("Stand up|Shoes on, or the kettle on|Go","Se lever|Chaussures, ou la bouilloire|Y aller").split("|");
  return T("Open what you need|Do the smallest first part, two minutes|Decide the next small part","Ouvrir ce qu’il faut|Faire la toute première partie, deux minutes|Choisir la petite partie suivante").split("|");}

/* a soft sound made on the device, so the Focus room works offline */

  function build(k){if(k==="low")return cardLow();var f=CARDS[k],extra=(hv(H.extraCards)||{})[k];
    try{return extra?extra({T:T,btn:btn,card:card,rowsInto:rowsInto,refresh:refresh}):(f?f():null);}catch(e){try{console.warn("support card",k,e);}catch(x){}return null;}}
  /* v2: an app that keeps its own Focus page can take single cards into places of its own: mount({routines:el,...}).
     Each card is drawn inside its own small page (so it wears the same dress), and is drawn again with the rest. */
  var mounts=null;
  function mount(map){mounts=map||null;drawMounts();}
  function hosts(){var out=root?[root]:[];if(mounts)Object.keys(mounts).forEach(function(k){if(mounts[k])out.push(mounts[k]);});return out;}
  function drawMounts(){if(!mounts)return;Object.keys(mounts).forEach(function(k){var hst=mounts[k];if(!hst)return;
      var shown=k==="low"||layout().indexOf(k)>=0,n=shown?build(k):null;
      if(!n){if(hst.firstChild)hst.innerHTML="";hst.hidden=true;return;}
      var pg=el("div","sc-page sc-solo",{"data-sc-app":app,"data-sc-night":night()?"1":"0","data-sc-still":still()?"1":"0",lang:isFr()?"fr":"en"});pg.appendChild(n);
      hst.hidden=false;var old=hst.firstChild;if(old&&old.classList&&old.classList.contains("sc-page"))hst.replaceChild(pg,old);else{hst.innerHTML="";hst.appendChild(pg);}});}
  /* drawn again after each press; the clock alone ticks between, so a half-typed word is never lost */
  function busyTyping(){var a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"&&hosts().some(function(h){return h.contains(a);}));}
  function visible(){return hosts().some(function(h){return h.offsetParent!==null&&h.getClientRects().length;});}
  function refresh(){if(!root&&!mounts)return;if(busyTyping()){paintClocks();return;}if(root)render();drawMounts();}
  function paintClocks(){hosts().forEach(function(h){[].forEach.call(h.querySelectorAll('[data-sc-clock]'),function(n){var t=hhmm();if(n.textContent!==t)n.textContent=t;});});}
  var lastSig="";
  function tick(){try{applyAll();}catch(e){}
    if(visible()){var m=tm(),sig=hhmm()+"|"+(m?(m.running?Math.floor(m.remaining/30):"p"+m.remaining):"")+"|"+(tc()?tc().list().length+(tc().draft()?"d":""):"")+"|"+isFr()+"|"+night();
      if(sig!==lastSig){lastSig=sig;refresh();}}}
  function applyAll(){var c=on("calm");try{document.documentElement.toggleAttribute("data-sc-calm",c);}catch(e){}try{H.applyCalm&&H.applyCalm(c);}catch(e){}
    var l=lowToday();try{document.body.toggleAttribute("data-sc-low",l);}catch(e){}try{H.applyLow&&H.applyLow(l);}catch(e){}}
  setInterval(tick,5000);setInterval(warnSoon,30000);setTimeout(warnSoon,4000);setTimeout(applyAll,0);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)setTimeout(tick,300);});

  return {render:render,refresh:refresh,mount:mount,card:build,tick:tick,on:on,set:setOn,rows:myRows,lowToday:lowToday,setLow:setLow,
    routines:routines,runRoutine:runRoutine,editRoutines:editRoutines,suggestedRoutine:suggested,rName:rName,openFocus:openFocus,closeFocus:closeFocus,
    justStart:justStart,stopJust:stopJust,quiet:quiet,closeQuiet:closeQuiet,timeBar:timeBar,timeModel:timeModel,nextTask:nextTask,plan:plan,
    tasks:tasks,current:cur,newTask:newTask,fromPlan:fromPlan,steps:stepTemplates,applyAll:applyAll,sheet:sheet,closeSheet:closeSheet,T:T,store:S,toast:toast};}

window.SupportCore={create:create,v:2};
})();
