  return conv({id:String(name).replace(/\.[^.]+$/,"")+"#"+hash36(text),title:title||String(name).replace(/\.[^.]+$/,""),messages:merge(out)});}
/* Claude Code: a session's transcript as it keeps it on the computer (~/.claude/projects/<folder>/<session>.jsonl): one line

function claudeCode(lines,name){var ses={},order=[],sums={};
  lines.forEach(function(o){if(!o)return;if(o.type==="summary"){if(o.leafUuid)sums[o.leafUuid]=String(o.summary||"");return;}
    var m=o.message;if(!m||!m.role||o.isMeta)return;var sid=o.sessionId||name;if(!ses[sid]){ses[sid]={id:sid,msgs:[],uuids:{},cwd:"",branch:"",version:"",model:""};order.push(sid);}
    var s=ses[sid];if(o.uuid)s.uuids[o.uuid]=1;if(o.cwd&&!s.cwd)s.cwd=String(o.cwd);if(o.gitBranch&&!s.branch)s.branch=String(o.gitBranch);if(o.version&&!s.version)s.version=String(o.version);if(m.model)s.model=String(m.model);
    var at=ms(o.timestamp),text="",think="",tools=[];

    else if(Array.isArray(m.content))m.content.forEach(function(p){if(!p)return;
      if(p.type==="text")text+=(text?"\n\n":"")+String(p.text||"");
      else if(p.type==="thinking")think+=(think?"\n\n":"")+String(p.thinking||"");
      else if(p.type==="tool_use"){var inp=p.input||{},what=inp.file_path||inp.path||inp.command||inp.pattern||inp.query||inp.url||inp.description||"";text+=(text?"\n":"")+"[used "+(p.name||"a tool")+(what?": "+String(what).slice(0,200):"")+"]";}
      else if(p.type==="tool_result"){var r=Array.isArray(p.content)?p.content.map(function(x){return x&&x.text?x.text:"";}).join("\n"):String(p.content||"");if(r)tools.push(r);}});
    if(m.role==="user"){
      if(tools.length){var last=s.msgs[s.msgs.length-1];if(last&&last.role==="assistant")last.text+=(last.text?"\n":"")+"[the tool answered]\n"+tools.join("\n").slice(0,3000);}
      text=String(text).trim();if(!text||/^<(command-|local-command-|system-reminder)/.test(text))return;
      s.msgs.push({role:"user",text:text,at:at,files:[]});}
    else if(m.role==="assistant"){if(!text&&!think)return;s.msgs.push({role:"assistant",text:text,think:think,at:at,files:[]});}});
  return order.map(function(sid){var s=ses[sid],title="";for(var u in sums)if(s.uuids[u]){title=sums[u];break;}
    var first=s.msgs.filter(function(x){return x.role==="user";})[0];if(!title&&first)title=first.text.replace(/\s+/g," ").slice(0,70);
    var notes=[];if(s.cwd)notes.push("A Claude Code session"+(s.version?" (Claude Code "+s.version+")":"")+", working in "+s.cwd+(s.branch?" on branch "+s.branch:"")+".");
    return conv({id:sid,title:title,created:s.msgs[0]?s.msgs[0].at:0,updated:s.msgs.length?s.msgs[s.msgs.length-1].at:0,model:s.model,messages:merge(s.msgs),notes:notes});}).filter(function(c){return c.messages.length;});}
/* Microsoft Copilot's export, and any table of messages */
function csvRows(text){var rows=[],row=[],f="",q=false;for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;continue;}
    if(ch==='"')q=true;else if(ch===","){row.push(f);f="";}else if(ch==="\n"){row.push(f.replace(/\r$/,""));rows.push(row);row=[];f="";}else f+=ch;}

function csv(text,name){var rows=csvRows(text);if(rows.length<2)return [];var h=rows[0].map(function(x){return x.trim().toLowerCase();});
  function col(re){for(var i=0;i<h.length;i++)if(re.test(h[i]))return i;return -1;}
  var cc=col(/conversation|thread|chat|session|title/),rc=col(/role|author|sender|from|speaker/),tc=col(/message|content|text|body|prompt/),dc=col(/time|date/);
  if(tc<0)return [];var by={},order=[];
  rows.slice(1).forEach(function(r){if(!r[tc])return;var k=cc>=0?r[cc]:name;if(!by[k]){by[k]={id:k,title:cc>=0?k:name,messages:[]};order.push(k);}
    by[k].messages.push({role:roleOf(rc>=0?r[rc]:"")||(by[k].messages.length%2?"assistant":"user"),text:r[tc],at:dc>=0?ms(r[dc]):0,files:[]});});
  return order.map(function(k){var c=by[k];c.created=c.messages[0].at;c.updated=c.messages[c.messages.length-1].at;c.messages=merge(c.messages);return conv(c);});}

/* ---------- 4. reading what was chosen ---------- */
function Found(){this.source="";this.conversations=[];this.projects=[];this.notes=[];this.files={};this.skipped=[];}
Found.prototype.add=function(c,src){if(!c||!c.messages||!c.messages.length)return;c.source=c.source||src||this.source;this.conversations.push(c);};
function kindOfItem(o){if(!o||typeof o!=="object")return "";if(o.mapping&&("current_node" in o||o.conversation_id||o.create_time))return "chatgpt";
  if(o.mapping&&o.inserted_at!=null)return "deepseek";if(o.chat_messages)return "claude";if(o.responses&&o.conversation)return "grok";
  if(o.header&&o.title&&o.time)return "gemini";if(o.messages||o.turns)return "generic";return "";}
var NAMES={chatgpt:"ChatGPT",claude:"Claude",claudecode:"Claude Code",deepseek:"DeepSeek",grok:"Grok",gemini:"Gemini",generic:"",copilot:"Copilot"};
function srcFromName(n){n=String(n||"").toLowerCase();return /chatgpt|openai/.test(n)?"ChatGPT":/claude.?code|\/\.claude\//.test(n)?"Claude Code":/claude|anthropic/.test(n)?"Claude":/gemini|bard|takeout/.test(n)?"Gemini":/grok|x\.ai|xai/.test(n)?"Grok":/deepseek/.test(n)?"DeepSeek":/le.?chat|mistral/.test(n)?"Le Chat":/copilot|bing/.test(n)?"Copilot":/perplexity/.test(n)?"Perplexity":/kimi|moonshot/.test(n)?"Kimi":/\bpoe\b/.test(n)?"Poe":/meta.?ai|llama/.test(n)?"Meta AI":/qwen/.test(n)?"Qwen":/huggingchat/.test(n)?"HuggingChat":"";}
/* one JSON stream: the conversations it holds, whatever assistant wrote them */
function readJsonInto(found,stream,name,progress){var gem=[];
  return readJSON(stream,function(o,whole){
    if(whole){/* a JSON object that is not a list: Grok's {conversations:[...]}, Claude's or ChatGPT's single conversation, a list of messages */
      if(Array.isArray(o.conversations)){o.conversations.forEach(function(x){var k=kindOfItem(x);one(found,x,k,name,gem);});return;}
      var k0=kindOfItem(o);if(k0){one(found,o,k0,name,gem);return;}
      if(Array.isArray(o.chats))o.chats.forEach(function(x){one(found,x,kindOfItem(x)||"generic",name,gem);});return;}
    var k=kindOfItem(o);
    if(!k&&o&&(o.role||o.author)&&(o.content!=null||o.text!=null)){(found.__loose=found.__loose||[]).push(o);return;}
    one(found,o,k,name,gem);if(progress&&found.conversations.length%25===0)progress(found);})
  .then(function(){if(gem.length)gatherByTime(gem,"Gemini").forEach(function(c){found.add(c,"Gemini");});
    if(found.__loose){var g=generic({messages:found.__loose},name);if(g)found.add(g,srcFromName(name));delete found.__loose;}});}
function one(found,o,k,name,gem){try{
  if(k==="chatgpt")found.add(chatgpt(o),"ChatGPT");else if(k==="claude")found.add(claude(o),"Claude");else if(k==="deepseek")found.add(deepseek(o),"DeepSeek");
  else if(k==="grok")found.add(grok(o),"Grok");
  else if(k==="gemini"){var t=String(o.title||""),m=/^(Prompted|Asked|Said)\s+([\s\S]*)$/i.exec(t);if(m&&/gemini|bard/i.test((o.header||"")+(o.products||[]).join(" ")))gem.push({at:ms(o.time),q:m[2].trim(),a:(o.safeHtmlItem||[]).map(function(h){return htmlText(h.html);}).join("\n\n"),files:[]});}
  else if(k==="generic"){var g=generic(o,name);if(g)found.add(g,srcFromName(name)||"another assistant");}
  else if(o&&o.uuid&&o.docs){found.projects=found.projects.concat(claudeProjects([o]));}}catch(e){found.skipped.push((o&&(o.title||o.name))||"a conversation");}}
function fileStream(f,budget){var st=f.stream?f.stream():new Response(f).body;return capStream(st,budget,f&&f.name);}
/* the text files a ChatGPT export keeps beside its conversations (named by the attachment's id), read when small */
var TEXTY=/\.(txt|md|markdown|csv|tsv|json|js|mjs|ts|tsx|jsx|py|html?|css|java|kt|swift|c|cc|cpp|h|go|rs|rb|php|sh|yml|yaml|xml|sql|toml|ini)$/i;
function readFiles(files,progress){var found=new Found(),list=[].slice.call(files||[]),budget=new Budget();
  return list.reduce(function(p,f){return p.then(function(){var n=f.name||"file";
      if(/\.zip$/i.test(n)||f.type==="application/zip"){var z=new Zip(f);z.budget=budget;return z.open().then(function(es){
          found.source=found.source||srcFromName(n);
          var conv1=es.filter(function(e){return /(^|\/)conversations?\.json$/i.test(e.name)||/(^|\/)prod-grok-backend\.json$/i.test(e.name);});
          var gem=es.filter(function(e){return /Gemini Apps\/MyActivity\.(json|html)$/i.test(e.name)||/Bard\/MyActivity\.(json|html)$/i.test(e.name);});
          var proj=es.filter(function(e){return /(^|\/)projects\.json$/i.test(e.name);});
          var other=!conv1.length&&!gem.length?es.filter(function(e){return /\.(json|jsonl|md|markdown|txt|csv|html?)$/i.test(e.name)&&e.size<480*1048576&&!/(^|\/)(users?|message_feedback|shared_conversations|model_comparisons)\.json$/i.test(e.name);}):[];
          found.zip=z;found.zipEntries=es;
          var seq=Promise.resolve();
          conv1.forEach(function(e){seq=seq.then(function(){return z.stream(e).then(function(st){return readJsonInto(found,st,e.name,progress);});});});
          gem.forEach(function(e){seq=seq.then(function(){return /\.json$/i.test(e.name)?z.stream(e).then(function(st){return readJsonInto(found,st,e.name,progress);}):z.text(e).then(function(t){geminiHtml(t).forEach(function(c){found.add(c,"Gemini");});});});});
          proj.forEach(function(e){seq=seq.then(function(){return z.text(e).then(function(t){try{found.projects=found.projects.concat(claudeProjects(JSON.parse(t)));}catch(x){}});});});
          other.forEach(function(e){seq=seq.then(function(){return z.stream(e).then(function(st){return readOne(found,st,e.name,progress);});});});
          return seq;});}
      return readOne(found,fileStream(f,budget),n,progress);});},Promise.resolve())
    .then(function(){return attachFromZip(found);}).then(function(){found.conversations.sort(function(a,b){return (b.updated||0)-(a.updated||0);});
      if(!found.source){var c={};found.conversations.forEach(function(x){c[x.source]=(c[x.source]||0)+1;});found.source=Object.keys(c).sort(function(a,b){return c[b]-c[a];})[0]||"another assistant";}
      return found;});}
function readOne(found,stream,n,progress){
  if(/\.json$/i.test(n)){var n0j=found.conversations.length,p0j=found.projects.length;return readJsonInto(found,stream,n,progress).then(function(){if(found.conversations.length===n0j&&found.projects.length===p0j)found.skipped.push(n);});}
  return new Response(stream).text().then(function(t){
    if(/\.jsonl$/i.test(n)){var loose=[],cc=[],n0=found.conversations.length;t.split(/\r?\n/).forEach(function(l){if(!l.trim())return;try{var o=JSON.parse(l);
        if(o&&o.type&&((o.message&&o.message.role)||o.type==="summary")&&(o.sessionId||o.leafUuid||o.uuid)){cc.push(o);return;}
        var k=kindOfItem(o);if(k)one(found,o,k,n,[]);else if(o.role||o.author)loose.push(o);}catch(e){}});
      if(cc.length)claudeCode(cc,n).forEach(function(c){found.add(c,"Claude Code");});
      if(loose.length){var g=generic({messages:loose},n);if(g)found.add(g,srcFromName(n)||"another assistant");}
      if(found.conversations.length===n0)found.skipped.push(n);return;}
    if(/\.csv$/i.test(n)){csv(t,n).forEach(function(c){found.add(c,srcFromName(n)||"Copilot");});return;}
    if(/\.html?$/i.test(n)){var m=/var\s+jsonData\s*=\s*(\[[\s\S]*?\]);\s*\n/.exec(t);if(m){try{JSON.parse(m[1]).forEach(function(o){one(found,o,kindOfItem(o),n,[]);});return;}catch(e){}}
      var gs=geminiHtml(t);if(gs.length){gs.forEach(function(c){found.add(c,"Gemini");});return;}
      var tr=transcript(htmlText(t),n);if(tr)found.add(tr,srcFromName(n)||"another assistant");return;}
    var x=transcript(t,n);if(x)found.add(x,srcFromName(n)||srcFromName(t.slice(0,4000))||"another assistant");else found.skipped.push(n);});}
function attachFromZip(found){if(!found.zip)return Promise.resolve();var es=found.zipEntries,want=[];
  found.conversations.forEach(function(c){c.messages.forEach(function(m){(m.files||[]).forEach(function(f){if(f.text||!f.id)return;
      var e=es.filter(function(x){var b=x.name.split("/").pop();return b.indexOf(f.id)===0;})[0];if(e&&e.size<2*1048576&&(TEXTY.test(f.name)||TEXTY.test(e.name)))want.push({f:f,e:e});});});});
  return want.reduce(function(p,w){return p.then(function(){return found.zip.text(w.e).then(function(t){w.f.text=t;},function(){});});},Promise.resolve());}

function day(t){if(!t)return "";try{return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});}catch(e){return "";}}
var FILE_RE=/\b[\w.-]+\.(?:html?|css|js|mjs|ts|tsx|jsx|py|java|kt|swift|c|cc|cpp|h|go|rs|rb|php|json|md|sql|ya?ml|sh)\b/g;
/* the handoff brief: written here, from the conversation itself */
function brief(c){var me=c.messages.filter(function(m){return m.role==="user"&&String(m.text||"").trim();}),ai=c.messages.filter(function(m){return m.role==="assistant"&&String(m.text||"").trim();});
  function cut(t,n){t=String(t||"").replace(/\s+/g," ").trim();return t.length>n?t.slice(0,n-1)+"…":t;}
  var files={},langs={};c.messages.forEach(function(m){var t=String(m.text||"");(t.match(FILE_RE)||[]).forEach(function(f){files[f]=(files[f]||0)+1;});
    var re=/```([\w+#.-]*)\n/g,x;while((x=re.exec(t)))if(x[1])langs[x[1].toLowerCase()]=(langs[x[1].toLowerCase()]||0)+1;
    (m.files||[]).forEach(function(f){files[f.name]=(files[f.name]||0)+1;});});
  var L=[];
  L.push(c.messages.length+" messages"+(c.created?", "+day(c.created)+(c.updated&&day(c.updated)!==day(c.created)?" to "+day(c.updated):""):"")+(c.model?", with "+c.model:"")+".");
  if(me.length)L.push("It began: \""+cut(me[0].text,320)+"\"");
  if(me.length>1)L.push("The last request: \""+cut(me[me.length-1].text,420)+"\"");
  if(ai.length)L.push("The last reply began: \""+cut(ai[ai.length-1].text,420)+"\"");
  var fl=Object.keys(files).sort(function(a,b){return files[b]-files[a];}).slice(0,12);if(fl.length)L.push("Files it worked on: "+fl.join(", ")+".");
  var lg=Object.keys(langs).sort(function(a,b){return langs[b]-langs[a];}).slice(0,6);if(lg.length)L.push("Code in it: "+lg.join(", ")+".");
  if(c.notes&&c.notes.length)L.push(c.notes.slice(0,3).map(function(n){return cut(n,400);}).join("\n"));
  return L.join("\n");}
window.ChatImportCore={read:readFiles,brief:brief,day:day,Zip:Zip,srcFromName:srcFromName,
  parsers:{chatgpt:chatgpt,claude:claude,claudeProjects:claudeProjects,claudeCode:claudeCode,deepseek:deepseek,grok:grok,generic:generic,transcript:transcript,csv:csv,gemini:geminiRecords,geminiHtml:geminiHtml}};
