<style id="permit-core-css">
/* PermitCore: the owner's licence and the owner's permissions, shared by Ingenium and The Forge (each draws it in its own card) */
.pc-card .pc-sub{margin:14px 0 4px;font-weight:700;font-size:13px;letter-spacing:.01em}
.pc-card .pc-line{margin:4px 0;line-height:1.5}
.pc-card .pc-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.pc-card details.pc-text{margin:8px 0}
.pc-card details.pc-text>summary{cursor:pointer;font-weight:600}
.pc-card .pc-licence{white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:420px;overflow:auto;
  padding:10px 12px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:8px;margin:8px 0}
/* 6.7: the licence laid out as a document (licenceDoc below): its contents, the plain words in a box, serif headings, numbered clauses */
.pc-card .pc-doc{max-height:min(70vh,640px);overflow:auto;padding:16px 18px 18px;margin:8px 0;border-radius:12px;
  border:1px solid var(--hairline,color-mix(in srgb,currentColor 16%,transparent));background:var(--card-hi,transparent);
  font:14.5px/1.62 var(--sans,system-ui,sans-serif);color:var(--ink-body,inherit)}
.pc-card .pc-doc:focus-visible{outline:3px solid var(--accent,currentColor);outline-offset:2px}
.pc-card .pc-doc .pcd-app{font:600 12px/1.3 var(--sans,system-ui,sans-serif);letter-spacing:.24em;text-transform:uppercase;color:var(--accent,inherit);margin:0}
.pc-card .pc-doc .pcd-title{font:700 21px/1.25 var(--serif,Georgia,serif);margin:4px 0 2px;color:var(--ink-1,inherit)}
.pc-card .pc-doc .pcd-meta{margin:0 0 2px;color:var(--ink-3,inherit);font-size:13px}
.pc-card .pc-doc .pcd-plain{margin:14px 0 6px;padding:12px 16px 10px;border-radius:12px;background:var(--accent-softer,transparent);
  border:1px solid var(--accent-soft,color-mix(in srgb,currentColor 14%,transparent))}
.pc-card .pc-doc .pcd-plain h4{margin:0 0 6px;font:700 15px/1.3 var(--serif,Georgia,serif);color:var(--ink-1,inherit)}
.pc-card .pc-doc .pcd-plain ul{margin:0;padding-left:20px}
.pc-card .pc-doc .pcd-plain li{margin:3px 0}
.pc-card .pc-doc .pcd-note{font-size:13px;color:var(--ink-3,inherit);font-style:italic;margin:6px 0 0}
.pc-card .pc-doc .pcd-toc{margin:12px 0 4px}
.pc-card .pc-doc .pcd-toc>summary{cursor:pointer;font-weight:700;padding:4px 0}
.pc-card .pc-doc .pcd-toc ol{margin:6px 0 0;padding-left:0;list-style:none;columns:2 260px;column-gap:24px}
.pc-card .pc-doc .pcd-toc li{margin:0 0 4px;break-inside:avoid}
.pc-card .pc-doc .pcd-toc button{all:unset;cursor:pointer;color:var(--accent,inherit);text-decoration:underline;text-underline-offset:2px;line-height:1.4;padding:2px 0}
.pc-card .pc-doc .pcd-toc button:focus-visible{outline:2px solid var(--accent,currentColor);outline-offset:2px;border-radius:3px}
.pc-card .pc-doc .pcd-part{margin:22px 0 6px;padding-top:10px;border-top:1px solid var(--gold-ring,color-mix(in srgb,currentColor 20%,transparent));
  font:700 12px/1.3 var(--sans,system-ui,sans-serif);letter-spacing:.16em;text-transform:uppercase;color:#76570f}
body[data-theme="night"] .pc-card .pc-doc .pcd-part{color:var(--gold-ink,#caa24a)}
.pc-card .pc-doc .pcd-h{margin:16px 0 6px;font:700 16px/1.3 var(--serif,Georgia,serif);color:var(--ink-1,inherit);scroll-margin-top:8px}
.pc-card .pc-doc .pcd-h:focus{outline:none}
.pc-card .pc-doc .pcd-h:focus-visible{outline:2px solid var(--accent,currentColor);outline-offset:3px;border-radius:3px}
.pc-card .pc-doc p{margin:6px 0}
.pc-card .pc-doc .pcd-cl{display:grid;grid-template-columns:3.2em 1fr;gap:0 4px;margin:7px 0}
.pc-card .pc-doc .pcd-cl>b{font-variant-numeric:tabular-nums;color:var(--ink-2,inherit)}
.pc-card .pc-doc ol.pcd-list{list-style:none;margin:4px 0 8px;padding-left:3.2em}
.pc-card .pc-doc ol.pcd-list>li{display:grid;grid-template-columns:2.2em 1fr;margin:3px 0}
.pc-card .pc-doc ol.pcd-list>li>span{color:var(--ink-2,inherit)}
.pc-card .pc-doc .pcd-foot{margin:22px 0 0;padding-top:10px;border-top:1px solid var(--hairline,color-mix(in srgb,currentColor 16%,transparent));font-weight:600}
@media (max-width:520px){.pc-card .pc-doc{padding:12px 12px 14px;font-size:15px}.pc-card .pc-doc .pcd-cl{grid-template-columns:2.8em 1fr}
  .pc-card .pc-doc ol.pcd-list{padding-left:1.2em}}
.pc-card .pc-list{display:grid;gap:8px;margin:8px 0}
.pc-card .pc-item{padding:9px 11px;border:1px solid color-mix(in srgb,currentColor 16%,transparent);border-radius:9px;line-height:1.45}
.pc-card .pc-item b{font-weight:700}
.pc-card .pc-state{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;
  border:1px solid currentColor}
.pc-card .pc-state.ok{color:#1d7a46}.pc-card .pc-state.bad{color:#b3261e}.pc-card .pc-state.old{color:#8a5a00}
.pc-card .pc-form{display:grid;gap:8px;margin:8px 0;max-width:560px}
.pc-card .pc-form label{display:grid;gap:3px;font-size:12.5px}
.pc-card .pc-form input[type=text],.pc-card .pc-form input[type=password],.pc-card .pc-form input[type=date]{font:inherit;padding:6px 8px;border-radius:7px;
  border:1px solid color-mix(in srgb,currentColor 30%,transparent);background:transparent;color:inherit}
.pc-card .pc-checks{display:flex;gap:6px 14px;flex-wrap:wrap}
.pc-card .pc-checks label{display:flex;gap:5px;align-items:center;font-size:12.5px}
.pc-card .pc-say{min-height:1.4em;margin:6px 0}
.pc-card .pc-say.bad{color:#b3261e}
.pc-card .pc-fp{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
</style>
<script>
/* ============ PermitCore · the owner's licence and permissions (Ingenium 6.2 and The Forge 644, 23 October 2026) ============

   anything with it, no one else has that right and should not ever have access unless I grant them limited persmission that I
   can discontinue at any time. I want that made explicit for all of my apps."
   What each app carries:
   - its licence (version 3 from 6.7), whole and laid out as a document, with a key to save it, and the edition and build of this copy;
   - the owner's public keys, written in when the app is built (security/owner_keys.json). A permission is a small file signed
     with the owner's key: it names one person, the apps, what it allows, the day it begins and the day it ends, and its own
     number. The app checks the signature and the dates, and the owner's list of withdrawn permissions, which travels the same

     one letter, does not check;

     (PBKDF2, 600,000 rounds, with AES-GCM), with a backup file the owner keeps; it gives a permission, and withdraws one.
