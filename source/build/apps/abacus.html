var el=document.querySelector('.sheet td,.rib-tab,.tab,label,.sub,.hint,.status,p')||document.body;

function foot(){try{

   whatever it shows sits on the page. Gated on the app's own elements so Tabula, which owns

   routine no longer repaints them. */

<script id="cd-cd-foot">(function(){
/* The owner wants the bottom rows of Abacus and Imago to fold away completely, the same way
   Tabula's bar does: when folded, the whole strip is gone and the sheet or slide fills the
   space, with only a small button floating in the corner. The reason a grey or white band
   stayed behind before is that the host reserves a fixed strip at the very bottom of every app
   with `body{padding-bottom:52px}`. The rows sat inside that reserved strip, so hiding the rows
   left the strip, and the strip is body background, a grey band in dark and a white band in
   light. This control removes that reserved strip for these two apps: when folded there is no
   bottom padding at all, so the sheet or slide reaches the bottom edge; when the rows are shown
   the padding is set to exactly their height, so the rows have a home and there is no empty
   band either. */
function wire(){try{
  var stat=document.getElementById('abStatus')||document.querySelector('.statusbar');
  var tabs=document.getElementById('abSheetBar');
  if(!stat && !tabs) return false;
  if(window.__cdFoldWired) return true; window.__cdFoldWired=1;

  /* strip a row of any band: no background, border or shadow, and slim */
  function thin(el){ if(!el)return;
    el.style.setProperty('background','transparent','important');
    el.style.setProperty('border','0','important');
    el.style.setProperty('box-shadow','none','important');
    el.style.setProperty('min-height','0','important');
    el.style.setProperty('padding-top','3px','important');
    el.style.setProperty('padding-bottom','3px','important');
    /* Imago's status is a fixed bar pinned to the very bottom edge, so its words read as
       sitting too low. Lift it a little and keep its right end clear of the corner button.
       Abacus's row is in the normal flow (not fixed), so this leaves it untouched. */
    if(getComputedStyle(el).position==='fixed'){
      el.style.setProperty('bottom','7px','important');
      el.style.setProperty('padding-right','104px','important');
    }
  }
  function thinKids(el){ if(!el)return; try{[].forEach.call(el.querySelectorAll('button,.tab,.sheet-tab,[role="tab"]'),function(b){b.style.setProperty('padding-top','2px','important');b.style.setProperty('padding-bottom','2px','important');b.style.setProperty('min-height','0','important');});}catch(e){} }

  /* set the body's reserved bottom strip. Inline and important, so it beats the host's
     `body{padding-bottom:52px}`. This is what actually removes the band. */
  function setPad(px){ try{ document.body.style.setProperty('padding-bottom', px, 'important'); }catch(e){} }
  /* Only rows that are in the normal flow (Abacus's tabs and status) need the body to reserve
     room, and that reserved strip is where the corner button floats clear of the right-aligned
     counts. A fixed row (Imago's status) reserves nothing, so the slide fills to the very edge. */
  function isFlow(el){ if(!el) return false; var p=getComputedStyle(el).position; return p==='static'||p==='relative'; }
  function reserveH(){ var h=0;
    if(stat && stat.style.display!=='none' && isFlow(stat)){ var a=stat.getBoundingClientRect().height; if(a>0)h+=a; }
    if(tabs && tabs.style.display!=='none' && isFlow(tabs)){ var b=tabs.getBoundingClientRect().height; if(b>0)h+=b; }
    return Math.round(h);
  }
  function wantPad(){ if(folded) return '0px'; var h=reserveH(); return h>0 ? (h+'px') : '0px'; }

  thin(stat); thin(tabs); thinKids(tabs);

  var fold=document.getElementById('cd-fold-foot');
  if(!fold){ fold=document.createElement('button'); fold.id='cd-fold-foot'; fold.type='button';
    /* a small pill sized to its text, fixed in the corner: never a full-width bar, so nothing
       at the bottom reads as a band when the rows are folded. Matches Tabula's Show bar button. */
    fold.style.cssText='position:fixed;right:12px;bottom:10px;z-index:2147483000;width:auto;max-width:max-content;cursor:pointer;font:600 11px/1 -apple-system,system-ui,sans-serif;padding:5px 11px;border-radius:8px;';
    fold.style.setProperty('background','rgba(127,130,138,.16)','important');
    fold.style.setProperty('border','1px solid rgba(140,144,152,.40)','important');
    fold.style.setProperty('box-shadow','none','important');
    fold.style.setProperty('color','#8b93a0','important');
    fold.style.setProperty('min-height','0','important');
    document.body.appendChild(fold);
  }
  fold.__cdLive=true;

  var folded=false;
  function apply(){
    if(folded){
      if(stat) stat.style.setProperty('display','none','important');
      if(tabs) tabs.style.setProperty('display','none','important');
      setPad('0px');                 /* no reserved strip: the sheet or slide fills the bottom */
      fold.textContent='⌃ Show rows';
    } else {
      if(stat){ stat.style.removeProperty('display'); thin(stat); }
      if(tabs){ tabs.style.removeProperty('display'); thin(tabs); thinKids(tabs); }
      setPad(wantPad());             /* room for the thin rows only, no empty band */

    }
  }
  fold.onclick=function(e){ e.preventDefault(); e.stopPropagation(); folded=!folded; apply(); };

     have actually drifted, so this never loops. */

  try{ window.addEventListener('resize',function(){ var w=wantPad(); if(document.body.style.paddingBottom!==w) setPad(w); }); }catch(e){}

})();</script>

<script>var __CDI=(window.__CD_INSTANCE?("#"+window.__CD_INSTANCE):"");</script><script>

  function rangeVals(a,b){var m1=a.match(/^([A-Z]+)(\d+)$/),m2=b.match(/^([A-Z]+)(\d+)$/);if(!m1||!m2)return [];var c1=colNum(m1[1]),r1=+m1[2],c2=colNum(m2[1]),r2=+m2[2],rows=[];for(var r=Math.min(r1,r2);r<=Math.max(r1,r2);r++){var row=[];for(var c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)row.push(getCell(colName(c)+r));rows.push(row);}return rows;}

  function matchCrit(v,crit){crit=toStr(crit);var m=crit.match(/^(<=|>=|<>|=|<|>)(.*)$/);if(m){var op=m[1],rhs=m[2],nr=parseFloat(rhs),isN=!isNaN(nr)&&String(nr)===rhs.trim(),nv=toNum(v);if(op==='=')return isN?nv===nr:toStr(v).toLowerCase()===rhs.toLowerCase();if(op==='<>')return isN?nv!==nr:toStr(v).toLowerCase()!==rhs.toLowerCase();if(!isN)return false;if(op==='<')return nv<nr;if(op==='>')return nv>nr;if(op==='<=')return nv<=nr;return nv>=nr;}var n2=parseFloat(crit);if(!isNaN(n2)&&String(n2)===crit.trim())return toNum(v)===n2;return toStr(v).toLowerCase()===crit.toLowerCase();}

    { id: 'quick',   name: 'Quick hand',  slant: 0.52, nib: 0.75, weight: 0.070, thin: 0.42, wobble: 0.022, join: true,  flourish: 0.4, size: 0.95 },
    { id: 'upright', name: 'Upright',     slant: -0.06, nib: 0.55, weight: 0.095, thin: 0.30, wobble: 0.008, join: true,  flourish: 0.8, size: 1.0 },
    { id: 'looped',  name: 'Looped',      slant: 0.20, nib: 0.45, weight: 0.120, thin: 0.44, wobble: 0.016, join: true,  flourish: 1.2, size: 1.05 },
    { id: 'print',   name: 'Printed',     slant: 0.00, nib: 0.50, weight: 0.080, thin: 0.60, wobble: 0.004, join: false, flourish: 0.0, size: 0.9 }
  ];

  /* A broad nib: the stroke is wide across the pen and narrow along it, which is the
     whole reason handwriting has thick and thin passages. */
  function strokePath(g, pts, opt) {
    if (pts.length < 2) return;
    var nibA = opt.nib * Math.PI;
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i];
      var dx = b[0] - a[0], dy = b[1] - a[1];
      var len = Math.sqrt(dx * dx + dy * dy);
      if (!len) continue;
      var ang = Math.atan2(dy, dx);
      var t = Math.abs(Math.sin(ang - nibA));
      var w = opt.weight * (opt.thin + (1 - opt.thin) * t);
      g.lineWidth = Math.max(0.006, w) * opt.scale;
      g.beginPath();
      g.moveTo(a[0], a[1]);
      g.lineTo(b[0], b[1]);
      g.stroke();
    }
  }

  function write(text, handId, opts) {
    opts = opts || {};
    var H = null;
    for (var i = 0; i < HANDS.length; i++) if (HANDS[i].id === handId) H = HANDS[i];
    if (!H) H = HANDS[0];
    var scale = opts.scale || 150;
    var ink = opts.ink || '#151515';
    var weight = (opts.weight === undefined ? H.weight : opts.weight);
    var slant = (opts.slant === undefined ? H.slant : opts.slant);

    /* lay the word out first so the canvas can be cut to it */
    var runs = [], x = 0, seed = 0, lastExit = null;
    for (i = 0; i < text.length; i++) seed += text.charCodeAt(i) * (i + 3);
    function rnd(k) { var v = Math.sin(seed * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); }

    for (i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      var gl = glyph(ch);
      var pts = gl.pts;
      if (!pts.length) { x += 0.42; continue; }
      var sz = gl.cap ? 1.0 : 1.0;
      var lift = (rnd(i) - 0.5) * H.wobble * 6;
      var mapped = pts.map(function (p) {
        return p === null ? null : [x + p[0] * sz, p[1] * sz * H.size + lift];
      });
      /* a glyph may be more than one stroke; null is where the pen lifts */
      var subs = [], curSub = [];
      mapped.forEach(function (pt) {
        if (pt === null) { if (curSub.length) subs.push(curSub); curSub = []; }
        else curSub.push(pt);
      });
      if (curSub.length) subs.push(curSub);
      var sm = smooth(subs[0], 9);
      /* the joining stroke, from where the last letter left off to where this one
         begins, dipping to the writing line as a hand would */
      if (H.join && runs.length && !gl.cap && lastExit) {
        var a = lastExit, bpt = sm[0];
        if (bpt[0] > a[0]) {
          var mid = [(a[0] + bpt[0]) / 2, Math.min(a[1], bpt[1]) - 0.06];
          runs.push({ pts: smooth([a, mid, bpt], 6), join: true });
        }
      }
      runs.push({ pts: sm, cap: gl.cap });
      for (var q = 1; q < subs.length; q++) runs.push({ pts: smooth(subs[q], 9), cap: gl.cap });
      lastExit = sm[sm.length - 1];
      if (DOTTED[ch]) {
        var d = DOTTED[ch];
        runs.push({ pts: [[x + d[0] - 0.02, d[1] + lift], [x + d[0] + 0.03, d[1] + 0.02 + lift]], dot: true });
      }
      var adv = 0;
      for (var k = 0; k < pts.length; k++) if (pts[k] && pts[k][0] > adv) adv = pts[k][0];
      x += adv + (H.join ? 0.02 : 0.14);
    }

    /* bounds, with room for the nib and the slant */
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    runs.forEach(function (r) {
      r.pts.forEach(function (p) {
        var sx = p[0] + p[1] * slant;
        if (sx < minX) minX = sx;
        if (sx > maxX) maxX = sx;
        if (p[1] < minY) minY = p[1];
        if (p[1] > maxY) maxY = p[1];
      });
    });
    if (maxX < minX) { minX = 0; maxX = 1; minY = 0; maxY = 1; }
    var pad = weight * 3 + 0.12;
    var w = (maxX - minX) + pad * 2, h = (maxY - minY) + pad * 2;

    var c = document.createElement('canvas');
    c.width = Math.max(8, Math.round(w * scale));
    c.height = Math.max(8, Math.round(h * scale));
    var g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.save();
    g.translate(0, c.height);
    g.scale(scale, -scale);
    g.translate(-minX + pad, -minY + pad);
    g.strokeStyle = ink;
    g.lineCap = 'round';
    g.lineJoin = 'round';

    var opt = { nib: H.nib, weight: weight, thin: H.thin, scale: 1 };
    runs.forEach(function (r) {
      var slanted = r.pts.map(function (p) { return [p[0] + p[1] * slant, p[1]]; });
      if (r.dot) {
        strokePath(g, slanted, { nib: H.nib, weight: weight * 1.5, thin: 0.9, scale: 1 });
      } else if (r.join) {
        strokePath(g, slanted, { nib: H.nib, weight: weight * 0.72, thin: opt.thin, scale: 1 });
      } else {
        strokePath(g, slanted, opt);
      }
    });

    /* An underline flourish, which is what most people actually add to a signature. */
    if (H.flourish > 0 && opts.flourish !== false && runs.length) {
      var y0 = minY - 0.10;
      var fl = [];
      for (var s = 0; s <= 26; s++) {
        var tt = s / 26;
        fl.push([minX + tt * (maxX - minX),
                 y0 + Math.sin(tt * Math.PI) * 0.16 * H.flourish - tt * 0.05]);
      }
      strokePath(g, smooth(fl, 3), { nib: H.nib, weight: weight * 0.8, thin: H.thin, scale: 1 });
    }
    g.restore();
    return c;
  }

  window.cdHand = { write: write, hands: HANDS };
})();

<script id="cd-sign-studio">

     drawn    with a finger or a pen on a trackpad or a tablet, which is what a

     typed    set in one of four hands, for a document that only needs a name
     initials a short form for initialling each page

   text without a box of white around it.

   alike, with touch scrolling suppressed on the canvas only while a stroke is in
   progress. Targets are at least 44 pixels.
*/
(function () {

  var BLUE = '#1B6B93', INK = '#1D1D1F', GOLD = '#C6A668';
  var KEY = 'cd_signatures_v1';

  /* ---------------------------------------------------------------- storage */
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
  }
  function save(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 12))); } catch (e) {}
  }

  function toast(msg, bad) {
    try {
      var d = document.createElement('div');
      d.textContent = msg;
      d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:'
        + (bad ? '#822e1d' : '#123c52') + ';color:#fff;font:13px Georgia,serif;padding:9px 15px;'
        + 'border-radius:7px;z-index:2147483600;box-shadow:0 8px 26px rgba(0,0,0,.30);max-width:82vw;text-align:center;';

    } catch (e) {}
  }

  /* Trim the transparent margin so a signature sits on a line of text rather than in
     a rectangle of nothing. */
  function trim(canvas) {
    try {
      var g = canvas.getContext('2d');
      var d = g.getImageData(0, 0, canvas.width, canvas.height).data;

            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }

      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(canvas.width - 1, maxX + pad);
      maxY = Math.min(canvas.height - 1, maxY + pad);

  function handList() {
    return (window.cdHand && window.cdHand.hands) || [];
  }

  function typeToCanvas(text, handIndex, opts) {
    opts = opts || {};
    var hands = handList();
    if (!hands.length || !window.cdHand) {
      /* nothing to draw with, so fall back rather than fail */
      var c = document.createElement('canvas');
      c.width = 900; c.height = 220;

      g.font = '110px Georgia, serif';

      g.fillText(text, 20, 110);

    return window.cdHand.write(text, h.id, {
      scale: 150,
      ink: opts.ink || INK,
      weight: opts.weight,
      slant: opts.slant,
      flourish: opts.flourish

  }

  /* ---------------------------------------------------------------- placing */
  function host() {
    var ed = document.getElementById('editor');
    if (ed && ed.isContentEditable) return 'tabula';
    if (document.getElementById('slide') && document.getElementById('imgFile')) return 'imago';
    if (document.getElementById('grid')) return 'abacus';
    return 'unknown';
  }

  function insert(sig, heightPx) {
    var h = heightPx || 46;
    var w = Math.round(h * (sig.w / sig.h));
    var where = host();
    if (where === 'tabula') {
      var ed = document.getElementById('editor');
      if (!ed) { toast('Nothing here to sign.', true); return false; }
      try { ed.focus(); if (window.restoreSel) window.restoreSel(); } catch (e) {}

      try { document.execCommand('insertHTML', false, html); } catch (e) {}
      try { if (window.layout) window.layout(); } catch (e) {}
      toast('Signature placed.');
      return true;
    }
    if (where === 'imago') {
      /* Imago's own picture path, so the signature behaves as any other object. */
      try {

        var bin = atob(sig.png.slice(sig.png.indexOf(',') + 1));

        var inp = document.getElementById('imgFile');
        inp.files = dt.files;
        inp.dispatchEvent(new Event('change', { bubbles: true }));
        toast('Signature placed on the slide.');
        return true;
      } catch (e) { toast('Could not place the signature.', true); return false; }
    }
    if (where === 'abacus') {
      var g = document.getElementById('grid');
      if (!g) { toast('Nothing here to sign.', true); return false; }
      var box = document.getElementById('cd-sheet-signature');
      if (box) box.remove();
      box = document.createElement('div');
      box.id = 'cd-sheet-signature';
      box.style.cssText = 'padding:6px 14px 10px;text-align:right;';
      box.innerHTML = '<img src="' + sig.png + '" width="' + w + '" height="' + h
        + '" alt="Signature" style="display:inline-block;">';
      g.parentNode.insertBefore(box, g.nextSibling);
      toast('Signature placed beneath the sheet.');
      return true;
    }
    toast('Nothing here to sign.', true);
    return false;
  }

  function copy(sig) {
    return new Promise(function (done) {
      function legacy() {
        try {
          var holder = document.createElement('div');
          holder.setAttribute('contenteditable', 'true');
          holder.style.cssText = 'position:fixed;left:-9999px;top:0;';

          done(ok); return;
        } catch (e) { toast('Could not reach the clipboard.', true); done(false); }
      }
      try {
        var bin = atob(sig.png.slice(sig.png.indexOf(',') + 1));
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var blob = new Blob([arr], { type: 'image/png' });

          navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
            .then(function () { toast('Signature copied. Paste it anywhere.'); done(true); })
            ['catch'](legacy);
          return;
        }
      } catch (e) {}
      legacy();
    });
  }

  /* ------------------------------------------------------------------ the UI */
  var CSS = ''
    + '#cd-sign-pop{position:fixed;z-index:2147483500;background:#fff;border:1px solid rgba(0,0,0,.16);'
    + 'border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,.24);padding:12px;width:min(460px,95vw);'
    + 'max-height:86vh;overflow:auto;font:13px Georgia,serif;-webkit-overflow-scrolling:touch;}'

    + 'background:#fff;cursor:pointer;font:12.5px Georgia,serif;}'

    + '#cd-sign-pop .sg-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}'
    + '#cd-sign-pop button.sg-act{flex:1 1 auto;min-height:44px;min-width:104px;border:1px solid rgba(0,0,0,.16);'
    + 'border-radius:7px;background:#fff;cursor:pointer;font:12.5px Georgia,serif;color:' + INK + ';padding:9px 10px;}'

    + '#cd-sign-pop .sg-hands{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}'
    + '#cd-sign-pop .sg-hand{min-height:44px;border:1px solid rgba(0,0,0,.16);border-radius:7px;background:#fff;'
    + 'cursor:pointer;padding:6px 10px;font:12px Georgia,serif;}'
    + '#cd-sign-pop .sg-hand[aria-pressed="true"]{border-color:' + BLUE + ';box-shadow:0 0 0 2px rgba(27,107,147,.16);}'

    + '#cd-sign-pop .sg-mini button{flex:1;min-height:38px;padding:6px 10px;border:1px solid rgba(0,0,0,.14);border-radius:6px;'

    var body = document.createElement('div');
    var mode = 'draw';
    ['Draw it', 'Type it', 'Scan it', 'Kept'].forEach(function (label, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sg-tab'; b.textContent = label;
      b.setAttribute('aria-selected', String(i === 0));
      tap(b, function () {

    note.className = 'sg-note';

    pop.appendChild(note);

    function keep(canvas, label) {
      var t = trim(canvas);
      if (!t) { toast('There is nothing drawn yet.', true); return null; }
      var sig = { id: 'sg' + Date.now(), name: label || 'Signature',
                  png: t.toDataURL('image/png'), w: t.width, h: t.height, at: Date.now() };
      var list = load(); list.unshift(sig); save(list);
      toast('Signature kept.');
      try { refresh(); } catch (e) {}
      return sig;
    }

    function paint() {
      body.innerHTML = '';
      if (mode === 'draw') {
        var pad = document.createElement('canvas');
        pad.className = 'sg-pad';
        body.appendChild(pad);
        /* the backing store is sized to the box so the stroke is not blurred */
        setTimeout(function () {
          var r = pad.getBoundingClientRect();
          pad.width = Math.round(r.width * 2);
          pad.height = Math.round(r.height * 2);
          var g = pad.getContext('2d');
          g.scale(2, 2);
          g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
          g.strokeStyle = INK;
          var drawing = false, lx = 0, ly = 0;
          function at(e) {
            var b = pad.getBoundingClientRect();
            return { x: e.clientX - b.left, y: e.clientY - b.top };
          }
          pad.addEventListener('pointerdown', function (e) {
            drawing = true; var p = at(e); lx = p.x; ly = p.y;
            try { pad.setPointerCapture(e.pointerId); } catch (er) {}
            e.preventDefault();
          });
          pad.addEventListener('pointermove', function (e) {
            if (!drawing) return;
            var p = at(e);
            g.beginPath(); g.moveTo(lx, ly); g.lineTo(p.x, p.y); g.stroke();
            lx = p.x; ly = p.y;
            e.preventDefault();
          });
          ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
            pad.addEventListener(ev, function () { drawing = false; });
          });
          pad.__clear = function () { g.clearRect(0, 0, pad.width, pad.height); };
        }, 0);

        var row = document.createElement('div'); row.className = 'sg-row';
        [['Clear', function () { if (pad.__clear) pad.__clear(); }],
         ['Keep this signature', function () { var s = keep(pad); if (s) { mode = 'lib'; paint(); } }],
         ['Keep and place it', function () { var s = keep(pad); if (s) { insert(s); close(); } }]
        ].forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-act'; b.textContent = pair[0];
          tap(b, pair[1]); row.appendChild(b);
        });
        body.appendChild(row);
      }

      if (mode === 'type') {
        var inp = document.createElement('input');
        inp.className = 'sg-name'; inp.type = 'text';
        inp.placeholder = 'Type your name';
        body.appendChild(inp);

        var hands = document.createElement('div'); hands.className = 'sg-hands';
        handList().forEach(function (h, i) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-hand';
          b.textContent = h.name;
          b.setAttribute('aria-pressed', String(i === handIndex));
          try {
            var mini = window.cdHand.write('Abc', h.id, { scale: 34, ink: '#333' });
            b.textContent = '';
            var mi = document.createElement('img');
            mi.src = mini.toDataURL('image/png');
            mi.style.cssText = 'height:22px;display:block;margin:0 auto 2px;';
            var cap = document.createElement('div');
            cap.style.cssText = 'font:10px Georgia,serif;color:#6b6b72;';
            cap.textContent = h.name;
            b.appendChild(mi); b.appendChild(cap);
          } catch (e) { b.textContent = h.name; }
          tap(b, function () {
            handIndex = i;
            [].slice.call(hands.children).forEach(function (x, j) {
              x.setAttribute('aria-pressed', String(j === handIndex));
            });
            preview();
          });
          hands.appendChild(b);
        });
        body.appendChild(hands);

        var extra = document.createElement('div');
        extra.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;'
          + 'font:11.5px Georgia,serif;color:#6b6b72;';
        var inks = [['#151515', 'Black'], ['#1B3A6B', 'Blue black'], ['#1B6B93', 'Carpe Diem blue']];
        var inkNow = inks[0][0], weightNow = undefined, flourishNow = true;
        extra.appendChild(document.createTextNode('Ink:'));
        inks.forEach(function (pair, i) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-hand';
          b.style.cssText = 'min-height:34px;padding:5px 9px;';
          b.textContent = pair[1];
          b.setAttribute('aria-pressed', String(i === 0));
          tap(b, function () {
            inkNow = pair[0];
            [].slice.call(extra.querySelectorAll('button')).forEach(function (x) {
              if (x.getAttribute('data-role') !== 'flourish') x.setAttribute('aria-pressed', 'false');
            });
            b.setAttribute('aria-pressed', 'true');
            preview();
          });
          extra.appendChild(b);
        });
        var fl = document.createElement('button');
        fl.type = 'button'; fl.className = 'sg-hand';
        fl.setAttribute('data-role', 'flourish');
        fl.style.cssText = 'min-height:34px;padding:5px 9px;';
        fl.textContent = 'Underline';
        fl.setAttribute('aria-pressed', 'true');
        tap(fl, function () {
          flourishNow = !flourishNow;
          fl.setAttribute('aria-pressed', String(flourishNow));
          preview();
        });
        extra.appendChild(fl);
        body.appendChild(extra);

        var pv = document.createElement('div');
        pv.style.cssText = 'margin-top:10px;min-height:70px;border:1px dashed rgba(0,0,0,.22);'
          + 'border-radius:8px;display:flex;align-items:center;justify-content:center;padding:8px;';
        body.appendChild(pv);
        function preview() {
          pv.innerHTML = '';
          var t = (inp.value || '').trim();
          if (!t) { pv.textContent = 'Your signature will appear here.'; pv.style.color = '#8a8a90'; return; }
          pv.style.color = '';
          var c = typeToCanvas(t, handIndex, { ink: inkNow, weight: weightNow, flourish: flourishNow });
          var im = document.createElement('img');
          im.src = c.toDataURL('image/png');
          im.style.cssText = 'max-height:56px;max-width:100%;';
          pv.appendChild(im);
          pv.__canvas = c;
        }
        inp.addEventListener('input', preview);
        preview();

        var row2 = document.createElement('div'); row2.className = 'sg-row';
        [['Keep this signature', function () {
            if (!pv.__canvas) { toast('Type a name first.', true); return; }
            var s = keep(pv.__canvas, inp.value.trim()); if (s) { mode = 'lib'; paint(); } }],
         ['Keep and place it', function () {
            if (!pv.__canvas) { toast('Type a name first.', true); return; }
            var s = keep(pv.__canvas, inp.value.trim()); if (s) { insert(s); close(); } }]
        ].forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-act'; b.textContent = pair[0];
          tap(b, pair[1]); row2.appendChild(b);
        });
        body.appendChild(row2);
      }

      if (mode === 'scan') {
        /* cd-513-scan: HER INSTRUCTION. A visitor may already have a signature on
           paper. This takes a photograph or a scan of it, drops the paper and keeps
           the ink, so it sits on the line without a white box behind it, and then
           hands it to the same keep() every other hand goes through. Nothing is
           uploaded anywhere: the picture is read in the browser and kept in this
           browser, exactly as the note below the panel says. */
        var wrap = document.createElement('div');
        wrap.style.cssText = 'padding:10px 6px;';
        var lead = document.createElement('div');
        lead.style.cssText = 'font:13px Georgia,serif;color:#4a4a52;line-height:1.5;margin-bottom:10px;';
        lead.textContent = 'Choose a photograph or a scan of your own signature. The paper is dropped and the ink is kept, so it sits on the line rather than in a white box.';
        wrap.appendChild(lead);
        var pick = document.createElement('input');
        pick.type = 'file'; pick.accept = 'image/*';
        pick.style.cssText = 'display:block;width:100%;font:13px Georgia,serif;margin-bottom:10px;';
        wrap.appendChild(pick);
        var shown = document.createElement('div');
        shown.style.cssText = 'min-height:64px;display:flex;align-items:center;justify-content:center;';
        wrap.appendChild(shown);
        var made = null;
        pick.addEventListener('change', function () {
          var f = pick.files && pick.files[0];
          if (!f) return;
          var rd = new FileReader();
          rd.onload = function () {
            var im = new Image();
            im.onload = function () {
              var c = document.createElement('canvas');
              var sc = Math.min(1, 900 / (im.width || 1));
              c.width = Math.max(1, Math.round(im.width * sc));
              c.height = Math.max(1, Math.round(im.height * sc));
              var x = c.getContext('2d');
              x.drawImage(im, 0, 0, c.width, c.height);
              try {
                var dd = x.getImageData(0, 0, c.width, c.height), px = dd.data;
                for (var k = 0; k < px.length; k += 4) {
                  var lum = px[k] * 0.299 + px[k + 1] * 0.587 + px[k + 2] * 0.114;
                  if (lum > 150) { px[k + 3] = 0; }
                  else { px[k] = 26; px[k + 1] = 34; px[k + 2] = 42; px[k + 3] = Math.min(255, Math.round((150 - lum) * 3.4)); }
                }
                x.putImageData(dd, 0, 0);
              } catch (er) {}
              made = c;
              shown.innerHTML = '';
              var pv = document.createElement('img');
              pv.src = c.toDataURL('image/png');
              pv.style.cssText = 'max-height:64px;max-width:100%;';
              shown.appendChild(pv);
            };
            im.onerror = function () { toast('That image could not be read.', true); };
            im.src = String(rd.result);
          };
          rd.readAsDataURL(f);
        });
        body.appendChild(wrap);
        var rowS = document.createElement('div'); rowS.className = 'sg-row';
        [['Keep this signature', function () { if (!made) { toast('Choose a picture first.', true); return; } keep(made, 'Scanned hand'); }],
         ['Keep and place it', function () { if (!made) { toast('Choose a picture first.', true); return; } var s = keep(made, 'Scanned hand'); if (s) { place(s); } }]
        ].forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-act'; b.textContent = pair[0];
          tap(b, pair[1]); rowS.appendChild(b);
        });
        body.appendChild(rowS);
        return;
      }

      if (mode === 'lib') {
        var list = load();
        if (!list.length) {
          var e = document.createElement('div');
          e.style.cssText = 'padding:18px 6px;color:#6b6b72;font:13px Georgia,serif;text-align:center;';
          e.textContent = 'Nothing kept yet. Draw one or type one, and it will wait here for you.';
          body.appendChild(e);
          return;
        }
        var grid = document.createElement('div'); grid.className = 'sg-lib';
        /* PASS 597 - THE HOUSE HANDS LEAD, AND HERS ARE WOVEN THROUGH.
           Her request: the samples should not read as two blocks with her own at the
           top. The house hands lead the previews and her own are mixed in.

           *** THIS REORDERS THE VIEW AND NOT THE STORE, AND THAT IS THE WHOLE POINT.
           MEASURED FIRST: the PDF filler's "Add a signature" takes `sigs[0]`, so THE
           FIRST ITEM IN THE STORED LIST IS THE DEFAULT. keep() unshifts, which is why
           her newest hand leads today. Sorting the stored array would have quietly
           changed the hand she signs with, which is exactly what she said must not
           happen. So the stored order is never touched; only the order this grid
           walks is changed, and her default stays her default. ***

           The weave is DELIBERATELY STABLE rather than random. A library that deals
           itself a new order every time it is opened cannot be learned, and she has to
           find the same hand twice. House hands keep their house order, and hers are
           spaced evenly through them so the two never sit as separate blocks. */
        function cdLibOrder(all) {
          try {
            /* PASS 598 - HER DEFAULT LEADS AGAIN, ON HER OWN DESK ONLY.
               597 wove the house hands to the front and that moved her own signature
               out of first place. On the personal build the first stored item is the
               hand she signs with, and she wants to see it first. On the demo and gift
               builds the house hands still lead, because those are the portfolio and
               her hand is not the point there. The flag is set by the shell, which is
               the only place that knows which build this is. */
            var owner = false;
            try { owner = document.documentElement.getAttribute('data-cd-owner') === '1'; } catch (e) {}
            var lead = null, rest = all;
            if (owner && all.length && all[0] && !all[0].hand) { lead = all[0]; rest = all.slice(1); }
            var house = [], mine = [], i;
            for (i = 0; i < rest.length; i++) (rest[i] && rest[i].hand ? house : mine).push(rest[i]);
            if (!house.length || !mine.length) return lead ? [lead].concat(rest) : all.slice();
            var out = lead ? [lead] : [], mi = 0, since = 0;
            var gap = Math.max(2, Math.floor(house.length / (mine.length + 1)));
            for (i = 0; i < house.length; i++) {
              out.push(house[i]); since++;
              if (mi < mine.length && since >= gap) { out.push(mine[mi++]); since = 0; }
            }
            while (mi < mine.length) out.push(mine[mi++]);
            return out;
          } catch (e) { return all.slice(); }
        }
        cdLibOrder(list).forEach(function (sig) {
          var card = document.createElement('div'); card.className = 'sg-card';
          var im = document.createElement('img'); im.src = sig.png; im.alt = sig.name || 'Signature';
          var nm = document.createElement('div'); nm.className = 'sg-cn';
          nm.textContent = sig.name || 'Signature';
          var mini = document.createElement('div'); mini.className = 'sg-mini';
          /* cd-513-fold: HER INSTRUCTION. Three buttons on every card made the
             Kept list read as a wall of controls. Each card now shows one quiet
             Place action and a small fold; Copy and Remove wait behind the fold
             until it is opened, and only one card's fold is open at a time. */
          var folded = true;
          function paintMini() {
            mini.innerHTML = '';
            var pairs = [['Place', function () { insert(sig); close(); }]];
            if (!folded) {
              pairs.push(['Copy', function () { copy(sig); }]);
              pairs.push(['Remove', function () {
                save(load().filter(function (x) { return x.id !== sig.id; }));
                paint(); try { refresh(); } catch (e) {}
                toast('Signature removed.'); }]);
            }
            pairs.forEach(function (pair) {
              var b = document.createElement('button');
              b.type = 'button'; b.textContent = pair[0];
              tap(b, pair[1]); mini.appendChild(b);
            });
            var more = document.createElement('button');
            more.type = 'button';
            more.className = 'sg-fold';
            more.textContent = folded ? '\u22ef' : '\u2715';
            more.setAttribute('aria-label', folded ? 'More actions' : 'Fewer actions');
            more.setAttribute('aria-expanded', String(!folded));
            tap(more, function () {
              var open = !folded;
              try {
                var all = grid.querySelectorAll('.sg-mini');
                for (var q = 0; q < all.length; q++) {
                  if (all[q] !== mini && all[q].__fold) all[q].__fold(true);
                }
              } catch (e) {}
              folded = open ? true : false;
              paintMini();
            });
            mini.appendChild(more);
          }
          mini.__fold = function (state) { folded = state; paintMini(); };
          paintMini();
          card.appendChild(im); card.appendChild(nm); card.appendChild(mini);
          grid.appendChild(card);
        });
        body.appendChild(grid);
      }
    }
    paint();

    document.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    var top = r.bottom + 6, left = r.left;
    if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, window.innerHeight - pop.offsetHeight - 8);
    if (left + pop.offsetWidth > window.innerWidth - 8) { /* PASS 451: keep the panel WITH its button. The old clamp pinned the panel to the viewport's right edge, which on a wide ribbon left it opening far away from the Signature group that summoned it. Prefer aligning the panel's RIGHT edge to the button's right edge, so it hangs directly under the control; fall back to the viewport clamp only if that would run off the left. */ var wanted = r.right - pop.offsetWidth; left = (wanted >= 8) ? wanted : Math.max(8, window.innerWidth - pop.offsetWidth - 8); }
    pop.style.top = Math.max(8, top) + 'px'; pop.style.left = left + 'px';
    /* PASS 599 - THE PANEL SETTLES ONTO ITS CONTROL, AND SETTLES AGAIN.
       Her report: the panel opens on the far side of the page from the group it
       belongs to. MEASURED at full width in the studio, the sum above lands it
       correctly under its control, so I could not reproduce the placement she
       photographed and I will not pretend otherwise. What CAN be removed is the
       whole class of cause: the sum reads pop.offsetWidth the instant the panel is
       appended, and any path where layout has not settled reads that as zero,
       which throws the arithmetic to one edge.
       It is recomputed on the next frame, when the width is real, right aligned to
       the control so it hangs under its own group, and clamped into the viewport.
       Idempotent: if the first sum was already right, this changes nothing. */
    try {
      requestAnimationFrame(function () {
        try {
          if (!pop.isConnected || !anchor || !anchor.getBoundingClientRect) return;
          var q2 = anchor.getBoundingClientRect();
          var w2 = pop.offsetWidth || pop.getBoundingClientRect().width || 460;
          var h2 = pop.offsetHeight || pop.getBoundingClientRect().height || 0;
          var L2 = q2.right - w2;
          if (L2 < 8) L2 = Math.min(q2.left, window.innerWidth - w2 - 8);
          if (L2 + w2 > window.innerWidth - 8) L2 = window.innerWidth - w2 - 8;
          if (L2 < 8) L2 = 8;
          var T2 = q2.bottom + 6;
          if (T2 + h2 > window.innerHeight - 8) T2 = q2.top - h2 - 6;
          if (T2 < 8) T2 = 8;
          pop.style.left = Math.round(L2) + 'px';
          pop.style.top = Math.round(T2) + 'px';
        } catch (e) {}
      });
    } catch (e) {}

    function away(e) {
      if (!pop.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) close();
    }
    function close() {
      try { pop.remove(); } catch (e) {}
      document.removeEventListener('pointerdown', away, true);
    }
    pop.__close = close;
    pop.__repaint = function () { try { paint(); } catch (e) {} };
    setTimeout(function () { document.addEventListener('pointerdown', away, true); }, 0);
  }

  /* ------------------------------------------------------------- the control */
  /* A tile in the same idiom as the Carpe Diem letterheads: Tabula's own Styles
     classes, so hover, the dark theme and the metrics come free, with each tile
     showing the signature it will place rather than describing it. */
  function sigTile(sig, native) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = native ? 'sty-tile' : 'cdsl-tile';
    btn.title = (sig ? (sig.name || 'Signature') + '. Place it here' : 'Make a signature');
    var samp = document.createElement('span');
    samp.className = native ? 'sty-samp' : 'cdsl-samp';
    if (sig) {
      var im = document.createElement('img');
      im.src = sig.png;
      im.alt = '';
      im.style.cssText = 'max-height:22px;max-width:64px;display:block;';
      samp.appendChild(im);
    } else {
      samp.style.cssText = 'font:20px Georgia,serif;color:' + BLUE + ';';
      samp.textContent = '\u270e';
    }
    var nm = document.createElement('span');
    nm.className = native ? 'sty-name' : 'cdsl-name';
    var label = sig ? (sig.name || 'Signature') : 'Make one';
    nm.textContent = label.length > 11 ? label.slice(0, 10) + '\u2026' : label;
    btn.appendChild(samp); btn.appendChild(nm);
    tap(btn, function () {
      if (sig) insert(sig);
      else openPanel(btn);
    });
    return btn;
  }

  function sigStrip(native) {
    var strip = document.createElement('span');
    strip.className = native ? 'sty-strip' : 'cdsl-strip';
    strip.setAttribute('role', 'group');
    strip.setAttribute('aria-label', 'Your signatures');
    var kept = load().slice(0, 3);
    if (!kept.length) {
      strip.appendChild(sigTile(null, native));
    } else {
      kept.forEach(function (s) { strip.appendChild(sigTile(s, native)); });
    }
    return strip;
  }

  /* Redrawn whenever the library changes, so a signature kept in the panel appears
     on the ribbon at once rather than after a reload. */
  function refresh() {
    var g = document.getElementById('cd-sign-group');
    if (g) { g.remove(); mount(); }
    /* PASS 442: a hand added while a panel is open must repaint the OPEN
       panel, not only the toolbar group. #cd-sign-pop carries __repaint. */
    var _pop = document.getElementById('cd-sign-pop');
    if (_pop && _pop.__repaint) { try { _pop.__repaint(); } catch (e) {} }
  }

  function mount() {
    if (!document.body) return;
    if (document.getElementById('cd-sign-group')) return;
    var h = host();
    var more = document.createElement('button');
    more.type = 'button'; more.id = 'cd-sign-btn';
    more.className = 'tb tb-arrow';
    more.innerHTML = '\u25be';
    more.title = 'Make a signature, keep it, or place one you have kept';
    more.setAttribute('aria-label', 'All your signatures');
    tap(more, function () { openPanel(more); });

    var placed = false;
    if (h === 'tabula') {
      var row = document.querySelector('.rib-row[data-rib="insert"]');
      if (row) {
        var grp = document.createElement('div'); grp.className = 'grp'; grp.id = 'cd-sign-group';
        var tools = document.createElement('div'); tools.className = 'grp-tools';
        var line = document.createElement('div'); line.className = 'grp-line';
        line.appendChild(sigStrip(true));
        line.appendChild(more);
        tools.appendChild(line);
        var lab = document.createElement('div'); lab.className = 'grp-label';
        lab.style.whiteSpace = 'nowrap'; lab.textContent = 'Signature';
        grp.appendChild(tools); grp.appendChild(lab);
        row.appendChild(grp);
        placed = true;
      }
    } else if (h === 'imago') {
      var page = document.getElementById('ribInsert');
      if (page) {
        var g2 = document.createElement('div'); g2.className = 'rib-grp'; g2.id = 'cd-sign-group';
        var t2 = document.createElement('div'); t2.className = 'rib-grp-tools';
        var l3 = document.createElement('div'); l3.className = 'rg-line';
        l3.appendChild(sigStrip(false)); l3.appendChild(more);
        t2.appendChild(l3);
        var l2 = document.createElement('div'); l2.className = 'rib-grp-label';
        l2.style.whiteSpace = 'nowrap'; l2.textContent = 'Signature';
        g2.appendChild(t2); g2.appendChild(l2);
        page.appendChild(g2);
        placed = true;
      }
    } else if (h === 'abacus') {
      var fx = document.getElementById('insFx');
      var panel = fx && fx.closest ? fx.closest('.ab-panel') : null;
      if (panel) {
        var g3 = document.createElement('div'); g3.className = 'ab-grp'; g3.id = 'cd-sign-group';
        var t3 = document.createElement('div'); t3.className = 'ab-grp-tools';
        var l4 = document.createElement('div'); l4.className = 'ab-line';
        l4.appendChild(sigStrip(false)); l4.appendChild(more);
        t3.appendChild(l4);
        var lb = document.createElement('div'); lb.className = 'ab-grp-label';
        lb.style.whiteSpace = 'nowrap'; lb.textContent = 'Signature';
        g3.appendChild(t3); g3.appendChild(lb);
        panel.appendChild(g3);
        placed = true;
      }
    }
    if (!placed) {
      var wrap = document.createElement('div');
      wrap.id = 'cd-sign-group';
      wrap.style.cssText = 'position:fixed;right:14px;bottom:58px;z-index:2147482000;background:#fff;'
        + 'border:1px solid rgba(0,0,0,.18);border-radius:8px;padding:6px 10px;';
      wrap.appendChild(more);
      document.body.appendChild(wrap);
    }
  }

  window.cdSign = {
    list: load, save: save, insert: insert, copy: copy,
    typeToCanvas: typeToCanvas, trim: trim, hands: handList, host: host,
    open: function () { var b = document.getElementById('cd-sign-btn'); if (b) openPanel(b); },
    refresh: function () { try { refresh(); } catch (e) {} }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
  setInterval(function () { try { mount(); } catch (e) {} }, 1700);
})();

</script>
</body>
</html>
