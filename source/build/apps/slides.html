<script id="cd-cd-foot">(function(){

   stayed behind before is that the host reserves a fixed strip at the very bottom of every app
   with `body{padding-bottom:52px}`. The rows sat inside that reserved strip, so hiding the rows
   left the strip, and the strip is body background, a grey band in dark and a white band in
   light. This control removes that reserved strip for these two apps: when folded there is no
   bottom padding at all, so the sheet or slide reaches the bottom edge; when the rows are shown
   the padding is set to exactly their height, so the rows have a home and there is no empty
   band either. */

    el.style.setProperty('padding-top','3px','important');
    el.style.setProperty('padding-bottom','3px','important');

       sitting too low. Lift it a little and keep its right end clear of the corner button.
       Abacus's row is in the normal flow (not fixed), so this leaves it untouched. */

      el.style.setProperty('padding-right','104px','important');

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Imago preview</title>
<style>
  :root{
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --bg:#F5F5F7;--panel:#ffffff;--ink:#1f2329;--ink-2:#5a626c;--ink-3:#9aa0a6;
    --line:#e2e5ea;--line-soft:#eef0f3;--blue:#7A2530;--blue-soft:#f6e9ec;--brand:#7A2530;--gold:#c9a24a;--gold-soft:rgba(201,162,74,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  /* Top strip */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .deck-title{font-family:var(--serif);font-size:16px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:4px 8px;min-width:140px;color:var(--ink);background:transparent;}
  .deck-title:hover{border-color:var(--line);}
  .deck-title:focus{outline:none;border-color:var(--brand);background:#fff;}
  .spacer{flex:1 1 auto;}
  .ctl{font-family:var(--ui);font-size:13px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;padding:0 10px;}
  .ctl:hover{border-color:var(--blue);}
  .ctl.ghost{background:transparent;border-color:transparent;color:var(--ink-2);}
  .ctl.ghost:hover{background:var(--line-soft);color:var(--ink);}
  .ctl.ghost.on{background:var(--blue-soft);color:var(--blue);}
  .ctl.link{border-color:var(--brand);color:var(--brand);}
  .ctl.link:hover{background:#fbeee9;}

  /* Ribbon */
  .rib-tabs{flex:0 0 auto;display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  .rib-tab{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink-2);background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 14px 8px;cursor:pointer;}
  .rib-tab:hover{color:var(--ink);}
  .rib-tab.on{color:var(--blue);border-bottom-color:var(--blue);}
  .ribbon{flex:0 0 auto;background:#fbfbfc;border-bottom:1px solid var(--line);padding:8px 12px;min-height:48px;}
  .rib-page{display:none;align-items:center;gap:4px;flex-wrap:wrap;}
  .rib-page.on{display:flex;}
  .rib-grp{display:flex;align-items:center;gap:3px;padding:0 6px;}
  .rib-grp + .rib-grp{border-left:1px solid var(--line);}
  .tb{font-family:var(--ui);font-size:13px;min-width:30px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
  .tb:hover{background:var(--line-soft);color:var(--ink);}
  .tb:disabled{opacity:0.4;cursor:default;}
  .tb.on{background:var(--blue-soft);color:var(--blue);border-color:#e0b8bb;}
  .tb.b{font-weight:800;} .tb.i{font-style:italic;} .tb.u{text-decoration:underline;} .tb.s{text-decoration:line-through;text-decoration-thickness:2px;}
  .tb.prim{background:var(--blue);color:#fff;border-color:var(--blue);}
  .tb.prim:hover{filter:brightness(1.07);background:var(--blue);color:#fff;}
  select.sel{font-family:var(--ui);font-size:13px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer;padding:0 6px;}
  .sw-row{display:inline-flex;gap:3px;align-items:center;}
  .sw{width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,0.2);cursor:pointer;padding:0;}
  .sw:hover{transform:scale(1.12);}
  .grp-cap{font-size:10px;color:var(--ink-3);margin-left:4px;}

  .objbar{flex:0 0 auto;display:none;align-items:center;gap:8px;padding:6px 14px;background:#fbf7f4;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .objbar.show{display:flex;}
  .objbar .lbl{font-size:12px;color:var(--ink-2);font-weight:600;}
  .objbar label{font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;}
  .objbar input[type=color]{width:26px;height:24px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0;cursor:pointer;}

  .work{flex:1 1 auto;display:flex;min-height:0;}
  .rail{flex:0 0 188px;background:#fbfbfc;border-right:1px solid var(--line);overflow-y:auto;padding:10px;}
  .rail-head{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin:2px 4px 8px;}
  .thumb{position:relative;border:2px solid transparent;border-radius:8px;margin-bottom:10px;cursor:pointer;background:#fff;overflow:hidden;}
  .thumb.sel{border-color:var(--brand);}
  .thumb .num{position:absolute;top:4px;left:6px;font-size:10px;color:var(--ink-3);z-index:2;font-weight:700;}
  .thumb .mini{width:100%;aspect-ratio:16/9;container-type:size;overflow:hidden;position:relative;}
  .thumb .tools{display:flex;gap:2px;justify-content:flex-end;padding:3px 4px;background:#fff;border-top:1px solid var(--line-soft);}
  .thumb .tools button{font-size:11px;line-height:1;border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:3px 5px;border-radius:5px;}
  .thumb .tools button:hover{background:var(--line-soft);color:var(--ink);}
  .add-slide{width:100%;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:9px;cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:600;}
  .add-slide:hover{filter:brightness(1.08);}

  .stage-wrap{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;}
  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto;}
  .slide-frame{width:min(100%,calc((100vh - 330px) * 1.7778));max-width:1000px;}
  .slide{width:100%;aspect-ratio:16/9;container-type:size;border-radius:8px;box-shadow:0 8px 30px rgba(20,24,31,0.16);overflow:hidden;position:relative;}

  .statusbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:6px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);}

  .notes-panel{display:none;flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:8px 14px;}
  .notes-panel.show{display:block;}
  .notes-head{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin-bottom:5px;}
  .notes-panel textarea{width:100%;height:60px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--ui);font-size:13px;color:var(--ink);background:#fbfbfc;}
  .notes-panel textarea:focus{outline:none;border-color:var(--brand);background:#fff;}

  .s-bg{position:absolute;inset:0;background:var(--s-bg);}
  .s-pad{position:absolute;inset:0;padding:7cqw 8cqw;display:flex;flex-direction:column;}
  .pf{outline:none;}
  .pf[contenteditable="true"][data-empty="true"]:before{content:attr(data-ph);color:var(--s-muted);opacity:0.5;}
  .pf:focus{box-shadow:inset 0 0 0 2px var(--s-accent,var(--brand));border-radius:4px;}
  .pf ul,.pf ol{margin:0.4em 0;padding-left:1.4em;}
  .pf li{margin:0.15em 0;}
  .s-kicker{font-family:var(--s-bodyfont);font-size:2.4cqw;letter-spacing:0.16em;text-transform:uppercase;color:var(--s-accent,var(--brand));font-weight:700;margin-bottom:2cqw;}
  .s-title{font-family:var(--s-titlefont);font-size:8cqw;line-height:1.05;color:var(--s-ink);font-weight:700;}
  .s-title.small{font-size:6cqw;}
  .s-sub{font-family:var(--s-bodyfont);font-size:3.4cqw;line-height:1.3;color:var(--s-body);margin-top:2.4cqw;font-weight:400;}
  .s-body{font-family:var(--s-bodyfont);font-size:3.1cqw;line-height:1.45;color:var(--s-body);}
  .s-rule{height:0.5cqw;width:14cqw;background:var(--s-accent,var(--brand));border-radius:2px;margin:3cqw 0;}
  .s-quote{font-family:var(--s-titlefont);font-size:5.4cqw;line-height:1.25;color:var(--s-ink);font-style:italic;}
  .s-cite{font-family:var(--s-bodyfont);font-size:2.8cqw;color:var(--s-accent,var(--brand));margin-top:3cqw;font-weight:600;}
  .s-statement{font-family:var(--s-titlefont);font-size:7cqw;line-height:1.12;color:var(--s-ink);font-weight:700;}
  .fill{flex:1 1 auto;}
  .center{justify-content:center;}
  .row2{display:flex;gap:5cqw;flex:1 1 auto;}
  .row2 > div{flex:1 1 0;}
  .colhead{font-family:var(--s-titlefont);font-size:3.6cqw;color:var(--s-ink);font-weight:700;margin-bottom:1.6cqw;}

  /* Objects */
  .s-objects{position:absolute;inset:0;pointer-events:none;}
  .s-obj{position:absolute;pointer-events:auto;cursor:move;}
  .s-obj.sel{outline:1.5px solid var(--brand);outline-offset:1px;}
  .s-obj img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
  .s-obj svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible;}
  .s-obj .txt{width:100%;height:100%;outline:none;font-family:var(--s-bodyfont);color:var(--s-ink);font-size:3.1cqw;line-height:1.3;overflow:hidden;pointer-events:none;}
  .s-obj.editing{cursor:text;}
  .s-obj.editing .txt{pointer-events:auto;}

  function updateObjBar(){
    var bar=document.getElementById("objbar");bar.innerHTML="";

    bar.className="objbar show";
    var names={image:"Image",text:"Text box",rect:"Rectangle",rrect:"Rounded",ellipse:"Ellipse",triangle:"Triangle",line:"Line",arrow:"Arrow"};
    var lbl=document.createElement("span");lbl.className="lbl";lbl.textContent=(names[o.t]||"Object")+" selected";bar.appendChild(lbl);
    var shape=(o.t==="rect"||o.t==="rrect"||o.t==="ellipse"||o.t==="triangle");
    if(shape){
      bar.appendChild(colorLabel("Fill",o.fill,function(v){o.fill=v;save();rerenderObjects();updateThumb(deck.current);}));
      bar.appendChild(colorLabel("Outline",(o.stroke&&o.stroke!=="none")?o.stroke:"#1f2329",function(v){o.stroke=v;if(!o.sw)o.sw=2;save();rerenderObjects();updateThumb(deck.current);}));
      bar.appendChild(tbtn("No outline","Remove outline","",function(){o.stroke="none";o.sw=0;save();rerenderObjects();updateThumb(deck.current);}));
    } else if(o.t==="line"||o.t==="arrow"){
      bar.appendChild(colorLabel("Colour",o.fill,function(v){o.fill=v;save();rerenderObjects();updateThumb(deck.current);}));
    }

    bar.appendChild(tbtn("Back","Send backward","",function(){reorderSelected(-1);}));

    document.getElementById("statSlide").textContent=(window.__APP_LANG__==="fr"?"Diapositive ":"Slide ")+(deck.current+1)+(window.__APP_LANG__==="fr"?" sur ":" of ")+deck.slides.length;

  function buildThumbs(){
    var host=document.getElementById("thumbs");host.innerHTML="";
    deck.slides.forEach(function(slide,i){
      var t=document.createElement("div");t.className="thumb"+(i===deck.current?" sel":"");
      var num=document.createElement("div");num.className="num";num.textContent=(i+1);t.appendChild(num);
      var mini=document.createElement("div");mini.className="mini";renderSlide(mini,slide,false);t.appendChild(mini);
      var tools=document.createElement("div");tools.className="tools";
      tools.appendChild(miniBtn("\u2191","Move up",function(e){e.stopPropagation();moveSlide(i,-1);}));
      tools.appendChild(miniBtn("\u2193","Move down",function(e){e.stopPropagation();moveSlide(i,1);}));
      t.appendChild(tools);
      t.addEventListener("click",function(){deck.current=i;save();renderCurrent();markSel();});
      host.appendChild(t);
    });

  function markSel(){var host=document.getElementById("thumbs");Array.prototype.forEach.call(host.children,function(c,i){c.className="thumb"+(i===deck.current?" sel":"");});}

  function addSlide(){var cur=curSlide();var layout=cur?(cur.layout==="title"?"titleContent":cur.layout):"titleContent";var s=newSlide(layout);deck.slides.splice(deck.current+1,0,s);deck.current+=1;save();buildThumbs();renderCurrent();}
  function duplicateSlide(){var cur=curSlide();if(!cur)return;var copy=newSlide(cur.layout);copy.f=JSON.parse(JSON.stringify(cur.f||{}));copy.o=JSON.parse(JSON.stringify(cur.o||[]));copy.o.forEach(function(o){o.id=uid("o");});copy.bg=cur.bg;copy.notes=cur.notes;deck.slides.splice(deck.current+1,0,copy);deck.current+=1;save();buildThumbs();renderCurrent();}
  function deleteSlide(){if(deck.slides.length<=1){deck.slides=[newSlide("title")];deck.current=0;}else{deck.slides.splice(deck.current,1);if(deck.current>=deck.slides.length)deck.current=deck.slides.length-1;}save();buildThumbs();renderCurrent();}
  function moveSlide(i,dir){var j=i+dir;if(j<0||j>=deck.slides.length)return;var t=deck.slides[i];deck.slides[i]=deck.slides[j];deck.slides[j]=t;if(deck.current===i)deck.current=j;else if(deck.current===j)deck.current=i;save();buildThumbs();renderCurrent();}

  function fileOpen(){
    var keys=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(WB)===0)keys.push(k.slice(WB.length));}}catch(e){}
    if(!keys.length){modal("Open deck",'<div style="color:#5a626c;font-size:14px">No saved decks yet. Use Save as to name and store one first.</div>');return;}
    var h='<div style="display:flex;flex-direction:column;gap:6px">'+keys.map(function(n){return '<button class="fmi-open" data-n="'+esc(n).replace(/"/g,"&quot;")+'">'+esc(n)+'</button>';}).join("")+'</div>';
    modal("Open deck",h);
    var bs=document.querySelectorAll(".fmi-open");
    Array.prototype.forEach.call(bs,function(b){b.addEventListener("click",function(){
      try{var d=JSON.parse(localStorage.getItem(WB+b.getAttribute("data-n")));if(d&&d.slides&&d.slides.length){if(!d.o){}d.slides.forEach(function(s){if(!s.o)s.o=[];if(s.notes==null)s.notes="";});d.current=0;if(!d.name)d.name=b.getAttribute("data-n");deck=d;closeModal();refreshAfterLoad();}else{window.alert("That saved item is not a deck.");}}
      catch(e){window.alert("Could not open that deck.");}
    });});
  }
  function importJSON(file){
    if(!file)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);if(d&&d.slides&&d.slides.length){d.slides.forEach(function(s){if(!s.o)s.o=[];if(s.notes==null)s.notes="";});d.current=0;deck=d;save();refreshAfterLoad();}else{window.alert("That file is not an Imago deck.");}}catch(e){window.alert("Could not read that file. It may not be a valid deck.");}};
    r.readAsText(file);
  }

</style><script>
(function(){
  function $(i){return document.getElementById(i);}
  var open=null;

  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });

    document.body.appendChild(d);d.addEventListener('mousedown',function(e){e.preventDefault();});return d;}
  function place(pop,btn){var r=btn.getBoundingClientRect();

    pop.style.top=(r.bottom+6)+'px';pop.classList.add('open');open=pop;}

      +window.__cdImg.LAYOUT_ORDER.map(function(id){

    return pop;
  }
  function buildThemes(){

      +'</div>';

      b.addEventListener('click',function(){ close(); try{window.__cdImg.setTheme(b.getAttribute('data-t'));}catch(e){} });});
    return pop;
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest?e.target.closest('#layoutGalBtn,#themeGalBtn'):null;

  },true);
  window.__cdImgGalleries=true;
})();
</script>

function cdAddOwnMark(after){
  var inp = document.createElement('input');

  function tap(el, fn) {

  function openPanel(anchor) {

    }

    head.className = 'sg-h'; head.textContent = 'Your signature';
    pop.appendChild(head);

    var tabs = document.createElement('div'); tabs.className = 'sg-tabs';
    var body = document.createElement('div');
    var mode = 'draw';
    ['Draw it', 'Type it', 'Scan it', 'Kept'].forEach(function (label, i) {

    function keep(canvas, label) {

      var list = load(); list.unshift(sig); save(list);

    function paint() {
      body.innerHTML = '';

        setTimeout(function () {
          var r = pad.getBoundingClientRect();
          pad.width = Math.round(r.width * 2);
          pad.height = Math.round(r.height * 2);

          g.scale(2, 2);
          g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';

        var row = document.createElement('div'); row.className = 'sg-row';

         ['Keep this signature', function () { var s = keep(pad); if (s) { mode = 'lib'; paint(); } }],
         ['Keep and place it', function () { var s = keep(pad); if (s) { insert(s); close(); } }]
        ].forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-act'; b.textContent = pair[0];

      }

      if (mode === 'type') {
        var inp = document.createElement('input');

        body.appendChild(inp);

        var hands = document.createElement('div'); hands.className = 'sg-hands';
        handList().forEach(function (h, i) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-hand';
          b.textContent = h.name;
          b.setAttribute('aria-pressed', String(i === handIndex));
          try {

            b.textContent = '';
            var mi = document.createElement('img');
            mi.src = mini.toDataURL('image/png');
            mi.style.cssText = 'height:22px;display:block;margin:0 auto 2px;';
            var cap = document.createElement('div');
            cap.style.cssText = 'font:10px Georgia,serif;color:#6b6b72;';
            cap.textContent = h.name;

          } catch (e) { b.textContent = h.name; }
          tap(b, function () {

            [].slice.call(hands.children).forEach(function (x, j) {
              x.setAttribute('aria-pressed', String(j === handIndex));
            });
            preview();
          });
          hands.appendChild(b);
        });
        body.appendChild(hands);

        var extra = document.createElement('div');
        extra.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;'
          + 'font:11.5px Georgia,serif;color:#6b6b72;';
        var inks = [['#151515', 'Black'], ['#1B3A6B', 'Blue black'], ['#1B6B93', 'Carpe Diem blue']];
        var inkNow = inks[0][0], weightNow = undefined, flourishNow = true;
        extra.appendChild(document.createTextNode('Ink:'));
        inks.forEach(function (pair, i) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-hand';
          b.style.cssText = 'min-height:34px;padding:5px 9px;';
          b.textContent = pair[1];
          b.setAttribute('aria-pressed', String(i === 0));
          tap(b, function () {
            inkNow = pair[0];
            [].slice.call(extra.querySelectorAll('button')).forEach(function (x) {

            });

        fl.type = 'button'; fl.className = 'sg-hand';
        fl.setAttribute('data-role', 'flourish');

        body.appendChild(extra);

        var pv = document.createElement('div');
        pv.style.cssText = 'margin-top:10px;min-height:70px;border:1px dashed rgba(0,0,0,.22);'
          + 'border-radius:8px;display:flex;align-items:center;justify-content:center;padding:8px;';
        body.appendChild(pv);
        function preview() {
          pv.innerHTML = '';
          var t = (inp.value || '').trim();
          if (!t) { pv.textContent = 'Your signature will appear here.'; pv.style.color = '#8a8a90'; return; }
          pv.style.color = '';
          var c = typeToCanvas(t, handIndex, { ink: inkNow, weight: weightNow, flourish: flourishNow });
          var im = document.createElement('img');
          im.src = c.toDataURL('image/png');
          im.style.cssText = 'max-height:56px;max-width:100%;';
          pv.appendChild(im);
          pv.__canvas = c;
        }
        inp.addEventListener('input', preview);
        preview();

        var row2 = document.createElement('div'); row2.className = 'sg-row';
        [['Keep this signature', function () {
            if (!pv.__canvas) { toast('Type a name first.', true); return; }
            var s = keep(pv.__canvas, inp.value.trim()); if (s) { mode = 'lib'; paint(); } }],
         ['Keep and place it', function () {
            if (!pv.__canvas) { toast('Type a name first.', true); return; }

        ].forEach(function (pair) {
          var b = document.createElement('button');

          tap(b, pair[1]); row2.appendChild(b);
        });
        body.appendChild(row2);
      }

      if (mode === 'scan') {
        /* cd-513-scan: HER INSTRUCTION. A visitor may already have a signature on
           paper. This takes a photograph or a scan of it, drops the paper and keeps
           the ink, so it sits on the line without a white box behind it, and then
           hands it to the same keep() every other hand goes through. Nothing is
           uploaded anywhere: the picture is read in the browser and kept in this
           browser, exactly as the note below the panel says. */
        var wrap = document.createElement('div');
        wrap.style.cssText = 'padding:10px 6px;';
        var lead = document.createElement('div');
        lead.style.cssText = 'font:13px Georgia,serif;color:#4a4a52;line-height:1.5;margin-bottom:10px;';
        lead.textContent = 'Choose a photograph or a scan of your own signature. The paper is dropped and the ink is kept, so it sits on the line rather than in a white box.';
        wrap.appendChild(lead);
        var pick = document.createElement('input');
        pick.type = 'file'; pick.accept = 'image/*';
        pick.style.cssText = 'display:block;width:100%;font:13px Georgia,serif;margin-bottom:10px;';
        wrap.appendChild(pick);

        shown.style.cssText = 'min-height:64px;display:flex;align-items:center;justify-content:center;';
        wrap.appendChild(shown);

        pick.addEventListener('change', function () {

            var im = new Image();
            im.onload = function () {
              var c = document.createElement('canvas');
              var sc = Math.min(1, 900 / (im.width || 1));
              c.width = Math.max(1, Math.round(im.width * sc));
              c.height = Math.max(1, Math.round(im.height * sc));
              var x = c.getContext('2d');
              x.drawImage(im, 0, 0, c.width, c.height);
              try {
                var dd = x.getImageData(0, 0, c.width, c.height), px = dd.data;
                for (var k = 0; k < px.length; k += 4) {

                  if (lum > 150) { px[k + 3] = 0; }
                  else { px[k] = 26; px[k + 1] = 34; px[k + 2] = 42; px[k + 3] = Math.min(255, Math.round((150 - lum) * 3.4)); }
                }

              var pv = document.createElement('img');
              pv.src = c.toDataURL('image/png');
              pv.style.cssText = 'max-height:64px;max-width:100%;';

         ['Keep and place it', function () { if (!made) { toast('Choose a picture first.', true); return; } var s = keep(made, 'Scanned hand'); if (s) { place(s); } }]
        ].forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sg-act'; b.textContent = pair[0];
          tap(b, pair[1]); rowS.appendChild(b);
        });
        body.appendChild(rowS);
        return;
      }

      if (mode === 'lib') {
        var list = load();
        if (!list.length) {
          var e = document.createElement('div');
          e.style.cssText = 'padding:18px 6px;color:#6b6b72;font:13px Georgia,serif;text-align:center;';
          e.textContent = 'Nothing kept yet. Draw one or type one, and it will wait here for you.';
          body.appendChild(e);
          return;
        }
        var grid = document.createElement('div'); grid.className = 'sg-lib';

           *** THIS REORDERS THE VIEW AND NOT THE STORE, AND THAT IS THE WHOLE POINT.

           FIRST ITEM IN THE STORED LIST IS THE DEFAULT. keep() unshifts, which is why
           her newest hand leads today. Sorting the stored array would have quietly
           changed the hand she signs with, which is exactly what she said must not
           happen. So the stored order is never touched; only the order this grid
           walks is changed, and her default stays her default. ***

           The weave is DELIBERATELY STABLE rather than random. A library that deals
           itself a new order every time it is opened cannot be learned, and she has to
           find the same hand twice. House hands keep their house order, and hers are
           spaced evenly through them so the two never sit as separate blocks. */
        function cdLibOrder(all) {

               out of first place. On the personal build the first stored item is the
               hand she signs with, and she wants to see it first. On the demo and gift
               builds the house hands still lead, because those are the portfolio and
               her hand is not the point there. The flag is set by the shell, which is
               the only place that knows which build this is. */
            var owner = false;
            try { owner = document.documentElement.getAttribute('data-cd-owner') === '1'; } catch (e) {}
            var lead = null, rest = all;
            if (owner && all.length && all[0] && !all[0].hand) { lead = all[0]; rest = all.slice(1); }
            var house = [], mine = [], i;
            for (i = 0; i < rest.length; i++) (rest[i] && rest[i].hand ? house : mine).push(rest[i]);
            if (!house.length || !mine.length) return lead ? [lead].concat(rest) : all.slice();

            }

          } catch (e) { return all.slice(); }

          var im = document.createElement('img'); im.src = sig.png; im.alt = sig.name || 'Signature';
          var nm = document.createElement('div'); nm.className = 'sg-cn';
          nm.textContent = sig.name || 'Signature';
          var mini = document.createElement('div'); mini.className = 'sg-mini';
          /* cd-513-fold: HER INSTRUCTION. Three buttons on every card made the
             Kept list read as a wall of controls. Each card now shows one quiet
             Place action and a small fold; Copy and Remove wait behind the fold
             until it is opened, and only one card's fold is open at a time. */
          var folded = true;

              pairs.push(['Remove', function () {
                save(load().filter(function (x) { return x.id !== sig.id; }));
                paint(); try { refresh(); } catch (e) {}
                toast('Signature removed.'); }]);
            }
            pairs.forEach(function (pair) {
              var b = document.createElement('button');
              b.type = 'button'; b.textContent = pair[0];
              tap(b, pair[1]); mini.appendChild(b);
            });

                  if (all[q] !== mini && all[q].__fold) all[q].__fold(true);
                }
              } catch (e) {}
              folded = open ? true : false;
              paintMini();
            });
            mini.appendChild(more);
          }
          mini.__fold = function (state) { folded = state; paintMini(); };
          paintMini();

    var r = anchor.getBoundingClientRect();
    var top = r.bottom + 6, left = r.left;
    if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, window.innerHeight - pop.offsetHeight - 8);
    if (left + pop.offsetWidth > window.innerWidth - 8) { /* PASS 451: keep the panel WITH its button. The old clamp pinned the panel to the viewport's right edge, which on a wide ribbon left it opening far away from the Signature group that summoned it. Prefer aligning the panel's RIGHT edge to the button's right edge, so it hangs directly under the control; fall back to the viewport clamp only if that would run off the left. */ var wanted = r.right - pop.offsetWidth; left = (wanted >= 8) ? wanted : Math.max(8, window.innerWidth - pop.offsetWidth - 8); }

       Her report: the panel opens on the far side of the page from the group it
       belongs to. MEASURED at full width in the studio, the sum above lands it
       correctly under its control, so I could not reproduce the placement she
       photographed and I will not pretend otherwise. What CAN be removed is the
       whole class of cause: the sum reads pop.offsetWidth the instant the panel is
       appended, and any path where layout has not settled reads that as zero,
       which throws the arithmetic to one edge.

          var h2 = pop.offsetHeight || pop.getBoundingClientRect().height || 0;
          var L2 = q2.right - w2;
          if (L2 < 8) L2 = Math.min(q2.left, window.innerWidth - w2 - 8);
          if (L2 + w2 > window.innerWidth - 8) L2 = window.innerWidth - w2 - 8;
          if (L2 < 8) L2 = 8;
          var T2 = q2.bottom + 6;
          if (T2 + h2 > window.innerHeight - 8) T2 = q2.top - h2 - 6;
          if (T2 < 8) T2 = 8;
          pop.style.left = Math.round(L2) + 'px';
          pop.style.top = Math.round(T2) + 'px';
        } catch (e) {}
      });
    } catch (e) {}

    function away(e) {
      if (!pop.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) close();
    }
    function close() {
      try { pop.remove(); } catch (e) {}
      document.removeEventListener('pointerdown', away, true);
    }
    pop.__close = close;
    pop.__repaint = function () { try { paint(); } catch (e) {} };
    setTimeout(function () { document.addEventListener('pointerdown', away, true); }, 0);

    }

    /* bounds, with room for the nib and the slant */
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    runs.forEach(function (r) {
      r.pts.forEach(function (p) {
        var sx = p[0] + p[1] * slant;
        if (sx < minX) minX = sx;
        if (sx > maxX) maxX = sx;
        if (p[1] < minY) minY = p[1];
        if (p[1] > maxY) maxY = p[1];
      });
    });
    if (maxX < minX) { minX = 0; maxX = 1; minY = 0; maxY = 1; }
    var pad = weight * 3 + 0.12;
    var w = (maxX - minX) + pad * 2, h = (maxY - minY) + pad * 2;

    var c = document.createElement('canvas');
    c.width = Math.max(8, Math.round(w * scale));
    c.height = Math.max(8, Math.round(h * scale));
    var g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.save();
    g.translate(0, c.height);
    g.scale(scale, -scale);
    g.translate(-minX + pad, -minY + pad);
    g.strokeStyle = ink;
    g.lineCap = 'round';
    g.lineJoin = 'round';

    var opt = { nib: H.nib, weight: weight, thin: H.thin, scale: 1 };
    runs.forEach(function (r) {
      var slanted = r.pts.map(function (p) { return [p[0] + p[1] * slant, p[1]]; });
      if (r.dot) {
        strokePath(g, slanted, { nib: H.nib, weight: weight * 1.5, thin: 0.9, scale: 1 });
      } else if (r.join) {
        strokePath(g, slanted, { nib: H.nib, weight: weight * 0.72, thin: opt.thin, scale: 1 });
      } else {
        strokePath(g, slanted, opt);
      }
    });

    /* An underline flourish, which is what most people actually add to a signature. */
    if (H.flourish > 0 && opts.flourish !== false && runs.length) {
      var y0 = minY - 0.10;
      var fl = [];
      for (var s = 0; s <= 26; s++) {
        var tt = s / 26;
        fl.push([minX + tt * (maxX - minX),
                 y0 + Math.sin(tt * Math.PI) * 0.16 * H.flourish - tt * 0.05]);
      }
      strokePath(g, smooth(fl, 3), { nib: H.nib, weight: weight * 0.8, thin: H.thin, scale: 1 });
    }
    g.restore();
    return c;
  }

  window.cdHand = { write: write, hands: HANDS };
})();

</script>
<script id="cd-print-bridge">
/* ---- Printing ------------------------------------------------------------
   window.print() works in Edge WebView2 and in ordinary browsers, and does nothing at
   all in WKWebView, which is what the Mac wrapper draws through. The studio therefore
   cannot decide on its own: it asks the host and waits briefly for an answer. Yes means
   the host will print the document itself. No, or silence from an older host, means the
   studio prints the way it always did. */
window.cdPrintViaHost = function (name, mime, content, fallback, accepted) {
  function later() { try { if (fallback) fallback(); } catch (e) {} }
  try {
    if (window.parent === window) { later(); return; }
    var payload;
    if (content instanceof Uint8Array) {
      payload = content.buffer.slice(content.byteOffset, content.byteOffset + content.byteLength);
    } else if (content instanceof ArrayBuffer) {
      payload = content;
    } else {
      payload = new TextEncoder().encode(String(content)).buffer;
    }
    var settled = false;
    function onReply(ev) {
      var d = ev && ev.data;
      if (!d || d.kind !== 'carpe-print-reply') return;
      if (settled) return;
      settled = true;
      window.removeEventListener('message', onReply);
      if (d.ok) { try { if (accepted) accepted(); } catch (e) {} }
      else later();
    }
    window.addEventListener('message', onReply);
    window.parent.postMessage({ kind: 'carpe-print', name: name, mime: mime, bytes: payload }, '*');
    setTimeout(function () {
      if (settled) return;
      settled = true;
      window.removeEventListener('message', onReply);
      later();               /* an older host that does not answer */
    }, 600);
  } catch (e) { later(); }
};
</script>
