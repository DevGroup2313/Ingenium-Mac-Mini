<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shell Test</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:20px/1.5 system-ui,sans-serif;background:#f5f3f7;color:#221a2e;text-align:center}</style>
</head><body><main><h1 id="h">Made by Fabrica</h1><p id="p"></p></main>
<script>
/* counts its own starts in its storage: after an update installed over it, the count goes on */
var n = 0; try { n = (parseInt(localStorage.getItem('fabrica-test-runs') || '0', 10) || 0) + 1; localStorage.setItem('fabrica-test-runs', String(n)); } catch (e) {}
document.title = 'Shell Test run ' + n;
document.getElementById('p').textContent = 'Started ' + n + ' time' + (n === 1 ? '' : 's') + ' on this device.';
</script></body></html>
