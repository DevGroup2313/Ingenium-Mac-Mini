it came, keeping your saved copies. Asks first.":"Remet tout comme à l’origine, en gardant vos copies enregistrées. Demande d’abord.","The largest thing here. Your saved copies survive it, so take one first and this becomes a door rather than a cliff.":"La plus grosse chose ici. Vos copies enregistrées y survivent, alors faites-en une d’abord et ceci devient une porte plutôt qu’une falaise.","What Magister says":"Ce que dit Magister","Every kind of thing he says is gathered here as he says it. Rewrite a line, add your own, take one out, or empty the list to hand it back to the house. Nothing is ever lost: the house words return the moment your list is empty.":"Chaque genre de chose qu’il dit est rassemblé ici à mesure qu’il le dit. Réécrivez une ligne, ajoutez la vôtre, retirez-en une, ou videz la liste pour la rendre à la maison. Rien n’est jamais perdu : les mots de la maison reviennent dès que votre liste est vide.","Nothing gathered yet. Talk with Magister for a minute, then come back: everything he says will be listed here, in his own words, ready to change.":"Rien de rassemblé pour l’instant. Parlez une minute avec Magister, puis revenez : tout ce qu’il dit sera listé ici, avec ses propres mots, prêt à être changé.","What the librarian says":"Ce que dit la bibliothécaire","Each way of asking her for a book, and the words she answers with. Rewrite them in your own voice, or hand any one back to the house.":"Chaque façon de lui demander un livre, et les mots par lesquels elle répond. Réécrivez-les avec votre propre voix, ou rendez-en un à la maison.","the house":"la maison","The house words. Edit and keep to make them yours.":"Les mots de la maison. Modifiez-les et gardez-les pour qu’ils deviennent les vôtres.","Keep these words":"Garder ces mots","Give it back to the house":"Le rendre à la maison","Something Russian":"Quelque chose de russe","The ancient world":"Le monde antique","Something about love":"Quelque chose sur l’amour","Something dark":"Quelque chose de sombre","To think morally with":"Pour penser moralement","One I have loved before":"Un livre que j’ai déjà aimé","Written by a woman":"Écrit par une femme","War and history":"La guerre et l’histoire","Faith and doubt":"La foi et le doute","Coming of age":"Le passage à l’âge adulte","Something funny":"Quelque chose de drôle","Epic and grand":"Épique et grandiose","Something short":"Quelque chose de court","Poetry and verse":"Poésie et vers","Nature and the world":"La nature et le monde","Money and class":"L’argent et la classe","Crime and justice":"Le crime et la justice","The mind and the self":"L’esprit et le moi","Freedom and rebellion":"Liberté et révolte","Adventure and the road":"L’aventure et la route","Ghosts and the gothic":"Fantômes et gothique","Myth and legend":"Mythe et légende","Family and inheritance":"La famille et l’héritage","The outsider":"L’étranger","Letters, diaries, memoir":"Lettres, journaux, mémoires","The absurd and the strange":"L’absurde et l’étrange","The city":"La ville","The countryside":"La campagne","Essays and ideas":"Essais et idées","Science and discovery":"Science et découverte","Art and music":"L’art et la musique","The sea and seafaring":"La mer et la navigation","Work and the poor":"Le travail et les pauvres","Satire and the sharp eye":"La satire et l’œil acéré","Utopia and dystopia":"Utopie et dystopie","Everyday and domestic life":"La vie quotidienne et domestique","History and the past":"L’histoire et le passé","Travel and elsewhere":"Le voyage et l’ailleurs","Dreams and the unconscious":"Les rêves et l’inconscient","Animals and the wild":"Les animaux et la vie sauvage","Food and the table":"La nourriture et la table","The body and illness":"Le corps et la maladie","How each session opens":"Comment s’ouvre chaque séance","Every kind of session, including the French tutor, and the words it opens with. These are the first thing you read when a session begins, so they set its tone.":"Chaque genre de séance, y compris le tuteur de français, et les mots par lesquels elle s’ouvre. Ce sont les premières choses que vous lisez au début d’une séance, ils en donnent donc le ton.","Project":"Projet","Editing Mode":"Mode révision","Rhythm of the day":"Le rythme de la journée","Open question":"Question ouverte","Weekly synthesis":"Synthèse de la semaine","His name":"Son nom","His session modes":"Ses modes de séance","Project · Whatever you are working on":"Projet · Ce sur quoi vous travaillez","Current reading · The Curriculum, current module":"Lecture en cours · Le Cursus, module en cours","Editing Mode · Paste a passage and I will read it closely":"Mode révision · Collez un passage et je le lirai de près","Rhythm of the day · What to do next":"Le rythme de la journée · Que faire ensuite","Open question · Anything else":"Question ouverte · Tout le reste","Weekly synthesis · Quiz on the week's work":"Synthèse de la semaine · Quiz sur le travail de la semaine","His opening words · one per mode":"Ses premiers mots · un par mode","His prompt chips · what they are called, and what he answers":"Ses pastilles · comment elles s’appellent, et ce qu’il répond","Quiz me":"Interroge-moi","Leave the reply empty and he answers in his own words.":"Laissez la réponse vide et il répond avec ses propres mots.","Push harder":"Pousse plus loin","More context":"Plus de contexte","Recommend a reading":"Conseille une lecture","Finishing block advice":"Conseils pour finir le bloc","The librarian · what the Library answers":"La bibliothécaire · ce que répond la Bibliothèque","The French tutor · the week’s work":"Le tuteur de français · le travail de la semaine","Weekly tasks":"Tâches de la semaine","Whatever you are working on":"Ce sur quoi vous travaillez","The Curriculum, current module":"Le Cursus, module en cours","Paste a passage and I will read it closely":"Collez un passage et je le lirai de près","What to do next":"Que faire ensuite","Anything else":"Tout le reste","Quiz on the week's work":"Quiz sur le travail cked, so neither can ever open.":"Un élément attend qu’un autre ait été travaillé, et cet autre est lui-même verrouillé, si bien qu’aucun des deux ne peut jamais s’ouvrir.","A tour card with no title":"Une carte de visite sans titre","A build with no tour left":"Une édition sans visite","The introduction page is empty":"La page d’introduction est vide","Every part of the door has been hidden, so it would open blank.":"Chaque partie de la porte a été masquée, elle s’ouvrirait donc vide.","An edit with nothing to edit":"Une modification sans rien à modifier","A licence with no name":"Une licence sans nom","The copy is set to be stamped, but no name has been given, so it would print blank.":"La copie doit être marquée, mais aucun nom n’a été donné, elle s’imprimerait donc à blanc.","Author preview is on in this copy, so you can see locked items and a reader cannot. Turn it off to see what they see.":"L’aperçu d’auteur est activé dans cette copie : vous voyez les éléments verrouillés, un lecteur non. Désactivez-le pour voir ce qu’il voit.","The door opens without them.":"La porte s’ouvre sans elles.","[your own card]":"[votre propre carte]","Tip:":"Conseil :","The committee demo":"La démo du comité","a contraction":"une contraction","an em dash":"un tiret cadratin","an exclamation":"une exclamation","an ampersand":"une esperluette","a straight quote":"un guillemet droit","long for one card":"longue pour une seule carte","house register: an em dash":"registre de la maison : un tiret cadratin","house register: an ampersand":"registre de la maison : une esperluette","house register: a contraction":"registre de la maison : une contraction","house register: an exclamation":"registre de la maison : une exclamation","house register: a straight quote":"registre de la maison : un guillemet droit","Reviewer’s copy":"Copie de relecture","This copy is for reading. Nothing in it can be changed, and any notes you leave in the Studio are yours to send back.":"Cette copie est faite pou ce of text, to copy into an email or a document.":"Toutes les notes en un seul texte, à copier dans un courriel ou un document.","Copy the notes":"Copier les notes","Notes on Carpe Diem":"Notes sur Carpe Diem","Nothing new in that — you already have those notes.":"Rien de nouveau là-dedans : vous avez déjà ces notes.","That is not a set of notes from a reviewer’s copy.":"Ce n’est pas un ensemble de notes venant d’une copie de relecture.","Undo the last change":"Annuler le dernier changement","Nothing has been changed from what the app ships with. Every room is as it was built.":"Rien n’a été changé par rapport à ce qu’apporte l’app. Chaque salle est telle qu’elle a été construite.","Undo this":"Annuler ceci","The Guidebook is not present in this copy, so there is nothing to author here.":"Le Guide n’est pas présent dans cette copie, il n’y a donc rien à rédiger ici.","Leaves the Studio and opens it as a reader of this copy would meet it.":"Quitte le Studio et l’ouvre tel qu’un lecteur de cette copie le rencontrerait.","A preview is in force, so the Guidebook here is not this copy’s own.":"Un aperçu est en cours : le Guide ici n’est donc pas celui de cette copie.","Stop previewing":"Arrêter l’aperçu","Hidden from this build":"Masqué dans cette édition","Held back until this date":"Retenu jusqu’à cette date","This date has passed, so it is showing":"Cette date est passée, il est donc montré","The tour is not present in this copy, so there is nothing to author here.":"La visite n’est pas présente dans cette copie, il n’y a donc rien à rédiger ici.","Leaves the Studio and runs the real tour, exactly as a reader of this copy would meet it.":"Quitte le Studio et lance la vraie visite, exactement comme un lecteur de cette copie la rencontrerait.","A preview is in force, so the tour in this copy is not its own. Stop it when you have finished looking.":"Un aperçu est en cours : la visite de cette copie n’est donc pas la sienne. Arrêtez-le quand vous avez fini de regarder."," not yet set":"une date pas encore fixée","a module not yet chosen":"un module pas encore choisi","has been worked.":"a été travaillé.","Locked by hand.":"Verrouillé à la main.","Who it is held from":"À qui il est retenu","When it opens":"Quand il s’ouvre","It opens once this module has been worked":"Il s’ouvre une fois ce module travaillé","Counted from the app’s own record of the sessions you have marked done.":"Compté à partir du relevé que tient l’app des séances que vous avez marquées faites.","Remove every lock and open the whole app?":"Retirer chaque verrou et ouvrir toute l’app ?","Return every colour to the house palette?":"Rendre à chaque couleur la palette de la maison ?","Hidden from the door":"Masquée sur la porte","Shown on the door":"Montrée sur la porte","Put the door back as it was":"Remettre la porte comme elle était","Every part shown again, in the order the app ships.":"Chaque partie de nouveau montrée, dans l’ordre d’origine de l’app.","Restore the door":"Restaurer la porte","The words of each part, and the top bar’s controls, are edited in The Frame.":"Les mots de chaque partie, et les commandes de la barre supérieure, se modifient dans Le Cadre.","Quick hand":"Écriture rapide","Nothing kept yet. Add a scan below, or write a name in one of the hands.":"Rien de gardé pour l’instant. Ajoutez une numérisation ci-dessous, ou écrivez un nom dans l’une des écritures.","What should this hand be called?":"Comment doit s’appeler cette écriture ?","That image could not be read.":"Cette image n’a pas pu être lue.","No specimens kept yet. Add one under “Add a scan”, or draw one in Tabula.":"Aucun spécimen gardé pour l’instant. Ajoutez-en un sous « Ajouter une numérisation », ou tracez-en un dans Tabula.","Scanned hand":"Écriture numérisée","Keep this hand":"Garder cette écriture","Remove every kept signature?":"Retirer chaque signature gardée ?","What is your strongest material for it right now?":"Quel est votre matériau le plus solide pour cela, maintenant La soirée est à vous","straight to it":"droit au but","guard the middle":"protéger le milieu","the last push":"le dernier effort","yours":"à vous","hidden":"masqué","done":"fait","this copy":"cette copie","Terms":"Trimestres","Course":"Cours","Pages":"Pages","proposal":"proposition","reading":"lecture","recovery":"repos","deadline":"échéance","Carpe Diem seal. Copyright (c) 2026 Yannie D. Forest. All rights reserved.":"Sceau de Carpe Diem. Copyright (c) 2026 Yannie D. Forest. Tous droits réservés.","Registered mark of Carpe Diem, by Yannie D. Forest. No licence granted; reproduction requires written permission.":"Marque déposée de Carpe Diem, par Yannie D. Forest. Aucune licence accordée ; toute reproduction exige une autorisation écrite.","Mine carries everything, for your own devices. Share carries the wording and look you authored and never your days, notes or marks. Fresh is a plain Carpe Diem. The choice is made once and every package follows it.":"La mienne porte tout, pour vos propres appareils. Partage porte la formulation et l’apparence que vous avez rédigées, jamais vos journées, vos notes ni vos marques. Neuve est un Carpe Diem simple. Le choix se fait une fois et chaque paquet le suit.","A file of your own":"Un fichier à vous","You may open an HTML file to work on instead of this build. It is read as text inside the page, exactly as the Forge reads one, and the same five makers fold it. Nothing is uploaded and nothing is installed.":"Vous pouvez ouvrir un fichier HTML sur lequel travailler à la place de cette édition. Il est lu comme du texte dans la page, exactement comme la Forge en lit un, et les mêmes cinq fabricants le plient. Rien n’est téléversé et rien n’est installé.","What cannot be made here":"Ce qui ne peut pas être fait ici","The Android Studio project inside the Fire release holds binaries no web page can produce, so it travels with the full release. The Fire package made here carries the Silk route and the hosting route, which need nothing else. A copy cannot make further copies or installers either: only a master carries its own source.":"Le projet Android Studio contenu dans la publication Fire renferme des binaires qu’aucune page web ne peut produire, il voyage donc avec la publication complète. Le paquet Fire fait ici porte la voie Silk et la voie d’hébergement, qui n’ont besoin de rien d’autre. Une copie ne peut pas non plus faire d’autres copies ni d’installateurs : seule une édition maîtresse porte sa propre source.","Programmes":"Programmes","Tabula is Latin for a writing tablet. It is a full word processor built into Carpe Diem, laid out in the classic ribbon manner: Home, Insert, Layout, Design, References, Mailings, Review and View, each with named groups of tools. Text is set in Times New Roman at twelve point to begin with. Styles appear as samples on the ribbon and in a Styles pane, and hovering any style, bullet, colour or table look previews it on the page before you choose. It writes a genuine .docx file and a genuine PDF, both saved to your own device, and it opens a .docx made anywhere else. On the Insert ribbon sit three groups that work together and are easily confused, so they are named apart: Signature is your LIBRARY of kept hands, drawn, scanned, or written for you in one of five house scripts if you have no scanner; PDF opens a PDF to fill and sign; and the Signing desk is where a document is PREPARED for signature. From the Signing desk you drop fillable boxes onto the page — a signature, initials, a date, a line of text — and click each one to fill it where it sits, the way a signing service works. A Sample agreement is there too, with its boxes already placed, so you can see the whole thing work before using it on anything of your own. Everything about signing happens on your machine: no document is sent anywhere, and the signing record says so on its face. Section breaks give each part of a long document its own header and footer. Mail merge writes a letter for every name on a list. Macros record the formatting steps you take and repeat them.":"Tabula, c’est le mot latin pour une tablette d’écriture. C’est un traitement de texte complet intégré à Carpe Diem, disposé à la manière classique d’un ruban : Accueil, Insertion, Mise en page, Création, Références, Publipostage, Révision et Affichage, chacun avec des groupes d’outils nommés. Le texte commence en Times New Roman, corps douze. Les styles paraissent en échantillons sur le ruban et dans un volet Styles, et survoler un style, une puce, une couleur ou un aspect de tableau en donne l’aperçu sur la page avant de choisir. Il écrit un véritable fichier .docx et un véritable PDF, tous deux enregistrés sur votre propre appareil, et il ouvre un .docx fait n’importe où ailleurs. Sur le ruban Insertion se tiennent trois groupes qui travaillent ensemble et se confondent facilement, ils sont donc nommés à part : Signature est votre BIBLIOTHÈQUE d’écritures gardées, tracées, numérisées, ou écrites pour vous dans l’une des cinq écritures de la maison si vous n’avez pas de numériseur ; PDF ouvre un PDF à remplir et à signer ; et le Bureau de signature est l’endroit où un document est PRÉPARÉ pour la signature. Depuis le Bureau de signature, vous déposez sur la page des cases à remplir (une signature, des initiales, une date, une ligne de texte) et vous cliquez sur chacune pour la remplir là où elle se trouve, comme le fait un service de signature. Un Exemple de contrat s’y trouve aussi, avec ses cases déjà placées, pour que vous voyiez le tout fonctionner avant de l’utiliser sur quoi que ce soit à vous. Tout ce qui touche à la signature se passe sur votre machine : aucun document n’est envoyé nulle part, et le relevé de signature le dit en toutes lettres. Les sauts de section donnent à chaque partie d’un long document ses propres en-tête et pied de page. Le publipostage écrit une lettre pour chaque nom d’une liste. Les macros enregistrent les étapes de mise en forme que vous faites et les répètent.","Carpe Diem signs its own documents. Tabula, Abacus and Imago each carry a signature panel with four tabs: Draw it, to sign with a finger or a mouse; Type it, to write a name and have the app draw it for you in any of thirteen hands; Scan it, to bring in a photograph of a signature already on paper, whose ink is kept and whose paper is dropped; and Kept, which holds every hand you have saved, ready to place into a document with one press. The same library is edited in the Carpe Diem’s Forge under Signatures, and whatever you keep in one place appears in all of them.":"Carpe Diem signe ses propres documents. Tabula, Abacus et Imago portent chacun un panneau de signature à quatre onglets : La tracer, pour signer du doigt ou à la souris ; La taper, pour écrire un nom et laisser l’app le tracer pour vous dans l’une de treize écritures ; La numériser, pour apporter la photo d’une signature déjà sur papier, dont l’encre est gardée et le papier retiré ; et Gardées, qui réunit chaque écriture enregistrée, prête à être placée dans un document d’une seule pression. La même bibliothèque se modifie dans la Forge de Carpe Diem, sous Signatures, et ce que vous gardez à un endroit paraît partout.","Type a name and it is drawn":"Tapez un nom et il est tracé","The hands are not fonts. Carpe Diem draws each letter itself, stroke by stroke, from a set of parameters for slant, nib, weight, join and flourish. That is why a hand looks the same on every machine and needs nothing installed, and why it can letter ANY name rather than only a scan of one.":"Les écritures ne sont pas des polices. Carpe Diem trace lui-même chaque lettre, trait par trait, à partir de réglages d’inclinaison, de plume, de graisse, de liaison et de fioriture. C’est pourquoi une écriture paraît la même sur chaque machine sans rien à installer, et pourquoi elle peut lettrer N’IMPORTE QUEL nom plutôt que la seule numérisation d’un nom.","Seven hands":"Sept écritures","Cursive, Copperplate, Roundhand, Quick hand, Upright, Looped and Printed. Type a name in the Carpe Diem’s Forge and all seven are drawn at once so the choice is made by eye, then keep the one you want.":"Cursive, Anglaise, Ronde, Écriture rapide, Droite, Bouclée et Script. Tapez un nom dans la Forge de Carpe Diem et les sept sont tracées à la fois pour que le choix se fasse à l’œil, puis gardez celle que vous voulez.","Kept, and shared across the apps":"Gardée, et partagée entre les apps","A kept hand is stored on your device only and is offered under Your signature in every app, so a letter written in Tabula and a sheet in Abacus can be signed with the same hand.":"Une écriture gardée est enregistrée sur votre seul appareil et proposée sous Votre signature dans chaque app, si bien qu’une lettre écrite dans Tabula et une feuille dans Abacus peuvent être signées de la même main.","Nothing is sent anywhere":"Rien n’est envoyé nulle part","Drawing, typing, keeping and placing all happen on the device. There is no account, no upload and no network request of any kind.":"Tracer, taper, garder et placer, tout se passe sur l’appareil. Il n’y a ni compte, ni téléversement, ni requête réseau d’aucune sorte.","On a slower device":"Sur un appareil plus lent","Carpe Diem keeps a number of small clocks running to hold the pages current. On a tablet or an older laptop those add up, so the app measures the machine once when it opens and slows the cosmetic ones where it needs to. Nothing is turned off and nothing is lost; the pages simply stop paying for work you cannot see. While the window is behind another one, they pause altogether.":"Carpe Diem fait tourner un certain nombre de petites horloges pour garder les pages à jour. Sur une tablette ou un ordinateur portable plus ancien, elles s’additionnent : l’app mesure donc la machine une fois à l’ouverture et ralentit les horloges décoratives là où il le faut. Rien n’est désactivé et rien n’est perdu ; les pages cessent simplement de payer pour un travail que vous ne voyez pas. Tant que la fenêtre est derrière une autre, elles s’arrêtent tout à fait.","The seal, beside the signature":"Le sceau, à côté de la signature","The same ribbon group carries Carpe Diem’s own marks, which are separate from your signature and are about the document rather than the signer. Seal places the Carpe Diem sigil. Crest and Formal place the lettered marks, the second with the name set out formally. Rule places a ruled line with the mark centred on it, which is what to use above a signature line or to close a letter. They are drawn by the app, so they print at any size without blurring, and like the signatures they are placed entirely on your device.":"Le même groupe du ruban porte les marques propres à Carpe Diem, distinctes de votre signature et qui concernent le document plutôt que le signataire. Sceau place le sigle de Carpe Diem. Blason et Formel placent les marques lettrées, la seconde avec le nom disposé de façon solennelle. Filet place une ligne avec la marque centrée dessus, à utiliser au-dessus d’une ligne de signature ou pour clore une lettre. Elles sont tracées par l’app, si bien qu’elles s’impriment à toute taille sans flou, et comme les signatures elles sont placées entièrement sur votre appareil.","Any studio can be sent out of the page into its own floating window, which you may move, resize from every edge and corner, and leave exactly where you like: Carpe Diem remembers each room's size and place and reopens it there. A window can also be folded away without closing: it shrinks into a small dock at the lower left that counts the windows resting there and shows a coloured bead for each in that studio's own colour. Press the dock to open a short list and press a line to bring that window back as you left it, or its cross to close it. The desk bar at the top works hand in hand with the dock: a tab reaches its room whether it sits on the desk or in a window, unfolding and fetching a strayed window back on screen, its cross closes the room either way, and Desk folds every floating window into the dock in one press. A second window of the same studio is named in brackets, Tabula (1), then Tabula (2), the way a computer names copies, so you always know which one a cross will close.":"Chaque studio peut sortir de la page dans sa propre fenêtre flottante, que vous pouvez déplacer, redimensionner par chaque bord et chaque coin, et laisser exactement où vous voulez : Carpe Diem se souvient de la taille et de la place de chaque salle et la rouvre là. Une fenêtre peut aussi être repliée sans être fermée : elle se réduit dans un petit dock en bas à gauche qui compte les fenêtres qui s’y reposent et montre une perle de couleur pour chacune, dans la couleur propre à son studio. Appuyez sur le dock pour ouvrir une courte liste, et sur une ligne pour faire revenir cette fenêtre telle que vous l’avez laissée, ou sur sa croix pour la fermer. La barre du bureau, en haut, travaille main dans la main avec le dock : un onglet atteint sa salle qu’elle soit sur le bureau ou dans une fenêtre, en dépliant et en ramenant à l’écran une fenêtre égarée, sa croix ferme la salle dans les deux cas, et Bureau replie toutes les fenêtres flottantes dans le dock d’une seule pression. Une seconde fenêtre du même studio est nommée entre parenthèses, Tabula (1), puis Tabula (2), comme un ordinateur nomme les copies, pour que vous sachiez toujours laquelle une croix fermera.","Resizing and remembering":"Redimensionner et se souvenir","Drag any edge or corner. A window will not shrink below a comfortable minimum and cannot be pushed off the screen. Whatever size and place you settle on is kept for next time, per studio.":"Tirez n’importe quel bord ou coin. Une fenêtre ne rétrécit pas en dessous d’un minimum confortable et ne peut pas être poussée hors de l’écran. La taille et la place que vous choisissez sont gardées pour la prochaine fois, studio par studio.","Folding rather than closing":"Replier plutôt que fermer","Folding puts the work aside without ending it. Nothing is saved or discarded by folding; the room simply waits in the dock until you call it back.":"Replier met le travail de côté sans y mettre fin. Rien n’est enregistré ni abandonné en repliant ; la salle attend simplement dans le dock que vous la rappeliez.","Nothing here can outrun the undo":"Rien ici ne peut échapper à l’annulation","Every card writes to the same store as the room behind it and lands in the same change log, so anything a shortcut does can be taken back from Notes on its own, without disturbing anything else. That is why a card is never offered for something the Studio could not undo.":"Chaque carte écrit dans la même réserve que la salle qui se tient derrière elle et entre dans le même journal des changements, si bien que tout ce que fait un raccourci peut être repris seul depuis Notes, sans rien déranger d’autre. C’est pourquoi une carte n’est jamais proposée pour une chose que le Studio ne pourrait pas annuler.","It says what it will do first":"Elle dit d’abord ce qu’elle fera","The sentence on a card is written before the action runs, not after, so you are never surprised by one. If a card would affect more than you expected, the sentence is where you will see that.":"La phrase d’une carte est écrite avant que l’action ne s’exécute, non après, si bien qu’aucune ne vous surprend. Si une carte devait toucher plus que vous ne l’attendiez, c’est dans la phrase que vous le verrez.","Every card carries a tip":"Chaque carte porte un conseil","Under the sentence sits a line of advice: when to reach for the card, what to expect afterwards, and when to do something else instead. Where a card tells you a quicker route exists, take the quicker route. The card is only the door you can always find.":"Sous la phrase se tient une ligne de conseil : quand prendre la carte, à quoi s’attendre ensuite, et quand faire autre chose à la place. Quand une carte vous dit qu’un chemin plus rapide existe, prenez le chemin plus rapide. La carte n’est que la porte que vous trouvez toujours.","When to use the room instead":"Quand utiliser la salle à la place","A shortcut is one press where the room behind it may hold thirty fields. Use the card when it does what you want, and the room when it does not; the card will tell you which room it changes.":"Un raccourci, c’est une pression, là où la salle derrière lui peut contenir trente champs. Utilisez la carte quand elle fait ce que vous voulez, et la salle quand elle ne le fait pas ; la carte vous dira quelle salle elle change.","Writing workshop.":"Atelier d’écriture.","Choose":"Choisir","Everything here is yours to change: built-ins can be edited, hidden, and restored; your own items sit beside them (dashed). All of it persists on this device and travels in Export all.":"Tout ici est à vous de le changer : ce qui est d’origine peut être modifié, masqué et restauré ; vos propres éléments se tiennent à côté (en pointillés). Tout persiste sur cet appareil et voyage avec Tout exporter.","Faults worth knowing about before you send a copy to anyone. Nothing here changes your work; it only tells you what it found, and takes you to the room where it can be put right.":"Les défauts à connaître avant d’envoyer une copie à qui que ce soit. Rien ici ne change votre travail ; cela vous dit seulement ce qui a été trouvé, et vous mène à la salle où cela peut être corrigé.","A lock that waits on something itself locked, so neither can ever open · a tour card rewritten to an empty title · a build whose tour has every card hidden · an introduction page with every part hidden · an edit kept for something no longer in the curriculum · a licence set to stamp with no name. These are the faults that can be told apart from a deliberate choice; anything subtler is left to you rather than guessed at.":"Un verrou qui attend une chose elle-même verrouillée, si bien qu’aucun des deux ne peut jamais s’ouvrir · une carte de visite réécrite avec un titre vide · une édition dont la visite a toutes ses cartes masquées · une page d’introduction dont chaque partie est masquée · une modification gardée pour une chose qui n’est plus dans le cursus · une licence à marquer sans nom. Ce sont les défauts qu’on peut distinguer d’un choix délibéré ; tout ce qui est plus subtil vous est laissé plutôt que deviné.","Two things worth knowing. The accent brings its own family with it – the deeper shade, the soft washes, the seal’s ink and the hairlines are all worked out from the one colour you pick, so nothing is left behind on the old blue. And a colour set here holds in every dress, Classic and Folio, day and night; empty a field to return that colour to the house.":"Deux choses à savoir. L’accent emmène sa propre famille : la teinte plus profonde, les lavis légers, l’encre du sceau et les filets sont tous calculés à partir de la seule couleur que vous choisissez, si bien que rien ne reste sur l’ancien bleu. Et une couleur réglée ici tient dans chaque tenue, Classique et Folio, de jour comme de nuit ; videz un champ pour rendre cette couleur à la maison.","Terms and their modules. Edits to a built-in are kept as overrides; Hide removes it from the app until Restored. New terms and modules are yours outright. The Library’s term shelves follow whatever stands here.":"Les trimestres et leurs modules. Les modifications d’un élément d’origine sont gardées comme surcharges ; Masquer le retire de l’app jusqu’à sa restauration. Les nouveaux trimestres et modules sont entièrement à vous. Les étagères de trimestre de la Bibliothèque suivent ce qui se tient ici.","How a society imagines itself: myth, war, history, and the invention of the examined life.":"Comment une société s’imagine elle-même : le mythe, la guerre, l’histoire, et l’invention de la vie examinée.","Faith, power, and the slow invention of the individual.":"La foi, le pouvoir, et la lente invention de l’individu.","The social order argued over: reason, satire, sentiment, revolt.":"L’ordre social en débat : la raison, la satire, le sentiment, la révolte.","The novel as proto-sociology: class, ambition, money, marriage.":"Le roman comme proto-sociologie : la classe, l’ambition, l’argent, le mariage.","Ideas lived as fates. The novel answers philosophy.":"Des idées vécues comme des destins. Le roman répond à la philosophie.","The self under modern institutions: stage, bureaucracy, absurdity, inheritance.":"Le moi sous les institutions modernes : la scène, la bureaucratie, l’absurde, l’héritage.","The app’s own words, yours to change. Empty a field to return to the built-in text. Renames hold through the app’s re-renders; they are applied a beat after each redraw.":"Les mots propres à l’app, à vous de les changer. Videz un champ pour revenir au texte d’origine. Les renommages tiennent à travers les redessins de l’app ; ils sont appliqués un instant après chaque redessin.","Term lectures carry frame, arc, question, howToRead. Module lectures are richer objects; edit as JSON and keep the field names.":"Les cours de trimestre portent frame, arc, question, howToRead. Les cours de module sont des objets plus riches ; modifiez-les en JSON et gardez le nom des champs.","Three switches over how Carpe Diem carries itself. They change nothing you have written; they change only how the pages behave. Each one holds on this device and travels in Export all.":"Trois interrupteurs sur la façon dont Carpe Diem se tient. Ils ne changent rien de ce que vous avez écrit ; ils ne changent que le comportement des pages. Chacun tient sur cet appareil et voyage avec Tout exporter.","How much time the app takes to change state. Three is the house setting; one is stillness.":"Le temps que prend l’app pour changer d’état. Trois est le réglage de la maison ; un, c’est l’immobilité.","In a single offline file, hiding is not securing. A lock keeps an item off the page; it does not remove it from the file, and anyone who opens the source can read it. If something must genuinely be absent from a copy you send, it has to be left out when the copy is made, which is what the demo builds do.":"Dans un seul fichier hors ligne, masquer n’est pas protéger. Un verrou retire un élément de la page ; il ne l’enlève pas du fichier, et quiconque ouvre la source peut le lire. Si une chose doit réellement être absente d’une copie que vous envoyez, il faut la laisser de côté au moment où la copie est faite, ce que font les éditions de démonstration.","One question bank per module id. Each question: { q, opts, a (index of the right option), why }. Banks you set replace the built-in bank for that module; Delete removes the bank entirely.":"Une banque de questions par identifiant de module. Chaque question : { q, opts, a (indice de la bonne option), why }. Les banques que vous définissez remplacent la banque d’origine de ce module ; Supprimer retire entièrement la banque.","Seminar decks by term id. Edit as JSON; a template deck is offered for new terms.":"Supports de séminaire par identifiant de trimestre. Modifiez-les en JSON ; un support modèle est proposé pour les nouveaux trimestres.","A scanned or drawn signature is a picture of one particular name. It can be kept, placed and copied, and it can be looked at while choosing a hand — but it CANNOT be re-lettered into somebody else’s name. If another person is to sign with this app, they should type their own name into one of the hands above; that is the only route that genuinely writes a name that was never scanned.":"Une signature numérisée ou tracée est l’image d’un nom précis. Elle peut être gardée, placée et copiée, et on peut la regarder en choisissant une écriture, mais elle NE PEUT PAS être relettrée au nom de quelqu’un d’autre. Si une autre personne doit signer avec cette app, elle doit taper son propre nom dans l’une des écritures ci-dessus ; c’est le seul chemin qui écrive vraiment un nom qui n’a jamais été numérisé.","The line each book hands to the next, read on the Library’s thread beneath the book’s title. One line per module; an emptied line returns the built-in one.":"La ligne que chaque livre tend au suivant, lue sur le fil de la Bibliothèque sous le titre du livre. Une ligne par module ; une ligne vidée rend celle d’origine.","The people of the house and the words they open with. Empty a field to return it to the built-in text. Magister’s modes are the chips on his card; the librarian’s intents are the questions the Library answers.":"Les gens de la maison et les mots par lesquels ils commencent. Videz un champ pour lui rendre le texte d’origine. Les modes de Magister sont les pastilles de sa fiche ; les intentions de la bibliothécaire sont les questions auxquelles répond la Bibliothèque.","The same walk, for cursive. Write each letter the way it looks inside a word, with its joining tails in, and the sample is kept beside your printed one; both are matched when a word is read. Joined writing is the hard case and always was: it reads less surely than print, and it reads better with every letter you add.":"Le même parcours, pour la cursive. Écrivez chaque lettre telle qu’elle paraît dans un mot, avec ses liaisons, et l’exemple est gardé à côté de votre exemple en script ; les deux sont comparés quand un mot est lu. L’écriture liée est le cas difficile, et l’a toujours été : elle se lit moins sûrement que le script, et elle se lit mieux à chaque lettre ajoutée.","Put the cursor in any field anywhere in Carpe Diem, or in Tabula, Abacus and Imago in their floats and windows, and a small pen appears beside it. Press the pen and the slate opens along the foot of the screen. Write a letter, pause, and it becomes text where the cursor was. Press Joined hand on the slate to write whole words in cursive: the word is read when you pause. Printed letters read best; a joined word is read less surely, and every letter you teach raises it.":"Placez le curseur dans n’importe quel champ de Carpe Diem, ou de Tabula, Abacus et Imago dans leurs panneaux et leurs fenêtres, et un petit stylo paraît à côté. Appuyez sur le stylo et l’ardoise s’ouvre au pied de l’écran. Écrivez une lettre, marquez une pause, et elle devient du texte là où était le curseur. Appuyez sur Écriture liée sur l’ardoise pour écrire des mots entiers en cursive : le mot est lu quand vous marquez une pause. Les lettres en script se lisent le mieux ; un mot lié se lit moins sûrement, et chaque lettre que vous apprenez améliore la lecture.","You will not usually come here for it. The pen appears beside any field you put the cursor in, which is the quicker way; this card is for trying it before you have a field in mind.":"Vous ne viendrez généralement pas ici pour cela. Le stylo paraît à côté de tout champ où vous placez le curseur, ce qui est le chemin le plus rapide ; cette carte sert à l’essayer avant d’avoir un champ en tête.","It lands in the first term where you can move and rename it. Adding is the easy part; deciding where it belongs in the year is worth pausing over.":"Il arrive dans le premier trimestre, où vous pouvez le déplacer et le renommer. Ajouter est la partie facile ; décider de sa place dans l’année mérite qu’on s’y arrête."};
