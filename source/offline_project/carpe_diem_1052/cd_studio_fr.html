/* the Author Studio's own words in French; its rooms, its prompts and its messages */
(function () {
  'use strict';
  var D = {"⚒️ Author Studio":"⚒️ Studio d’auteur","All changes kept":"Toutes les modifications sont gardées","Guide":"Guide","🎓 Learn":"🎓 Apprendre","Export all":"Tout exporter","Import all":"Tout importer","Reset all overrides":"Annuler toutes les modifications","Close":"Fermer","⚒️ The Forge":"⚒️ La Forge","⋯ More":"⋯ Plus","The Guide":"Le Guide","The Editor":"L’Éditeur","Find":"Chercher","Look":"Apparence","Colours":"Couleurs","The Frame":"Le Cadre","The Door":"La Porte","Interface":"Interface","Workshop":"Atelier","The Faculty":"La Faculté","Library":"Bibliothèque","Lectures":"Cours magistraux","The Tour":"La Visite","Signatures":"Signatures","Licence":"Licence","Access":"Accès","Per-build presets":"Préréglages par édition","Before you send":"Avant d’envoyer","Checks":"Vérifications","Safekeeping":"Mise à l’abri","Notes":"Notes","Author Studio":"Studio d’auteur","on this device":"sur cet appareil","At the desk":"À mon bureau","Light":"Clair","Full":"Complet","Sky":"Ciel","How the Studio works, in five short parts":"Comment fonctionne le Studio, en cinq courtes parties","Open the Forge here, with its own editor and preview":"Ouvrir la Forge ici, avec son propre éditeur et son aperçu","Guide, Export all, Import all, Reset all overrides":"Guide, Tout exporter, Tout importer, Annuler toutes les modifications","Fold the rooms away":"Replier les salles","Filter the rooms":"Filtrer les salles","Motion":"Mouvement","Guidebook":"Guide","Langue / Language":"Langue / Language","❓ The Guide":"❓ Le Guide","How the Studio works, in five short parts. Read this first if anything here is unclear.":"Comment fonctionne le Studio, en cinq courtes parties. Lisez ceci d’abord si quelque chose vous semble obscur.","Read one card, then go and do that one thing. This room is not meant to be read through in a sitting.":"Lisez une carte, puis allez faire cette seule chose. Cette salle n’est pas faite pour être lue d’une traite.","What this room is":"Ce qu’est cette salle","Hide bar":"Masquer la barre","The Carpe Diem’s Forge is where Carpe Diem stops being a finished object and becomes yours. Every word the app says, every course it teaches, and every voice that speaks in it can be rewritten here. Nothing leaves the device: your changes are written where you sit, and they travel only when you carry them yourself.":"La Forge de Carpe Diem est l’endroit où Carpe Diem cesse d’être un objet fini et devient le vôtre. Chaque mot que dit l’app, chaque cours qu’elle enseigne et chaque voix qui y parle peuvent être réécrits ici. Rien ne quitte l’appareil : vos changements sont écrits là où vous êtes, et ils ne voyagent que lorsque vous les emportez vous-même.","Open the Studio when the app says something that is not quite true of your work. A single renamed page often does more for the feel of the year than an hour of settings.":"Ouvrez le Studio quand l’app dit quelque chose qui n’est pas tout à fait vrai de votre travail. Une seule page renommée change souvent plus l’atmosphère de l’année qu’une heure de réglages.","How the Studio is laid out":"Comment le Studio est organisé","The sidebar on the left holds every room, listed under its shelf name: Start here, How it looks, What it says, The course, Telling people, Sending a copy, and Keeping it safe. Nothing sits behind a strip: scroll the list and every room is there, with the open room marked. The box at the top filters the list as you type.":"La barre latérale de gauche réunit toutes les salles, rangées sous le nom de leur étagère : Pour commencer, L’apparence, Ce qu’elle dit, Le cursus, Le faire savoir, Envoyer une copie, et La mise à l’abri. Rien n’est caché derrière un onglet : faites défiler la liste et chaque salle y est, avec la salle ouverte marquée. La case du haut filtre la liste à mesure que vous tapez.","If you cannot remember which shelf something is on, do not hunt: press the slash key, or open Find, and search for it by name.":"Si vous ne vous rappelez plus sur quelle étagère se trouve une chose, ne cherchez pas à la main : appuyez sur la barre oblique, ou ouvrez Chercher, et trouvez-la par son nom.","The three gestures, and nothing else":"Les trois gestes, et rien d’autre","Almost everything here works one of three ways. Type in a field to change a word. Empty a field to put the built-in wording back. And where there is a list, restore the whole list to return it as it was made. There is no save button anywhere: a change is kept the moment you leave the field.":"Presque tout ici fonctionne de l’une de trois façons. Tapez dans un champ pour changer un mot. Videz un champ pour remettre la formulation d’origine. Et là où il y a une liste, restaurez toute la liste pour la rendre telle qu’elle a été faite. Il n’y a aucun bouton Enregistrer : un changement est gardé dès que vous quittez le champ.","If you are unsure whether something took, look at the room’s line in the rail. It counts what you have changed.":"Si vous doutez qu’une chose ait été prise en compte, regardez la ligne de la salle dans la barre. Elle compte ce que vous avez changé.","Watching the page while you work":"Regarder la page pendant que vous travaillez","Every room offers Show the screen. It puts the part of Carpe Diem that room changes beside your work, and it follows every keystroke. It is the real page, not a drawing of it, so what you see is what a reader sees. In the Tour and the Guidebook there is a second, quieter preview under the fields, which shows the words themselves and says which of them are yours and which are the app’s.":"Chaque salle propose Montrer l’écran. Il place la partie de Carpe Diem que cette salle modifie à côté de votre travail, et il suit chaque frappe. C’est la vraie page, pas un dessin, donc ce que vous voyez est ce que voit un lecteur. Dans la Visite et le Guide, un second aperçu, plus discret, se tient sous les champs : il montre les mots eux-mêmes et dit lesquels sont les vôtres et lesquels sont ceux de l’app.","Turn the screen on for anything to do with how the app looks, and off when you are writing long prose, because the movement can pull at your attention.":"Allumez l’écran pour tout ce qui touche à l’apparence de l’app, et éteignez-le quand vous écrivez une longue prose, car le mouvement peut tirer sur votre attention.","Making a change you can walk back":"Faire un changement sur lequel on peut revenir","Before a large edit, go to Keeping it safe and save a named backup. It takes one press. From then on you can restore that exact state, and restoring keeps what it replaced as its own backup, so even the wrong restore is recoverable. Every single change is also written into a log with the room and the time, and any one of them can be taken back on its own without touching anything else.":"Avant une grosse modification, allez dans La mise à l’abri et enregistrez une sauvegarde nommée. Cela prend une pression. Dès lors, vous pouvez restaurer exactement cet état, et la restauration garde ce qu’elle a remplacé comme sa propre sauvegarde, si bien que même une mauvaise restauration se rattrape. Chaque changement est aussi inscrit dans un journal avec la salle et l’heure, et chacun peut être repris seul sans toucher au reste.","The habit worth having: name the backup after what you are about to do, such as “before rewriting the tour”, rather than after the date. You will know which one you want.":"L’habitude qui vaut la peine : nommez la sauvegarde d’après ce que vous allez faire, par exemple « avant de réécrire la visite », plutôt que d’après la date. Vous saurez laquelle vous voulez.","Working on one thing at a time":"Travailler sur une chose à la fois","The rooms are small on purpose. A good session is one room, one kind of change, and then a look at the page. If you find yourself with four rooms half-done, that is the moment to stop and save a backup rather than to push on. The change log will still be there tomorrow, and it will tell you exactly where you left off.":"Les salles sont petites à dessein. Une bonne séance, c’est une salle, un seul genre de changement, puis un coup d’œil à la page. Si vous vous retrouvez avec quatre salles à moitié faites, c’est le moment de vous arrêter et d’enregistrer une sauvegarde plutôt que de continuer. Le journal des changements sera encore là demain, et il vous dira exactement où vous vous êtes arrêté.","When you do not know where to start, start in Checks. It tells you what is worth a second look, and it is a shorter list than your own memory of what needs doing.":"Quand vous ne savez pas par où commencer, commencez par Vérifications. Elle vous dit ce qui mérite un second regard, et c’est une liste plus courte que votre propre mémoire de ce qu’il reste à faire.","Each copy tells its own truth":"Chaque copie dit sa propre vérité","You send four kinds of copy: your own, the committee demo, the public sample, and the gift edition. The Tour, the Guidebook, and the locks are kept separately for each one, because a reader must not be told about something their copy does not have. Before you send is the room that reads the app itself and lists what that copy will and will not show.":"Vous envoyez quatre sortes de copies : la vôtre, la démo du comité, l’échantillon public et l’édition cadeau. La Visite, le Guide et les verrous sont gardés à part pour chacune, car on ne doit pas parler à un lecteur de ce que sa copie ne contient pas. Avant d’envoyer est la salle qui lit l’app elle-même et liste ce que cette copie montrera et ne montrera pas.","The order that works: author the copy, apply its preset, read Before you send, then make the release. Reading the report last is what stops a copy promising more than it holds.":"L’ordre qui marche : préparer la copie, appliquer son préréglage, lire Avant d’envoyer, puis faire la publication. Lire le rapport en dernier, c’est ce qui empêche une copie de promettre plus qu’elle ne contient.","What a lock can and cannot do":"Ce qu’un verrou peut faire, et ce qu’il ne peut pas faire","A lock keeps an item off the page. In a single offline file that is all it can do: the words are still inside the file, and anyone who opens the source can read them. If something must genuinely be absent from a copy you send, it has to be left out when the copy is made — which is what a release does, and why the release route exists at all.":"Un verrou retire un élément de la page. Dans un seul fichier hors ligne, c’est tout ce qu’il peut faire : les mots sont toujours dans le fichier, et quiconque ouvre la source peut les lire. Si une chose doit réellement être absente d’une copie que vous envoyez, il faut la laisser de côté au moment où la copie est faite, ce que fait une publication, et c’est pourquoi la voie de publication existe.","Never rely on a lock for anything you would mind being read. Use it for tidiness and for pacing, and use a release for privacy.":"Ne comptez jamais sur un verrou pour une chose que vous n’aimeriez pas voir lue. Servez-vous-en pour l’ordre et pour le rythme, et d’une publication pour la confidentialité.","When it feels like too much":"Quand c’est trop","Thirty rooms is more than anyone holds in mind, and you are not meant to. Nothing here is urgent, nothing is sequential, and nothing breaks if it is left half-done. The Studio remembers the shelf you were on, the room you were in, and every change you made, so you can leave in the middle of a sentence and come back to it. If a room feels heavy, close it: the app underneath is already finished and working.":"Trente salles, c’est plus que quiconque ne garde en tête, et ce n’est pas ce qu’on vous demande. Rien ici n’est urgent, rien n’est séquentiel, et rien ne se casse si on le laisse à moitié fait. Le Studio se souvient de l’étagère où vous étiez, de la salle où vous vous trouviez et de chaque changement fait, si bien que vous pouvez partir au milieu d’une phrase et y revenir. Si une salle vous pèse, fermez-la : l’app en dessous est déjà finie et fonctionne.","If you only ever do three things here, let them be these: save a backup before a big edit, keep one room open at a time, and read Before you send before you send.":"Si vous ne faites jamais que trois choses ici, que ce soient celles-ci : enregistrer une sauvegarde avant une grosse modification, garder une seule salle ouverte à la fois, et lire Avant d’envoyer avant d’envoyer.","If something looks wrong":"Si quelque chose semble faux","First empty the field — that alone returns the built-in wording. If a whole room looks wrong, restore its list or, in Keeping it safe, take back the last change. If the app itself looks wrong rather than the words, the Look and Colours rooms have a Reset, and neither of them touches a single thing you have written.":"Videz d’abord le champ : cela seul rend la formulation d’origine. Si toute une salle semble fausse, restaurez sa liste ou, dans La mise à l’abri, reprenez le dernier changement. Si c’est l’app elle-même qui semble fausse plutôt que les mots, les salles Apparence et Couleurs ont une réinitialisation, et aucune des deux ne touche à une seule chose que vous avez écrite.","Nothing you can do in this room can damage the app or lose your reading. The worst case is a reset, and the app comes back exactly as it was made.":"Rien de ce que vous pouvez faire dans cette salle ne peut abîmer l’app ni faire perdre vos lectures. Le pire, c’est une réinitialisation, et l’app revient exactement telle qu’elle a été faite.","🔍 Find":"🔍 Chercher","Search everything: what you have written, and what the app came with. Thirty rooms is past remembering.":"Tout chercher : ce que vous avez écrit, et ce que l’app contenait d’origine. Trente salles, c’est au-delà de ce qu’on retient.","Search the words you half remember. It looks through the app’s own text as well as yours, so it finds things you have never edited.":"Cherchez les mots dont vous vous souvenez à moitié. La recherche parcourt le texte de l’app aussi bien que le vôtre, et trouve donc des choses que vous n’avez jamais modifiées.","Search everything at once: the words you have written in any room, and the words the app came with. Each result says which room it belongs to, and whether it is yours or built in.":"Tout chercher à la fois : les mots que vous avez écrits dans n’importe quelle salle, et les mots d’origine de l’app. Chaque résultat dit à quelle salle il appartient, et s’il est de vous ou d’origine.","Search":"Chercher","Looks through every room, and through the app’s own words as well.":"Parcourt chaque salle, ainsi que les mots propres à l’app.","Type two letters or more. Searching for a book, a module, a chip, a tour card or a phrase you half remember writing all works the same way.":"Tapez au moins deux lettres. Chercher un livre, un module, une pastille, une carte de la visite ou une phrase que vous croyez avoir écrite fonctionne de la même façon.","a book, a phrase, a name…":"un livre, une phrase, un nom…","🔐 Access":"🔐 Accès","What is open and what is held back: lock a term, a module, a bank, a book or a page, and say when it opens.":"Ce qui est ouvert et ce qui est retenu : verrouillez un trimestre, un module, une banque, un livre ou une page, et dites quand il s’ouvre.","A lock keeps something off the page. It does not remove it from the file — for that, make a release.":"Un verrou retire une chose de la page. Il ne l’enlève pas du fichier : pour cela, faites une publication.","What Carpe Diem shows, and what it holds back. Lock a term, a module, a bank of exercises, a book or a whole page, and it leaves the app until you release it – by hand, on a date, or once a module has actually been worked.":"Ce que Carpe Diem montre, et ce qu’il retient. Verrouillez un trimestre, un module, une banque d’exercices, un livre ou une page entière, et il quitte l’app jusqu’à ce que vous le libériez : à la main, à une date, ou une fois qu’un module a réellement été travaillé.","One thing said plainly, because it matters: a lock keeps an item off the page, it does not take it out of the file. Anyone who opens the source can still read it. If a copy you send must genuinely not contain something, mark it “absent from a copy I send” and use Export release manifest below – that list is what a stripped build is made from, and it is the only honest way to withhold in a single offline file.":"Une chose dite clairement, parce qu’elle compte : un verrou retire un élément de la page, il ne le sort pas du fichier. Quiconque ouvre la source peut encore le lire. Si une copie que vous envoyez ne doit vraiment pas contenir une chose, marquez-la « absente d’une copie que j’envoie » et utilisez Exporter le manifeste de publication ci-dessous : cette liste est ce à partir de quoi une édition allégée est faite, et c’est la seule façon honnête de retenir quelque chose dans un seul fichier hors ligne.","Author preview":"Aperçu d’auteur","OFF – you are seeing the app exactly as a reader would.":"DÉSACTIVÉ : vous voyez l’app exactement comme un lecteur la verrait.","Turn on":"Activer","Terms · 6":"Trimestres · 6","Open.":"Ouvert.","Lock":"Verrouiller","Modules and lessons · 10":"Modules et leçons · 10","Quizzes and exercises · 5":"Quiz et exercices · 5","Library books · 15":"Livres de la bibliothèque · 15","Ascensus courses · 4":"Cours d’Ascensus · 4","Seminar decks · 1":"Supports de séminaire · 1","Pages · 8":"Pages · 8","The release manifest":"Le manifeste de publication","Export release manifest":"Exporter le manifeste de publication","Nothing is marked as needing to be absent from a sent copy yet.":"Rien n’est encore marqué comme devant être absent d’une copie envoyée.","Export":"Exporter","Unlock everything":"Tout déverrouiller","Every lock is removed and the whole app is open again.":"Chaque verrou est retiré et toute l’app est de nouveau ouverte.","Unlock all":"Tout déverrouiller","📅 Agenda":"📅 Agenda","The shapes of the day, the blocks that fill them, and how far ahead the This week card looks.":"Les formes de la journée, les blocs qui les remplissent, et jusqu’où regarde la carte Cette semaine.","A day shape is a promise to yourself, not a schedule. Keep the blocks few and the wording kind.":"Une forme de journée est une promesse faite à soi-même, pas un emploi du temps. Gardez peu de blocs et des mots bienveillants.","The shapes of the day, as they appear on the morning door and along the top of Home. Empty a field to return it to the built-in wording.":"Les formes de la journée, telles qu’elles paraissent sur la porte du matin et en haut de l’Accueil. Videz un champ pour lui rendre la formulation d’origine.","The day shapes":"Les formes de la journée","4 items · built-in":"4 éléments · d’origine","Add":"Ajouter","Reverse":"Inverser","Empty it":"Vider","Copy":"Copier","Remove":"Retirer","Before the work · shared by every shape":"Avant le travail · commun à toutes les formes","The “This week” card":"La carte « Cette semaine »","How far ahead it looks":"Jusqu’où elle regarde","Drawn once per week shown, by the app’s own renderer.":"Dessinée une fois par semaine affichée, par le moteur de l’app elle-même.","One week":"Une semaine","A fortnight":"Une quinzaine","A month":"Un mois","Magister’s opening words live under The Faculty. The rest of his replies are assembled from several banks and are the next piece of work.":"Les premiers mots de Magister se trouvent sous La Faculté. Le reste de ses réponses est assemblé à partir de plusieurs banques et constitue le prochain chantier.","Name":"Nom","Description":"Description","Time":"Heure","What happens":"Ce qui se passe","Length":"Durée","🧩 Hidden architecture":"🧩 Architecture cachée","The brass plate at the top of the Shelves: its question, and the note that unfolds beneath it.":"La plaque de laiton en haut des Étagères : sa question, et la note qui se déplie dessous.","The brass plate at the top of the Shelves: its title, its question, and the note that unfolds beneath it. Emptied fields return the built-in words.":"La plaque de laiton en haut des Étagères : son titre, sa question, et la note qui se déplie dessous. Les champs vidés rendent les mots d’origine.","Title":"Titre","The question":"La question","The note":"La note","The coda":"La coda","The envoi":"L’envoi","Keep":"Garder","Restore the built-in note":"Restaurer la note d’origine","The courses of the ascent, and their order.":"Les cours de l’ascension, et leur ordre.","Courses are the slow half of the app. Nothing here needs to be finished this week.":"Les cours sont la moitié lente de l’app. Rien ici n’a besoin d’être fini cette semaine.","Ascensus courses: lessons with body paragraphs, practice, and a three-question quiz. The template gives a complete working course to fill in.":"Cours d’Ascensus : des leçons avec des paragraphes, de la pratique et un quiz de trois questions. Le modèle donne un cours complet et fonctionnel à remplir.","+ New course":"+ Nouveau cours","Import courses":"Importer des cours","Edit":"Modifier","Hide":"Masquer","📊 Assessments":"📊 Évaluations","What the parts of a mark are called.":"Comment s’appellent les parties d’une note.","These words appear in more than one place. Change one and check the Assessments page before moving on.":"Ces mots paraissent à plus d’un endroit. Changez-en un et vérifiez la page Évaluations avant de continuer.","What the parts of a mark are called, wherever they appear – the module card, the Assessments page, and the record. Empty a field to return it to the built-in wording.":"Comment s’appellent les parties d’une note, partout où elles paraissent : la fiche du module, la page Évaluations et le relevé. Videz un champ pour lui rendre la formulation d’origine.","The parts of a mark":"Les parties d’une note","Checkpoints":"Points d’étape","READING CHECKPOINTS (20%)":"POINTS D’ÉTAPE DE LECTURE (20 %)","ESSAY (40%)":"DISSERTATION (40 %)","Dialogue":"Dialogue","MAGISTER DIALOGUE (30%)":"DIALOGUE AVEC MAGISTER (30 %)","Quiz":"Quiz","✏️ Quick quiz (10%)":"✏️ Quiz rapide (10 %)","Record mark":"Noter","+ Record mark":"+ Noter","Another attempt":"Une autre tentative","+ Another attempt":"+ Une autre tentative","Best quiz":"Meilleur quiz","best quiz":"meilleur quiz","Records tab":"Onglet Relevés","🎓 Candidatus":"🎓 Candidatus","The proposal, its sections, and the work around it.":"La proposition, ses sections, et le travail qui l’entoure.","Keep the programme list short enough to look at without flinching.":"Gardez la liste des programmes assez courte pour la regarder sans frémir.","Milestones live in your saved state, so they are edited directly and stick like any other progress. The dissertation set lays down the full writing road, not just the proposal.":"Les jalons vivent dans votre état enregistré : ils se modifient donc directement et restent comme tout autre progrès. L’ensemble Mémoire trace toute la route d’écriture, pas seulement la proposition.","+ Milestone":"+ Jalon","+ Dissertation set":"+ Ensemble Mémoire","Funding · Visa":"Financement · Visa","The rest of the candidature record, editable whole.":"Le reste du dossier de candidature, modifiable en entier.","⚠️ Checks":"⚠️ Vérifications","Faults worth knowing about before you send a copy: locks that can never open, edits pointing at things that no longer exist.":"Les défauts à connaître avant d’envoyer une copie : des verrous qui ne peuvent jamais s’ouvrir, des modifications qui visent des choses qui n’existent plus.","Nothing here is an error. It is a list of things worth a second look, and it is yours to overrule.":"Rien ici n’est une erreur. C’est une liste de choses qui méritent un second regard, et vous restez libre de passer outre.","Nothing to report":"Rien à signaler","Every check passed. Locks can open, nothing has been emptied that the app expects to find, and no edit is pointing at something that has since gone.":"Toutes les vérifications sont passées. Les verrous peuvent s’ouvrir, rien de ce que l’app s’attend à trouver n’a été vidé, et aucune modification ne vise une chose disparue depuis.","The house register":"Le registre de la maison","Everything you have written keeps the house register: no contractions, no em dashes, no exclamations, no ampersands. That is the voice the rest of the app is written in, so new text sits beside the old without a seam.":"Tout ce que vous avez écrit garde le registre de la maison : pas de contractions, pas de tirets cadratins, pas d’exclamations, pas d’esperluettes. C’est la voix dans laquelle le reste de l’app est écrit, si bien que le nouveau texte se place à côté de l’ancien sans couture.","What is checked":"Ce qui est vérifié","🎨 Colours":"🎨 Couleurs","The accent, the page ground, the gilt, and how deep the Library reads.":"L’accent, le fond de la page, la dorure, et la profondeur de teinte de la Bibliothèque.","The accent carries five relatives with it, so the whole page moves together. Try it at night as well before you settle.":"L’accent emmène cinq parentes avec lui, si bien que toute la page bouge ensemble. Essayez-le aussi de nuit avant de vous décider.","The colours Carpe Diem is built from. A change here reaches every page at once, because the app is drawn from a small set of named colours rather than painted page by page.":"Les couleurs dont Carpe Diem est fait. Un changement ici atteint toutes les pages à la fois, car l’app est dessinée à partir d’un petit ensemble de couleurs nommées plutôt que peinte page par page.","The app":"L’app","The accent":"L’accent","Headings, links, the seal’s ink, every soft wash and hairline drawn from it.":"Les titres, les liens, l’encre du sceau, chaque lavis léger et chaque filet en sont tirés.","House":"Maison","The page ground":"Le fond de la page","The colour behind everything in the daylight dresses.":"La couleur derrière tout, dans les tenues de jour.","The gilt":"La dorure","The gold of the Library, the folio hairlines and the book lettering.":"L’or de la Bibliothèque, les filets du folio et le lettrage des livres.","How dark the room reads":"La profondeur de teinte de la salle","The wood only. The books, the gilt lettering and the cards keep their own colours at every setting.":"Le bois seulement. Les livres, le lettrage doré et les cartes gardent leurs propres couleurs à chaque réglage.","The Library’s gold":"L’or de la Bibliothèque","Its hairlines, its tab edges and the light along a top edge. The lit edge is worked out from this one colour.":"Ses filets, les bords de ses onglets et la lumière le long d’un bord supérieur. Le bord éclairé est calculé à partir de cette seule couleur.","Starting again":"Recommencer","Return every colour to the house":"Rendre à chaque couleur celle de la maison","Nothing else in the Studio is touched.":"Rien d’autre dans le Studio n’est touché.","Reset colours":"Réinitialiser les couleurs","📚 Curriculum":"📚 Cursus","The terms and modules: their titles, their texts, and their order.":"Les trimestres et les modules : leurs titres, leurs textes et leur ordre.","Order is argument. The sequence of terms says what you think depends on what.":"L’ordre est un argument. La suite des trimestres dit ce qui, selon vous, dépend de quoi.","+ New term":"+ Nouveau trimestre","Import terms/modules":"Importer des trimestres ou des modules","+ Module":"+ Module","🚪 The Door":"🚪 La Porte","Every part of the introduction page: hide it, move it, put it back.":"Chaque partie de la page d’introduction : la masquer, la déplacer, la remettre.","Hide is not delete: a hidden part comes back the moment you show it. Use the screen beside you to watch the door change.":"Masquer n’est pas supprimer : une partie masquée revient dès que vous la montrez. Utilisez l’écran à côté de vous pour regarder la porte changer.","The introduction page, part by part. Hide what you do not want, put the rest in the order you like, and rewrite any of it. Nothing is destroyed: a hidden part returns the moment you show it again, and an emptied field returns the built-in wording.":"La page d’introduction, partie par partie. Masquez ce que vous ne voulez pas, mettez le reste dans l’ordre qui vous plaît, et réécrivez-en n’importe quelle partie. Rien n’est détruit : une partie masquée revient dès que vous la montrez de nouveau, et un champ vidé rend la formulation d’origine.","Open the introduction page":"Ouvrir la page d’introduction","Leaves the Studio and shows the page as it now stands, so you can see what you have changed.":"Quitte le Studio et montre la page telle qu’elle est maintenant, pour que vous voyiez ce que vous avez changé.","Open it":"L’ouvrir","The introduction page has not been seen yet in this copy, so its parts are not known. Open it once with the button above and every part will be listed here from then on, whether the page is on screen or not.":"La page d’introduction n’a pas encore été vue dans cette copie, ses parties ne sont donc pas connues. Ouvrez-la une fois avec le bouton ci-dessus et chaque partie sera listée ici dès lors, que la page soit à l’écran ou non.","🌅 The Frame":"🌅 Le Cadre","The top bar’s controls, and the words of the introduction page.":"Les commandes de la barre supérieure, et les mots de la page d’introduction.","Empty a field to get the built-in wording back. Nothing here is destroyed by rewriting it.":"Videz un champ pour retrouver la formulation d’origine. Rien ici n’est détruit en le réécrivant.","The parts of Carpe Diem that sit outside the rooms: the row of controls along the top, and the introduction page that greets you. Empty a field to return it to the built-in wording.":"Les parties de Carpe Diem qui se tiennent hors des salles : la rangée de commandes en haut, et la page d’introduction qui vous accueille. Videz un champ pour lui rendre la formulation d’origine.","Language mark":"Marque de langue","The introduction page":"La page d’introduction","The introduction page is not on screen just now. Open it once from the seal, then return here and its words will be listed for editing.":"La page d’introduction n’est pas à l’écran pour l’instant. Ouvrez-la une fois depuis le sceau, puis revenez ici et ses mots seront listés pour être modifiés.","📘 The Guidebook":"📘 Le Guide","Its chapters and its wording, kept separately for each build you send, and the Language page with them.":"Ses chapitres et sa formulation, gardés à part pour chaque édition que vous envoyez, avec la page Langue.","The Guidebook is what a reader consults when they are lost. Say the plain thing first, and the interesting thing second.":"Le Guide est ce qu’un lecteur consulte quand il est perdu. Dites d’abord la chose simple, puis la chose intéressante.","The Guidebook, chapter by chapter, and the words around it. As with the tour, each build keeps its own, so a reader is only ever told about the copy in front of them.":"Le Guide, chapitre par chapitre, et les mots qui l’entourent. Comme pour la visite, chaque édition garde le sien, si bien qu’on ne parle jamais à un lecteur que de la copie qu’il a devant lui.","Which build is this Guidebook for":"Pour quelle édition est ce Guide","Authoring the Guidebook for":"Rédiger le Guide pour","This copy is running the the committee demo.":"Cette copie est la démo du comité.","Your own copy":"Votre propre copie","The committee demo (this copy)":"La démo du comité (cette copie)","The public sample":"L’échantillon public","The gift edition":"L’édition cadeau","See it, and show it":"Le voir, et le montrer","Open the Guidebook":"Ouvrir le Guide","Shows the personal build’s Guidebook in this copy, so you can read what that reader would.":"Montre le Guide de l’édition personnelle dans cette copie, pour que vous lisiez ce que ce lecteur lirait.","Write out a demonstration":"Écrire une démonstration","Every chapter this build will show, in order, with its words.":"Chaque chapitre que cette édition montrera, dans l’ordre, avec ses mots.","Write it":"L’écrire","Print":"Imprimer","Its wording, and the Language page":"Sa formulation, et la page Langue","Welcome to Carpe Diem":"Bienvenue dans Carpe Diem","The language of Carpe Diem":"La langue de Carpe Diem","Finding your way":"S’orienter","The language":"La langue","🧭 Take the guided tour":"🧭 Faire la visite guidée","A chapter for every room of the house":"Un chapitre pour chaque salle de la maison","🚪 Return to the introduction page":"🚪 Revenir à la page d’introduction","Add a chapter":"Ajouter un chapitre","A chapter of your own":"Un chapitre à vous","Added to the end of this build’s Guidebook.":"Ajouté à la fin du Guide de cette édition.","The chapters":"Les chapitres","Rewrite":"Réécrire","Its title":"Son titre","What it says":"Ce qu’il dit","Its tip":"Son conseil","The same chapter in French":"Le même chapitre en français","The app carries no French Guidebook of its own, so what you write here is what a French reader will see. Left empty, they see the English.":"L’app n’a pas de Guide français à elle, donc ce que vous écrivez ici est ce qu’un lecteur francophone verra. Laissé vide, il voit l’anglais.","Opens on":"S’ouvre le","Leave empty and it shows straight away.":"Laissez vide et il paraît aussitôt.","As the reader will read it":"Tel que le lecteur le lira","built-in":"d’origine","The Carpe Diem’s Forge can build working copies of Carpe Diem for every device you own, in the page, with nothing sent anywhere. The Installers room folds one file, a web folder that installs to a home screen and works with the network off, and the Fire, Mac and Windows packages. Every icon is drawn from the door seal at the moment you press the button, so a package always carries the seal your build actually wears.":"La Forge de Carpe Diem peut fabriquer des copies fonctionnelles de Carpe Diem pour chacun de vos appareils, dans la page, sans rien envoyer nulle part. La salle Installateurs prépare un fichier unique, un dossier web qui s’installe sur un écran d’accueil et fonctionne hors réseau, et les paquets pour la Fire, le Mac et Windows. Chaque icône est tirée du sceau de la porte au moment où vous appuyez sur le bouton, si bien qu’un paquet porte toujours le sceau que votre édition arbore réellement.","The words only. Press Open it above to see the Guidebook itself.":"Seulement les mots. Appuyez sur L’ouvrir ci-dessus pour voir le Guide lui-même.","The last line of About carries the build: its date, its pass number and a short fingerprint of the file itself. That is the quickest way to tell whether a device is running the newest copy, which matters when the same app lives on a desk, a tablet and a phone at once. The fingerprint differs between the full app, the demo and the gift on purpose, so two editions can never be mistaken for one another.":"La dernière ligne d’À propos porte l’édition : sa date, son numéro de passe et une courte empreinte du fichier lui-même. C’est la façon la plus rapide de savoir si un appareil fait tourner la copie la plus récente, ce qui compte quand la même app vit à la fois sur un bureau, une tablette et un téléphone. L’empreinte diffère volontairement entre l’app complète, la démo et le cadeau, pour que deux éditions ne puissent jamais être confondues.","Inside the Carpe Diem’s Forge there is a shelf of ready-made changes, so that the things you are most likely to want do not have to be hunted for. Each is a card: a name, a sentence saying exactly what it will do before it does it, and one button. They are grouped by what they touch, running from the words the app uses, through how it looks and the order of things.":"Dans la Forge de Carpe Diem se trouve une étagère de changements tout prêts, pour que les choses que vous voudrez le plus probablement n’aient pas à être cherchées. Chacun est une carte : un nom, une phrase qui dit exactement ce qu’il fera avant de le faire, et un bouton. Elles sont regroupées selon ce qu’elles touchent, des mots que l’app emploie jusqu’à son apparence et à l’ordre des choses.","Start again":"Recommencer","Restore this build’s Guidebook":"Restaurer le Guide de cette édition","Puts every chapter back to its built-in wording, order and visibility.":"Remet chaque chapitre à sa formulation, son ordre et sa visibilité d’origine.","Restore":"Restaurer","🎛 Interface":"🎛 Interface","The names of the pages, the headings, and the buttons on Magister’s card.":"Les noms des pages, les titres, et les boutons de la fiche de Magister.","Rename a page to the word you actually use for it. The app follows the name everywhere, including its own sentences.":"Renommez une page du mot que vous employez vraiment pour elle. L’app suit le nom partout, y compris dans ses propres phrases.","Navigation · the pages":"Navigation · les pages","Schedule":"Emploi du temps","Books":"Livres","Ascent":"Ascension","Emptying a navigation or button field restores the built-in name on the next full load.":"Vider un champ de navigation ou de bouton rend le nom d’origine au prochain chargement complet.","Magister’s buttons · the stones":"Les boutons de Magister · les pierres","Page and Overview headings":"Titres des pages et de l’Aperçu","Readings":"Lectures","Candidature":"Candidature","Restore all interface text":"Restaurer tout le texte de l’interface","Subtitle":"Sous-titre","🗄️ Safekeeping":"🗄️ Mise à l’abri","Named backups of all your work, a record of what you changed, and a way to undo it.":"Des sauvegardes nommées de tout votre travail, un relevé de ce que vous avez changé, et un moyen de l’annuler.","Save a named backup before a large edit. It costs one press and it is the only thing that makes a bad hour undoable.":"Enregistrez une sauvegarde nommée avant une grosse modification. Cela coûte une pression et c’est la seule chose qui rend une mauvaise heure réversible.","Everything you author lives in one place, and until now the only way back from a change you did not want was to reset all of it. This room keeps named copies of your work, records what you changed and when, and lets you take back a single change without touching anything else.":"Tout ce que vous rédigez vit en un seul endroit, et jusqu’ici le seul retour possible après un changement non voulu était de tout réinitialiser. Cette salle garde des copies nommées de votre travail, note ce que vous avez changé et quand, et vous laisse reprendre un seul changement sans toucher au reste.","Take back a change":"Reprendre un changement","Nothing to undo yet":"Rien à annuler pour l’instant","Once you change something in any room it will appear here, and you can take it back.":"Dès que vous changez quelque chose dans une salle, cela paraîtra ici, et vous pourrez le reprendre.","Backups":"Sauvegardes","Save everything under a name":"Tout enregistrer sous un nom","A complete copy of your work as it stands, kept here so you can come back to it. Worth doing before a large edit.":"Une copie complète de votre travail tel qu’il est, gardée ici pour que vous puissiez y revenir. Utile avant une grosse modification.","Save":"Enregistrer","No backups yet. Nothing is lost by making one: it is a copy, and it does not change anything you have written.":"Pas encore de sauvegarde. On ne perd rien à en faire une : c’est une copie, et elle ne change rien à ce que vous avez écrit.","Where your work is":"Où se trouve votre travail","The rooms you have written in, and roughly how much is in each. This is measured against a fresh copy, so it answers “what would I lose” rather than “what did I do last”.":"Les salles dans lesquelles vous avez écrit, et à peu près combien il y a dans chacune. C’est mesuré par rapport à une copie neuve, et cela répond donc à « que perdrais-je » plutôt qu’à « qu’ai-je fait en dernier ».","Open":"Ouvrir","What you changed, most recent first":"Ce que vous avez changé, le plus récent d’abord","Nothing yet. Every change you make from now on is recorded here, newest first, with the room it belongs to and the time you made it.":"Rien pour l’instant. Chaque changement que vous ferez désormais sera noté ici, le plus récent d’abord, avec la salle à laquelle il appartient et l’heure où vous l’avez fait.","Before rewriting the tour":"Avant de réécrire la visite","📜 Lectures":"📜 Cours magistraux","The briefings a term or a module opens with.":"Les exposés par lesquels s’ouvre un trimestre ou un module.","A lecture body is long. Write it here if you like, but Tabula is the better desk for real prose.":"Le corps d’un cours magistral est long. Écrivez-le ici si vous voulez, mais Tabula est le meilleur bureau pour une vraie prose.","TERM LECTURES":"COURS DE TRIMESTRE","+ Term lecture":"+ Cours de trimestre","MODULE LECTURES":"COURS DE MODULE","+ Module lecture":"+ Cours de module","📖 Library":"📖 Bibliothèque","The open shelf, the reading that sits outside the course.":"L’étagère ouverte, les lectures qui se tiennent hors du cursus.","The shelf is yours to keep honest: take a book off when you have stopped reading it, rather than leaving it as a reproach.":"L’étagère est à vous de la garder honnête : retirez un livre quand vous avez cessé de le lire, plutôt que de le laisser comme un reproche.","The Library’s term shelves are authored on the Curriculum tab. This is the Open Shelf: free-standing books, one per line, written as Title (Author).":"Les étagères de trimestre de la Bibliothèque se rédigent dans l’onglet Cursus. Ici, c’est l’Étagère ouverte : des livres indépendants, un par ligne, écrits sous la forme Titre (Auteur).","Save shelf":"Enregistrer l’étagère","Restore built-in shelf":"Restaurer l’étagère d’origine","⚖️ Licence":"⚖️ Licence","Whose copy this is. Stamp a gifted build with the name it was prepared for.":"À qui appartient cette copie. Marquez une édition offerte du nom pour lequel elle a été préparée.","Stamp a copy before you send it, so a copy in the wild always says who it was prepared for.":"Marquez une copie avant de l’envoyer, pour qu’une copie en circulation dise toujours pour qui elle a été préparée.","A gifted copy cannot be made to expire: an offline file is the whole product, and anything it counts is reset the moment it is copied. What it can carry is a name. Fill this in before you send a copy, and the colophon and the About page will say who it was prepared for – so a copy passed on without your leave still says where it came from.":"Une copie offerte ne peut pas être faite pour expirer : un fichier hors ligne est le produit entier, et tout ce qu’il compte est remis à zéro dès qu’il est copié. Ce qu’il peut porter, c’est un nom. Remplissez ceci avant d’envoyer une copie, et le colophon et la page À propos diront pour qui elle a été préparée, si bien qu’une copie transmise sans votre accord dit encore d’où elle vient.","Prepared for":"Préparée pour","The name of the person or committee":"Le nom de la personne ou du comité","Issued":"Délivrée le","A date, if you want one recorded":"Une date, si vous voulez en noter une","Note":"Note","Anything else, briefly – a reference, an occasion":"Autre chose, brièvement : une référence, une occasion","No name is set, so no licence line is shown. Your own copies need none.":"Aucun nom n’est défini, donc aucune ligne de licence n’est montrée. Vos propres copies n’en ont pas besoin.","💡 Look":"💡 Apparence","Depth, movement and glitter: three switches and two balancers.":"Profondeur, mouvement et scintillement : trois interrupteurs et deux curseurs d’équilibre.","Change one switch, look at the page, then change the next. Three at once and you cannot tell which one you liked.":"Changez un interrupteur, regardez la page, puis changez le suivant. Trois à la fois et vous ne saurez pas lequel vous a plu.","Watching the screen":"Regarder l’écran","The page is shown beside you and follows every change you make.":"La page est montrée à côté de vous et suit chaque changement que vous faites.","Hide the screen":"Masquer l’écran","The screen is open beside this room so each switch can be seen rather than imagined. Drag it by its title, or resize it from any edge.":"L’écran est ouvert à côté de cette salle pour que chaque interrupteur soit vu plutôt qu’imaginé. Déplacez-le par son titre, ou redimensionnez-le par n’importe quel bord.","Depth":"Profondeur","The raised, three-dimensional look: the cast under every button, card and stone, and the way they rise to the pointer and press when clicked. Turned off, every surface lies flat on the page.":"L’aspect en relief, en trois dimensions : l’ombre sous chaque bouton, chaque carte et chaque pierre, et la façon dont ils montent vers le pointeur et s’enfoncent au clic. Désactivé, chaque surface est posée à plat sur la page.","On":"Activé","Movement":"Mouvement","Everything that moves: cards entering, panels opening, the lift and press themselves. Turned off, the app changes state without any motion at all.":"Tout ce qui bouge : les cartes qui entrent, les panneaux qui s’ouvrent, l’élévation et l’enfoncement eux-mêmes. Désactivé, l’app change d’état sans aucun mouvement.","Glitter":"Scintillement","The small caught light on the app stones and the seal. Turned off, the faces stay still and matte.":"La petite lumière captée sur les pierres des apps et sur le sceau. Désactivé, les faces restent immobiles et mates.","The balancers":"Les curseurs d’équilibre","How far surfaces stand off the page. Three is the house setting.":"À quelle distance les surfaces se détachent de la page. Trois est le réglage de la maison.","The app’s own Display panel keeps its Motion setting for full, calm and minimal. These switches sit beneath it: Movement off is the same stillness as minimal, and it holds wherever you set it.":"Le panneau Affichage de l’app garde son réglage Mouvement : complet, calme et minimal. Ces interrupteurs se placent en dessous : Mouvement désactivé est la même immobilité que minimal, et il tient où que vous le régliez.","The long list read straight through beside the curriculum: the built-in list, one book per line.":"La longue liste lue d’un bout à l’autre à côté du cursus : la liste d’origine, un livre par ligne.","The built-in Marathon list, one book per line, written as Title (Author). A reader’s own list, made with Edit list on the Marathon page, stands on top of this one.":"La liste d’origine du Marathon, un livre par ligne, écrite sous la forme Titre (Auteur). La liste propre à un lecteur, faite avec Modifier la liste sur la page Marathon, se place par-dessus celle-ci.","Save list":"Enregistrer la liste","Restore built-in list":"Restaurer la liste d’origine","📝 Notes":"📝 Notes","What a reviewer wants to say back, and anything they have already sent you.":"Ce qu’un relecteur veut vous répondre, et tout ce qu’il vous a déjà envoyé.","What a reviewer sends back lands here. Take their notes in, then work through them one room at a time.":"Ce qu’un relecteur renvoie arrive ici. Prenez ses notes, puis traitez-les une salle à la fois.","Remarks left by whoever you sent a reviewer’s copy to. If they send their notes back, paste them in at the foot of this room.":"Les remarques laissées par la personne à qui vous avez envoyé une copie de relecture. Si elle vous renvoie ses notes, collez-les au pied de cette salle.","Nothing yet":"Rien pour l’instant","No notes are kept in this copy.":"Aucune note n’est gardée dans cette copie.","Take notes back in":"Reprendre des notes","Paste what they sent":"Collez ce qu’on vous a envoyé","The data form from their copy. Notes you already have are not added twice.":"Le formulaire de données venu de sa copie. Les notes que vous avez déjà ne sont pas ajoutées deux fois.","Take them in":"Les prendre","📤 Before you send":"📤 Avant d’envoyer","What this copy will and will not show a reader, read from the app’s own rules rather than described by hand.":"Ce que cette copie montrera et ne montrera pas à un lecteur, lu dans les règles mêmes de l’app plutôt que décrit à la main.","Read this last, before you send anything. Every number is counted from the app, so it cannot flatter you.":"Lisez ceci en dernier, avant d’envoyer quoi que ce soit. Chaque nombre est compté dans l’app, il ne peut donc pas vous flatter.","What a reader of this copy will and will not see. Every number here is counted from the app as it stands in this file, not written down by hand, so it cannot promise something the reader cannot reach.":"Ce qu’un lecteur de cette copie verra et ne verra pas. Chaque nombre ici est compté dans l’app telle qu’elle est dans ce fichier, et non noté à la main, il ne peut donc pas promettre une chose que le lecteur ne peut pas atteindre.","This copy":"Cette copie","The committee demo: a sample of the content, with Export kept":"La démo du comité : un échantillon du contenu, avec l’export conservé","Worked out from what this file carries, the same way the app works it out.":"Déduit de ce que porte ce fichier, de la même façon que l’app le déduit.","What it shows":"Ce qu’elle montre","Terms in the curriculum":"Trimestres du cursus","Modules":"Modules","Banks of exercises":"Banques d’exercices","Books on the shelf":"Livres sur l’étagère","Courses in Ascensus":"Cours d’Ascensus","Seminar decks":"Supports de séminaire","Pages in the navigation":"Pages de la navigation","Cards in the guided tour":"Cartes de la visite guidée","What a reader can reach":"Ce qu’un lecteur peut atteindre","The Carpe Diem’s Forge":"La Forge de Carpe Diem","No":"Non","Export, Import and Backup":"Export, import et sauvegarde","Yes":"Oui","What is held back":"Ce qui est retenu","Nothing is locked or hidden in this copy. A reader sees all of the above.":"Rien n’est verrouillé ni masqué dans cette copie. Un lecteur voit tout ce qui précède.","One thing to be clear about":"Une chose à bien comprendre","📦 Per-build presets":"📦 Préréglages par édition","The locks, colours and wording each build should carry, saved against that build and applied when you make it.":"Les verrous, les couleurs et la formulation que chaque édition doit porter, enregistrés pour cette édition et appliqués quand vous la fabriquez.","Save a build’s settings once you like them, then carry on working. Apply the preset when you come to make that copy.":"Enregistrez les réglages d’une édition quand ils vous plaisent, puis continuez à travailler. Appliquez le préréglage quand vous en viendrez à fabriquer cette copie.","Each build can carry its own settings: what is locked, the colours, the wording of the top bar and the introduction page, and the licence. Save them here against a build, and apply them when you come to make that copy.":"Chaque édition peut porter ses propres réglages : ce qui est verrouillé, les couleurs, la formulation de la barre supérieure et de la page d’introduction, et la licence. Enregistrez-les ici pour une édition, et appliquez-les quand vous en viendrez à fabriquer cette copie.","The guided tour is NOT part of a preset. The Tour room already keeps a separate tour for each build, and writing it from two places would put them out of step with each other.":"La visite guidée ne fait PAS partie d’un préréglage. La salle Visite garde déjà une visite distincte pour chaque édition, et l’écrire depuis deux endroits les désaccorderait.","Nothing saved for this build yet.":"Rien d’enregistré pour cette édition pour l’instant.","The committee demo · this copy":"La démo du comité · cette copie","What a preset holds":"Ce que contient un préréglage","Access · Colours · Look · The Frame · doorParts · Licence · Interface":"Accès · Couleurs · Apparence · Le Cadre · doorParts · Licence · Interface","How this is meant to be used":"Comment s’en servir","Set a build up the way you want it, save it here, then carry on working. When you come to make that copy, apply its preset, look at Before you send to check it says what you intend, and export or make the release. Applying a preset replaces what is currently in those rooms — so it saves a backup of them first, and you will find it in Safekeeping if you want it back.":"Réglez une édition comme vous le voulez, enregistrez-la ici, puis continuez à travailler. Quand vous en viendrez à fabriquer cette copie, appliquez son préréglage, regardez Avant d’envoyer pour vérifier qu’elle dit ce que vous voulez, puis exportez ou faites la publication. Appliquer un préréglage remplace ce qui se trouve dans ces salles : il en enregistre donc d’abord une sauvegarde, que vous trouverez dans La mise à l’abri si vous voulez la récupérer.","✏️ Quizzes":"✏️ Quiz","The question banks, module by module.":"Les banques de questions, module par module.","Use Copy on a question you like and change one thing in the copy. That is faster than writing a new one, and keeps the register.":"Utilisez Copier sur une question qui vous plaît et changez une chose dans la copie. C’est plus rapide que d’en écrire une nouvelle, et cela garde le registre.","+ Bank for a module":"+ Banque pour un module","Import banks":"Importer des banques","Delete":"Supprimer","💬 Seminars":"💬 Séminaires","The scripted discussions, by term.":"Les discussions préparées, par trimestre.","A deck is a spine, not a script. Six good questions beat twenty.":"Un support est une colonne vertébrale, pas un script. Six bonnes questions valent mieux que vingt.","+ Deck for a term":"+ Support pour un trimestre","✍️ Signatures":"✍️ Signatures","Every hand you sign with. Type a name and Carpe Diem draws it in thirteen hands, stroke by stroke, so it looks the same on every machine and needs no font installed. Keep the one you like and it appears in Tabula, Abacus and Imago, ready to place.":"Chaque écriture avec laquelle vous signez. Tapez un nom et Carpe Diem le trace en treize écritures, trait par trait, si bien qu’il paraît le même sur chaque machine sans police à installer. Gardez celle qui vous plaît et elle paraît dans Tabula, Abacus et Imago, prête à être placée.","A scan is a picture of one name. To sign a different name, type it into one of the hands.":"Une numérisation est l’image d’un seul nom. Pour signer d’un autre nom, tapez-le dans l’une des écritures.","Every hand you can sign with, in one place. What is kept here is what Tabula, Abacus and Imago offer under Your signature → Kept, so a hand added here is ready to place in any document. Nothing is sent anywhere.":"Chaque écriture avec laquelle vous pouvez signer, en un seul endroit. Ce qui est gardé ici est ce que Tabula, Abacus et Imago proposent sous Votre signature → Gardées, si bien qu’une écriture ajoutée ici est prête à être placée dans n’importe quel document. Rien n’est envoyé nulle part.","Kept hands":"Écritures gardées","Sample — A. Scholar":"Exemple : A. Scholar","Rename":"Renommer","Replace image":"Remplacer l’image","Move up":"Monter","Move down":"Descendre","Which hand is offered first":"Quelle écriture est proposée en premier","The apps show your kept hands in this order and open on the first of them, so whichever sits at the top is the one you will be offered when you come to sign. In your own build that is your own hand.":"Les apps montrent vos écritures gardées dans cet ordre et s’ouvrent sur la première, si bien que celle qui est en haut est celle qu’on vous proposera quand vous viendrez signer. Dans votre propre édition, c’est votre écriture.","Offered first":"Proposée en premier","Specimens kept as style references":"Spécimens gardés comme modèles de style","A picture of this name · usable as it is, not re-letterable":"L’image de ce nom · utilisable telle quelle, sans pouvoir être relettrée","Add a scan":"Ajouter une numérisation","A photograph or scan of a signature":"Une photo ou une numérisation d’une signature","The paper is dropped and the ink kept, so it sits on the line without a white box behind it.":"Le papier est retiré et l’encre gardée, si bien qu’elle se pose sur la ligne sans fond blanc derrière elle.","Write a name in a hand":"Écrire un nom dans une écriture","Type any name – your own, or another’s where you are authorised to sign – and see it in each hand before you keep it.":"Tapez n’importe quel nom, le vôtre, ou celui d’un autre là où vous êtes autorisé à signer, et voyez-le dans chaque écriture avant de le garder.","The name":"Le nom","Type a name above and every hand draws it. The hands are drawn by Carpe Diem itself, stroke by stroke, so they look the same on every machine and need no font installed. Keep the one you like and it appears in Tabula, Abacus and Imago under Your signature, ready to place in a document.":"Tapez un nom ci-dessus et chaque écriture le trace. Les écritures sont tracées par Carpe Diem lui-même, trait par trait, si bien qu’elles paraissent les mêmes sur chaque machine sans police à installer. Gardez celle qui vous plaît et elle paraît dans Tabula, Abacus et Imago sous Votre signature, prête à être placée dans un document.","Clear":"Effacer","Remove every kept hand":"Retirer toutes les écritures gardées","From here and from Tabula, Abacus and Imago. Your own drawn samples are seeded again on the next opening.":"D’ici, et de Tabula, Abacus et Imago. Vos propres exemples tracés sont semés de nouveau à la prochaine ouverture.","Remove all":"Tout retirer","e.g. Yannie D. Forest":"par ex. Yannie D. Forest","The room behind the rooms 🗝️":"La salle derrière les salles 🗝️","This room could not be drawn: P[cur] is not a function":"Cette salle n’a pas pu être dessinée : P[cur] is not a function","The line each book hands to the next, read as one argument on the Library’s thread.":"La ligne que chaque livre tend au suivant, lue comme un seul argument sur le fil de la Bibliothèque.","How this book leads to the next.":"Comment ce livre mène au suivant.","🧭 The Tour":"🧭 La Visite","Every card of the guided tour: rewrite it, reorder it, hide it, and keep a different tour for each build you send.":"Chaque carte de la visite guidée : la réécrire, la réordonner, la masquer, et garder une visite différente pour chaque édition que vous envoyez.","Press Play to see a card as a reader meets it. Write out a demonstration when you want to read the whole tour on paper.":"Appuyez sur Lire pour voir une carte telle qu’un lecteur la rencontre. Écrivez une démonstration quand vous voulez lire toute la visite sur papier.","The guided tour, card by card. Rewrite any card, put the cards in the order you like, and hide the ones a particular reader should not see. Nothing is destroyed: a hidden card returns the moment you show it again, and an emptied field returns the built-in wording.":"La visite guidée, carte par carte. Réécrivez n’importe quelle carte, mettez les cartes dans l’ordre qui vous plaît, et masquez celles qu’un lecteur donné ne doit pas voir. Rien n’est détruit : une carte masquée revient dès que vous la montrez de nouveau, et un champ vidé rend la formulation d’origine.","Which build is this tour for":"Pour quelle édition est cette visite","Authoring the tour for":"Rédiger la visite pour","This copy is running the the committee demo. Each build keeps its own tour, so a viewer is only ever told about what their copy actually shows.":"Cette copie est la démo du comité. Chaque édition garde sa propre visite, si bien qu’on ne parle jamais à un visiteur que de ce que sa copie montre réellement.","Play this tour":"Lire cette visite","Runs the real tour with the personal build’s wording and cards, in this copy, so you can see what that reader would meet.":"Lance la vraie visite avec la formulation et les cartes de l’édition personnelle, dans cette copie, pour que vous voyiez ce que ce lecteur rencontrerait.","Play":"Lire","Every card this build will show, in order, with its words — to read through before a meeting, or to hand to someone who cannot sit at the desk.":"Chaque carte que cette édition montrera, dans l’ordre, avec ses mots : à lire avant une réunion, ou à donner à quelqu’un qui ne peut pas s’asseoir au bureau.","One thing worth knowing: what you write here is kept with your work on this device, not baked into the file itself. It travels when you Export and the reader Imports, and it travels in a build made from a release manifest. Sending someone the plain file alone sends them the built-in tour.":"Une chose à savoir : ce que vous écrivez ici est gardé avec votre travail sur cet appareil, et non gravé dans le fichier lui-même. Cela voyage quand vous exportez et que le lecteur importe, et cela voyage dans une édition faite à partir d’un manifeste de publication. Envoyer à quelqu’un le seul fichier, c’est lui envoyer la visite d’origine.","You are editing the tour for a build other than this one, so these words will not change the tour you see here. Switch the picker back to this copy to preview them.":"Vous modifiez la visite d’une autre édition que celle-ci, ces mots ne changeront donc pas la visite que vous voyez ici. Remettez le sélecteur sur cette copie pour les prévisualiser.","Add and start over":"Ajouter et recommencer","Add a card of your own":"Ajouter une carte à vous","Written by you and added to the end of this build’s tour. A card of your own has nowhere of its own to point, so it simply shows Home when the reader reaches it.":"Écrite par vous et ajoutée à la fin de la visite de cette édition. Une carte à vous n’a pas d’endroit propre à montrer, elle montre donc simplement l’Accueil quand le lecteur l’atteint.","Start this build’s tour empty":"Commencer la visite de cette édition à vide","Hides every built-in card at once, leaving only cards you add. Nothing is destroyed: showing them again brings them all back.":"Masque d’un coup toutes les cartes d’origine, ne laissant que celles que vous ajoutez. Rien n’est détruit : les montrer de nouveau les ramène toutes.","Arrange":"Disposer","Rearrange the whole tour":"Réordonner toute la visite","Shows every card as a single line with its place in the tour, for moving them about quickly.":"Montre chaque carte sur une seule ligne avec sa place dans la visite, pour les déplacer rapidement.","Its chapter":"Son chapitre","The same card in French":"La même carte en français","The words only. Press Play above to see the card itself, drawn by the app.":"Seulement les mots. Appuyez sur Lire ci-dessus pour voir la carte elle-même, dessinée par l’app.","Edit one real day before trusting the shapes. A plan you have touched is a plan you believe.":"Modifiez une vraie journée avant de vous fier aux formes. Un plan que vous avez touché est un plan auquel vous croyez.","Restore this build’s tour":"Restaurer la visite de cette édition","Puts every card back to its built-in wording, order and visibility. Only the build named above is affected.":"Remet chaque carte à sa formulation, son ordre et sa visibilité d’origine. Seule l’édition nommée ci-dessus est concernée.","🎙️ The Faculty":"🎙️ La Faculté","Magister’s name, his modes and opening words, the chips he offers and what he answers, the librarian, and the French tutor.":"Le nom de Magister, ses modes et ses premiers mots, les pastilles qu’il propose et ce qu’il y répond, le bibliothécaire, et le tuteur de français.","Magister’s free replies are deliberately left to the app. Author his openers, and let him answer in his own words.":"Les réponses libres de Magister sont volontairement laissées à l’app. Rédigez ses ouvertures, et laissez-le répondre avec ses propres mots.","Shortcuts":"Raccourcis","Changes you are likely to want, each in one step, with no need to hunt for the room that holds them. Every card says what it will do before it does it, and every one of them can be undone from Notes, where the day’s changes are listed. The groups below run from the words the app uses, through how it looks, to your own hand.":"Les changements que vous voudrez probablement, chacun en une étape, sans avoir à chercher la salle qui les contient. Chaque carte dit ce qu’elle fera avant de le faire, et chacune peut être annulée depuis Notes, où les changements du jour sont listés. Les groupes ci-dessous vont des mots que l’app emploie à son apparence, jusqu’à votre propre écriture.","Words":"Les mots","Rename anything the app calls by name.":"Renommer tout ce que l’app appelle par un nom.","Rename Magister":"Renommer Magister","Asks for a new name, then changes it everywhere he is named, including his initial.":"Demande un nouveau nom, puis le change partout où il est nommé, y compris son initiale.","He is named in the tour, the Guidebook and every greeting, so this is one press rather than forty edits. Give him a name you would say aloud, since the app speaks it.":"Il est nommé dans la visite, le Guide et chaque salutation, c’est donc une pression au lieu de quarante modifications. Donnez-lui un nom que vous diriez à voix haute, puisque l’app le prononce.","Do this":"Faire ceci","Rename a room":"Renommer une salle","Asks which room, then what to call it. The rail, the room itself and the tour all follow.":"Demande quelle salle, puis comment l’appeler. La barre, la salle elle-même et la visite suivent.","The rail, the room and every mention change together. If a name stops making sense to you months from now, that is reason enough to change it.":"La barre, la salle et chaque mention changent ensemble. Si un nom cesse d’avoir du sens pour vous dans quelques mois, c’est une raison suffisante pour le changer.","Change how the app reads, without moving anything.":"Changer la façon dont l’app se lit, sans rien déplacer.","Flatten the depth":"Aplatir le relief","Takes the raised, shadowed look down to flat. Easier on the eye on a long day.":"Ramène l’aspect en relief et ombré à plat. Plus doux pour les yeux lors d’une longue journée.","Worth trying on a tired evening or a bright screen. It changes nothing about what is there, only how much it lifts off the page, and Full depth puts it straight back.":"À essayer par un soir de fatigue ou sur un écran lumineux. Cela ne change rien à ce qui s’y trouve, seulement à combien cela se détache de la page, et Relief complet le remet aussitôt.","Full depth":"Relief complet","Puts the raised look back to the house setting.":"Remet l’aspect en relief au réglage de la maison.","This is the house setting. If the app has felt flat since you last touched Display, this is usually why.":"C’est le réglage de la maison. Si l’app vous semble plate depuis la dernière fois que vous avez touché à Affichage, c’est généralement pour cela.","Still the animation":"Immobiliser l’animation","Stops things moving as they appear. Nothing else changes.":"Arrête le mouvement des choses quand elles paraissent. Rien d’autre ne change.","Reach for this if movement makes reading harder, or on the Fire tablet where a still page turns faster. Nothing is hidden and nothing moves position.":"À prendre si le mouvement rend la lecture plus difficile, ou sur la tablette Fire où une page immobile tourne plus vite. Rien n’est masqué et rien ne change de place.","Let it move again":"Le laisser bouger de nouveau","Returns the movement to the house setting.":"Remet le mouvement au réglage de la maison.","The movement is deliberate rather than decorative: it shows where a thing came from. Turn it back on if the app has started feeling abrupt.":"Le mouvement est voulu plutôt que décoratif : il montre d’où vient une chose. Remettez-le si l’app commence à paraître abrupte.","Change the gold":"Changer l’or","Asks for a colour, then repaints every accent in the app with it.":"Demande une couleur, puis repeint avec elle chaque accent de l’app.","The gold is every accent at once, so one colour changes the whole app. Choose something dark enough to read as ink on cream, or the small text will suffer.":"L’or, c’est tous les accents à la fois, donc une seule couleur change toute l’app. Choisissez-en une assez sombre pour se lire comme de l’encre sur crème, sinon le petit texte en souffrira.","Show and hide":"Montrer et masquer","Take something out of sight without deleting it.":"Mettre une chose hors de vue sans la supprimer.","Hide a room":"Masquer une salle","Asks which room, then takes it off the rail. Everything in it is kept and can be brought back.":"Demande quelle salle, puis la retire de la barre. Tout ce qu’elle contient est gardé et peut être ramené.","Hiding is not deleting. The work stays exactly where it is and comes back untouched, so hide freely if a room is not part of this year.":"Masquer n’est pas supprimer. Le travail reste exactement où il est et revient intact, alors masquez librement si une salle ne fait pas partie de cette année.","Show every hidden thing":"Montrer tout ce qui est masqué","Brings back everything you have hidden, all at once.":"Ramène d’un coup tout ce que vous avez masqué.","Use this before sending a copy to anyone, so you can see what they would see. It is also the quickest way to find a room you have forgotten hiding.":"Faites-le avant d’envoyer une copie à quelqu’un, pour voir ce qu’il verrait. C’est aussi le moyen le plus rapide de retrouver une salle que vous avez oublié avoir masquée.","Your hand":"Votre écriture","Teach Carpe Diem your handwriting, so a pencil can write into any field.":"Apprenez votre écriture à Carpe Diem, pour qu’un crayon puisse écrire dans n’importe quel champ.","Turn writing by hand on or off":"Activer ou désactiver l’écriture à la main","Writing by hand puts a small pen beside every field, and lets a pencil write straight onto the page. If you only type, or it gets in the way on a tablet, turn it off here: the pen and the ink stop entirely and typing is left alone. The hand you have taught is kept either way, ready for when you turn it back on.":"L’écriture à la main place un petit stylo à côté de chaque champ, et permet à un crayon d’écrire directement sur la page. Si vous ne faites que taper, ou si cela gêne sur une tablette, désactivez-la ici : le stylo et l’encre s’arrêtent complètement et la frappe reste intacte. L’écriture que vous avez apprise est gardée dans tous les cas, prête pour le jour où vous la réactiverez.","Off is the quiet choice on a tablet you only type on. Nothing you have taught is lost, and this switch brings it all back.":"Désactivé est le choix tranquille sur une tablette où vous ne faites que taper. Rien de ce que vous avez appris n’est perdu, et cet interrupteur ramène tout.","Teach Carpe Diem your hand":"Apprendre votre écriture à Carpe Diem","It shows you a letter, you write it three times on the slate, and it moves on to the next. It remembers where you stopped, so a dozen now and the rest another day is perfectly fine. Write each letter the way you actually write it rather than the way you were taught to, because it is matching your hand and not a copybook. Everything it learns stays on this device.":"Il vous montre une lettre, vous l’écrivez trois fois sur l’ardoise, et il passe à la suivante. Il se souvient de l’endroit où vous vous êtes arrêté, donc une douzaine maintenant et le reste un autre jour, c’est très bien. Écrivez chaque lettre comme vous l’écrivez vraiment plutôt que comme on vous l’a apprise, car il apprend votre main et non un cahier d’écriture. Tout ce qu’il apprend reste sur cet appareil.","Do a dozen letters and come back to the rest another day. It always asks for the one it knows least, so nothing is written twice and you never begin again at A.":"Faites une douzaine de lettres et revenez au reste un autre jour. Il demande toujours celle qu’il connaît le moins, donc rien n’est écrit deux fois et vous ne recommencez jamais à A.","Teach it your joined hand as well":"Lui apprendre aussi votre écriture liée","Teach the printed walk first. The joined samples ride on top of it, so a word can be read even where a tail hides the letter underneath.":"Apprenez d’abord l’écriture script. Les exemples liés se posent par-dessus, si bien qu’un mot peut être lu même là où une boucle cache la lettre en dessous.","Write by hand into any field":"Écrire à la main dans n’importe quel champ","Let it forget your hand":"Lui faire oublier votre écriture","Removes every sample it holds of your writing and starts again from nothing. Use this if your hand has changed, or if you taught it in a hurry and it reads you badly.":"Retire tous les exemples de votre écriture qu’il garde et recommence de zéro. À utiliser si votre écriture a changé, ou si vous la lui avez apprise à la hâte et qu’il vous lit mal.","Teaching one letter again is usually enough. Reach for this only if the whole hand reads badly, and remember it lands in the change log like everything else, so it can be taken back.":"Réapprendre une seule lettre suffit généralement. Ne prenez ceci que si toute l’écriture est mal lue, et rappelez-vous que cela entre dans le journal des changements comme tout le reste, donc on peut le reprendre.","Order":"L’ordre","Move things about, by dragging them or without.":"Déplacer les choses, en les faisant glisser ou non.","Rearrange by dragging":"Réordonner en faisant glisser","Turns arranging on. The rooms on the rail and the app buttons on Home can then be dragged into the order you want. Every move is saved as you make it, and every move can be undone from Notes.":"Active la disposition. Les salles de la barre et les boutons des apps sur l’Accueil peuvent alors être glissés dans l’ordre voulu. Chaque déplacement est enregistré à mesure, et chacun peut être annulé depuis Notes.","Turn it on, move what you want, then turn it off. While it is on the app is in a different mood and a tap moves things rather than opening them.":"Activez-le, déplacez ce que vous voulez, puis désactivez-le. Tant qu’il est actif, l’app est dans une autre humeur et une pression déplace les choses au lieu de les ouvrir.","Stop rearranging":"Arrêter de réordonner","Turns arranging off and leaves everything exactly where you have put it.":"Désactive la disposition et laisse tout exactement là où vous l’avez mis.","Do this before you carry on working, or a tap meant to open something will move it instead.":"Faites-le avant de reprendre le travail, sinon une pression destinée à ouvrir quelque chose le déplacera.","Let the studio windows forget where they were put":"Faire oublier aux fenêtres du studio où elles avaient été placées","Tabula, Abacus and the others remember where you last placed them and how big you made them. This makes them forget, so each one opens in its own corner again at its usual size.":"Tabula, Abacus et les autres se souviennent de l’endroit où vous les avez placées en dernier et de leur taille. Ceci les leur fait oublier, si bien que chacune s’ouvre de nouveau dans son propre coin, à sa taille habituelle.","Only worth doing if a window has ended up somewhere awkward, or you have moved to a much smaller screen and want the corners back.":"Utile seulement si une fenêtre s’est retrouvée dans un endroit gênant, ou si vous êtes passé à un écran bien plus petit et voulez retrouver les coins.","Put the side marks back in their corner":"Remettre les marques latérales dans leur coin","Returns the bell, the moon, the sand timer and the notepad to the corner they came in. Anything else you have dragged stays where it is.":"Ramène la cloche, la lune, le sablier et le bloc-notes dans le coin d’où ils viennent. Tout autre élément que vous avez déplacé reste où il est.","The marks are the bell, the moon, the sand timer and the notepad. This touches only those four and leaves everything else you have dragged alone.":"Les marques sont la cloche, la lune, le sablier et le bloc-notes. Ceci ne touche que ces quatre-là et laisse tranquille tout ce que vous avez déplacé d’autre.","Put everything dragged back where it was":"Remettre tout ce qui a été glissé à sa place","Returns every row you have dragged to the order it came in. Nothing else you have changed is touched.":"Ramène chaque rangée que vous avez glissée à l’ordre d’origine. Rien d’autre de ce que vous avez changé n’est touché.","The wide undo for arranging. If you are not sure what you moved, this is quicker than hunting, and the change log still holds each move separately.":"L’annulation large pour la disposition. Si vous ne savez plus ce que vous avez déplacé, c’est plus rapide que de chercher, et le journal des changements garde encore chaque déplacement séparément.","Put the rooms back in house order":"Remettre les salles dans l’ordre de la maison","Undoes any reordering of the rooms and returns them to the order they came in.":"Défait tout réordonnancement des salles et les remet dans l’ordre d’origine.","The house order runs the way most people need the rooms, so this is a good reset if the rail has stopped feeling obvious.":"L’ordre de la maison suit la façon dont la plupart des gens ont besoin des salles, c’est donc une bonne remise à zéro si la barre a cessé de paraître évidente.","New things of a kind the app already understands.":"Des choses nouvelles d’un genre que l’app comprend déjà.","Add a module":"Ajouter un module","Asks for a title, then adds a new module to the first term, ready to fill in.":"Demande un titre, puis ajoute un nouveau module au premier trimestre, prêt à être rempli.","Safety":"La sécurité","The part that protects you.":"La partie qui vous protège.","Keep a copy of everything as it is now":"Garder une copie de tout tel que c’est maintenant","Saves a snapshot you can return to later, whatever you change afterwards.":"Enregistre un instantané auquel vous pourrez revenir plus tard, quoi que vous changiez ensuite.","Do this before any large edit. It takes one press, and restoring later keeps what it replaced as its own copy, so even a wrong restore is recoverable.":"Faites-le avant toute grosse modification. Cela prend une pression, et restaurer plus tard garde ce que cela a remplacé comme sa propre copie, si bien que même une mauvaise restauration se rattrape.","Undo my last change":"Annuler mon dernier changement","Steps back one change. The list of every change is in Notes if you want an older one.":"Recule d’un changement. La liste de tous les changements se trouve dans Notes si vous en voulez un plus ancien.","For anything older than the last change, go to Notes, where every change is listed on its own and can be taken back without touching the others.":"Pour tout ce qui est plus ancien que le dernier changement, allez dans Notes, où chaque changement est listé à part et peut être repris sans toucher aux autres.","Start again from the house":"Recommencer à partir de la maison","Puts everything back as
