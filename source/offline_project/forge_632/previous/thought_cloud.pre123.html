/* ============ THE THOUGHTS PANEL (shared by Ingenium, The Forge and Carpe Diem) ============
   Her words (17 October 2026): the old panel was "really heavy to drag around the screen", its shadow "overwhelming
   the entire page"; she asked for "the same light, popped out animated movement of the sticky notes", "resizeable and
   draggable anywhere", minimise and close no longer the same, the 💭 given the bell's little number, and reminders so
   a thought put away is never forgotten. Then, of the first puffed cloud: "fake and childish. I want it to look
   weighted and 3D ... realistic ... match Ingenium's graphics", and the number "purple to match Ingenium's colour and
   not be red". So the panel is a raised slab in each app's own desk language: a matte face, a crisp fine edge, a
   short dark edge beneath for its thickness, and soft layered casts kept short; small raised beads lead to the 💭.
   Picked up, it lifts and sways like a sticky note; set down, it seats with a spring. It moves on its own compositor
   layer (a transform, never left and top), so dragging it repaints nothing.
   One file, one look, each app in its own colours: data-tc-app="ingenium" | "forge" | "cd", by day and by night. */
.tc-el{--tc-fam:40,22,68;--tc-face-a:#ffffff;--tc-face-b:#fbfafd;--tc-lip:rgba(255,255,255,0);--tc-rim:rgba(40,22,68,.09);
  --tc-ink:#221a2e;--tc-soft:rgba(96,84,112,.58);--tc-acc:#6a3fb5;--tc-acc-hi:#7d55cc;--tc-acc-lo:#5a339b;--tc-acc-edge:#3f2275;--tc-on-acc:#ffffff;
  --tc-gold:#b88a3a;--tc-badge:#6a3fb5;--tc-badge-hi:#8059cf;--tc-badge-ink:#ffffff;
  --tc-sheet:#ffffff;--tc-card:#ffffff;--tc-card-b:#fbfafd;--tc-line:rgba(40,22,68,.09);--tc-veil:rgba(28,18,44,.20);--tc-menu-hover:#f4f0fa;
  --tc-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --tc-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tc-spring:cubic-bezier(.34,1.35,.64,1);
  --tc-key:inset 0 -1.5px 0 rgba(var(--tc-fam),.13),0 0 0 .5px rgba(var(--tc-fam),.10),0 2px 0 rgba(var(--tc-fam),.25),0 4px 5px rgba(var(--tc-fam),.16),0 9px 14px rgba(var(--tc-fam),.10);
  --tc-key-hi:inset 0 -1.5px 0 rgba(var(--tc-fam),.13),0 0 0 .5px rgba(var(--tc-fam),.10),0 3px 0 rgba(var(--tc-fam),.25),0 6px 8px rgba(var(--tc-fam),.18),0 13px 20px rgba(var(--tc-fam),.12);
  --tc-seat:inset 0 2px 5px rgba(var(--tc-fam),.22),0 0 0 .5px rgba(var(--tc-fam),.10),0 1px 1px rgba(var(--tc-fam),.18);
  /* the sticky notes as they are drawn on the page (their dress module): lit top and left edges, a solid wall on the
     right and beneath for the paper's thickness, and three close casts */
  --tc-wall:#b5adc4;
  /* her word, of the sticky-note look: "remove the heavy shadow": the paper keeps its thickness, and only a short,
     light shadow sits beneath it */
  --tc-slab:inset 0 2px 0 rgba(255,255,255,.72),inset 2px 0 0 rgba(255,255,255,.42),inset -2px 0 0 var(--tc-wall),inset 0 -3px 0 var(--tc-wall),0 0 0 1px var(--tc-rim),
    0 1px 2px rgba(var(--tc-fam),.10),0 5px 9px -5px rgba(var(--tc-fam),.16);
  --tc-slab-up:inset 0 2px 0 rgba(255,255,255,.72),inset 2px 0 0 rgba(255,255,255,.42),inset -2px 0 0 var(--tc-wall),inset 0 -3px 0 var(--tc-wall),0 0 0 1px var(--tc-rim),
    0 2px 3px rgba(var(--tc-fam),.10),0 9px 12px -7px rgba(var(--tc-fam),.18);
  --tc-modal:0 0 0 1px var(--tc-rim),0 1px 0 rgba(var(--tc-fam),.06),0 4px 7px rgba(var(--tc-fam),.08),0 20px 36px rgba(var(--tc-fam),.14)}
.tc-el[data-tc-night="1"]{--tc-face-a:#2c2440;--tc-face-b:#272036;--tc-lip:rgba(255,255,255,.07);--tc-rim:rgba(205,184,240,.12);
  --tc-ink:#f3eefb;--tc-soft:rgba(211,201,227,.55);--tc-acc:#a685e6;--tc-acc-hi:#b79ce6;--tc-acc-lo:#8662cf;--tc-acc-edge:#2b1b4f;--tc-on-acc:#16101f;
  --tc-gold:#e3bd69;--tc-badge:#a685e6;--tc-badge-hi:#bba0ee;--tc-badge-ink:#16101f;
  --tc-sheet:#221b2e;--tc-card:#2a2239;--tc-card-b:#272035;--tc-line:rgba(205,184,240,.10);--tc-veil:rgba(6,3,12,.50);--tc-menu-hover:#352b49;
  --tc-key:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.45),0 0 0 .5px rgba(205,184,240,.10),0 2px 0 rgba(0,0,0,.75),0 4px 5px rgba(0,0,0,.50),0 9px 14px rgba(0,0,0,.36);
  --tc-key-hi:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.45),0 0 0 .5px rgba(205,184,240,.10),0 3px 0 rgba(0,0,0,.75),0 6px 8px rgba(0,0,0,.52),0 13px 20px rgba(0,0,0,.40);

  --tc-wall:#16111f;
  --tc-slab:inset 0 2px 0 rgba(255,255,255,.08),inset 2px 0 0 rgba(255,255,255,.04),inset -2px 0 0 var(--tc-wall),inset 0 -3px 0 var(--tc-wall),0 0 0 1px var(--tc-rim),
    0 1px 2px rgba(0,0,0,.40),0 5px 9px -5px rgba(0,0,0,.45);
  --tc-slab-up:inset 0 2px 0 rgba(255,255,255,.10),inset 2px 0 0 rgba(255,255,255,.05),inset -2px 0 0 var(--tc-wall),inset 0 -3px 0 var(--tc-wall),0 0 0 1px var(--tc-rim),
    0 2px 3px rgba(0,0,0,.40),0 9px 12px -7px rgba(0,0,0,.50);
  --tc-modal:0 0 0 1px var(--tc-rim),0 1px 0 rgba(0,0,0,.5),0 4px 7px rgba(0,0,0,.45),0 20px 36px rgba(0,0,0,.5)}
/* The Forge and Carpe Diem: their own blue keys on near-white, the family's fine gold edge, ink of deep slate */
.tc-el[data-tc-app="forge"],.tc-el[data-tc-app="cd"]{--tc-fam:16,42,58;--tc-wall:#a7b4bf;--tc-face-a:#ffffff;--tc-face-b:#fbfcfd;--tc-rim:rgba(16,42,58,.10);
  --tc-ink:#1d1d1f;--tc-soft:rgba(70,84,94,.58);--tc-acc:#1b6b93;--tc-acc-hi:#2a7ea8;--tc-acc-lo:#155a7c;--tc-acc-edge:#0d3d55;--tc-on-acc:#ffffff;
  --tc-gold:#b88a3a;--tc-badge:#1b6b93;--tc-badge-hi:#2f84ae;--tc-badge-ink:#ffffff;--tc-sheet:#ffffff;--tc-card:#ffffff;--tc-card-b:#fbfcfd;

.tc-el[data-tc-app="forge"][data-tc-night="1"],.tc-el[data-tc-app="cd"][data-tc-night="1"]{--tc-wall:#11161b;--tc-face-a:#262e37;--tc-face-b:#222930;--tc-lip:rgba(255,255,255,.07);--tc-rim:rgba(214,178,98,.20);
  --tc-ink:#e8e8ea;--tc-soft:rgba(200,212,222,.55);--tc-acc:#5baedb;--tc-acc-hi:#74bde5;--tc-acc-lo:#3d8fbe;--tc-acc-edge:#123247;--tc-on-acc:#0d1820;
  --tc-gold:#d9b45a;--tc-badge:#5baedb;--tc-badge-hi:#7cc3ea;--tc-badge-ink:#0d1820;--tc-sheet:#1c2229;--tc-card:#262e37;--tc-card-b:#222930;--tc-line:rgba(255,255,255,.08);--tc-menu-hover:#2e3842}

/* whatever the host app's own rules, what is hidden here stays hidden */
.tc-el [hidden],.tc-el[hidden]{display:none !important}
/* ---------- the panel ---------- */
.tc-cloud{position:fixed;left:0;top:0;z-index:2147482995;width:560px;box-sizing:border-box;will-change:transform;touch-action:none;
  user-select:none;-webkit-user-select:none;cursor:grab;color:var(--tc-ink)}
.tc-cloud *{box-sizing:border-box}
.tc-cloud.tc-held{cursor:grabbing}
.tc-tilt{transition:transform .5s var(--tc-spring);transform-origin:50% 50%}
.tc-lift{transition:transform .34s var(--tc-spring);transform-origin:50% 60%}
.tc-cloud:hover .tc-lift{transform:translateY(-2px)}
.tc-cloud.tc-held .tc-lift{transform:translateY(-3px) scale(1.012);transition-duration:.18s}
.tc-cloud.tc-sizing .tc-lift{transform:translateY(-2px)}
.tc-pop,.tc-float{position:relative;transform-origin:50% 50%}
.tc-body{position:relative;display:flex;align-items:flex-start;gap:10px;padding:13px 14px 13px 16px;min-height:62px;border-radius:24px;
  background:linear-gradient(180deg,var(--tc-face-a),var(--tc-face-b));box-shadow:var(--tc-slab);transition:box-shadow .2s ease}
.tc-cloud.tc-held .tc-body{box-shadow:var(--tc-slab-up)}
.tc-cloud.tc-tall .tc-body{border-radius:20px}
.tc-cloud.tc-sized .tc-body{height:100%}
.tc-cloud.tc-narrow .tc-body{flex-wrap:wrap;padding:14px 14px 12px 16px}
.tc-cloud.tc-narrow .tc-field{flex-basis:calc(100% - 40px)}
.tc-cloud.tc-narrow .tc-keys{width:100%;justify-content:flex-end}
.tc-glyph{flex:none;font-size:22px;line-height:1;margin-top:7px;cursor:grab;
  filter:drop-shadow(0 -1px 0 rgba(255,255,255,.9)) drop-shadow(0 2px 0 rgba(var(--tc-fam),.28)) drop-shadow(0 3px 3px rgba(var(--tc-fam),.20))}
.tc-el[data-tc-night="1"] .tc-glyph{filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.tc-dot{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(180deg,var(--tc-face-a),var(--tc-face-b));
  box-shadow:inset 0 1px 0 var(--tc-lip),inset 0 -1px 0 rgba(var(--tc-fam),.12),0 0 0 1px var(--tc-rim),0 1.5px 0 rgba(var(--tc-fam),.22),0 3px 4px rgba(var(--tc-fam),.14)}
.tc-el[data-tc-night="1"] .tc-dot{box-shadow:inset 0 1px 0 var(--tc-lip),inset 0 -1px 0 rgba(0,0,0,.4),0 0 0 1px var(--tc-rim),0 1.5px 0 rgba(0,0,0,.7),0 3px 4px rgba(0,0,0,.45)}
.tc-field{position:relative;flex:1;min-width:0;display:block}
.tc-cloud.tc-sized .tc-field{align-self:stretch;display:flex}
.tc-cloud.tc-sized .tc-in{flex:1;height:auto}
.tc-in{display:block;width:100%;min-height:36px;margin:0;padding:7px 2px 10px;border:0;outline:0;background:transparent;box-shadow:none;resize:none;
  cursor:text;touch-action:auto;user-select:text;-webkit-user-select:text;overflow-y:hidden;white-space:pre-wrap;overflow-wrap:anywhere;
  font:italic 17px/1.42 var(--tc-serif);color:var(--tc-ink);scrollbar-width:thin}
.tc-cloud.tc-sized .tc-in{overflow-y:auto}
/* the writing sits on the panel itself, whatever the host app does to its other text boxes */
html body .tc-cloud textarea.tc-in,html body .tc-cloud textarea.tc-in:focus,html body .tc-cloud textarea.tc-in:focus-visible,html body .tc-cloud textarea.tc-in:hover{
  border:0 !important;outline:0 !important;box-shadow:none !important;background:transparent !important;border-radius:0 !important;
  padding:7px 2px 10px !important;margin:0 !important;font:italic 17px/1.42 var(--tc-serif) !important;color:var(--tc-ink) !important;min-width:0 !important;max-width:none !important}
.tc-in::placeholder{color:var(--tc-soft)}
.tc-rule{position:absolute;left:2px;bottom:3px;height:1.5px;width:0;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg,var(--tc-gold),transparent);opacity:.7;transition:width .3s ease}
.tc-keys{display:flex;align-items:center;gap:7px;flex:none;margin-top:1px}
/* keys: matte face, crisp edge, a short dark edge beneath; they spring up under the pointer and seat when pressed */
.tc-key{appearance:none;-webkit-appearance:none;border:0;margin:0;cursor:pointer;flex:none;white-space:nowrap;
  font:600 13px/1 var(--tc-sans);letter-spacing:.01em;padding:9px 15px;border-radius:999px;color:var(--tc-acc);
  background:linear-gradient(180deg,var(--tc-face-a),var(--tc-face-b));box-shadow:var(--tc-key);
  transition:transform .12s var(--tc-spring),box-shadow .12s ease,filter .12s ease}
.tc-key:hover{transform:translateY(-1.5px);box-shadow:var(--tc-key-hi)}
.tc-key:active{transform:translateY(2px);box-shadow:var(--tc-seat);transition-duration:.05s}
.tc-key:focus-visible{outline:2px solid var(--tc-acc);outline-offset:2px}
.tc-key:disabled{opacity:.6;cursor:default}
.tc-key.tc-keep{color:var(--tc-on-acc);background:linear-gradient(180deg,var(--tc-acc-hi),var(--tc-acc) 55%,var(--tc-acc-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1.5px 0 rgba(0,0,0,.18),0 2px 0 var(--tc-acc-edge),0 4px 5px rgba(var(--tc-fam),.20),0 9px 14px rgba(var(--tc-fam),.12)}
.tc-key.tc-keep:hover{filter:brightness(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1.5px 0 rgba(0,0,0,.18),0 3px 0 var(--tc-acc-edge),0 6px 8px rgba(var(--tc-fam),.22),0 13px 20px rgba(var(--tc-fam),.14)}
.tc-key.tc-keep:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.30),0 1px 0 var(--tc-acc-edge)}
.tc-key.tc-round{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.tc-key.tc-min{font-size:20px;font-weight:500}
.tc-key.tc-small{padding:7px 12px;font-size:12px}
.tc-ask{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font:600 13px/1.3 var(--tc-sans);color:var(--tc-ink)}
.tc-ask span{margin-right:2px}
/* resized from any of its four edges and four corners; the bottom-right corner shows its grip */
.tc-rz{position:absolute;z-index:3;touch-action:none}
.tc-rz[data-rz="n"]{top:-5px;left:18px;right:18px;height:10px;cursor:ns-resize}
.tc-rz[data-rz="s"]{bottom:-5px;left:18px;right:18px;height:10px;cursor:ns-resize}
.tc-rz[data-rz="e"]{right:-5px;top:18px;bottom:18px;width:10px;cursor:ew-resize}
.tc-rz[data-rz="w"]{left:-5px;top:18px;bottom:18px;width:10px;cursor:ew-resize}
.tc-rz[data-rz="nw"],.tc-rz[data-rz="ne"],.tc-rz[data-rz="sw"],.tc-rz[data-rz="se"]{width:20px;height:20px}
.tc-rz[data-rz="nw"]{left:-5px;top:-5px;cursor:nwse-resize}.tc-rz[data-rz="se"]{right:-5px;bottom:-5px;cursor:nwse-resize}
.tc-rz[data-rz="ne"]{right:-5px;top:-5px;cursor:nesw-resize}.tc-rz[data-rz="sw"]{left:-5px;bottom:-5px;cursor:nesw-resize}
.tc-rz[data-rz="se"]::before{content:"";position:absolute;right:13px;bottom:11px;width:13px;height:13px;border-radius:2px;opacity:0;transition:opacity .2s;
  background:linear-gradient(135deg,transparent 0 46%,var(--tc-soft) 46% 54%,transparent 54% 66%,var(--tc-soft) 66% 74%,transparent 74%)}
.tc-cloud:hover .tc-rz[data-rz="se"]::before,.tc-cloud:focus-within .tc-rz[data-rz="se"]::before,.tc-cloud.tc-sizing .tc-rz[data-rz="se"]::before{opacity:.75}
@media (hover:none){.tc-rz[data-rz="se"]::before{opacity:.55}}
.tc-mote{position:fixed;left:0;top:0;z-index:2147482996;pointer-events:none;white-space:pre;color:var(--tc-gold)}

/* ---------- the second look: LAYERED DEPTH, as Ingenium's seal stands (its R104, from Carpe Diem's and the Forge's
   seals). The panel is cut in layers, each at its own depth: its body at the back, the face, the writing a little
   above the face, the keys above that and the 💭 in front. It sways slowly so the layers slide past one another;
   under a mouse it turns to follow it, and its light follows too; held, it lifts; pressed, it sinks. The angles are
   the seal's, made small for a panel that holds writing, and it holds still while she writes. ---------- */
.tc-cloud[data-tc-look="layered"]{perspective:1500px;--rx:0deg;--ry:0deg;--gx:30%;--gy:18%}
.tc-cloud[data-tc-look="layered"] :is(.tc-tilt,.tc-lift,.tc-pop,.tc-float,.tc-body){transform-style:preserve-3d}
.tc-cloud[data-tc-look="layered"] .tc-tilt{transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tc-cloud[data-tc-look="layered"] .tc-float{animation:tcSway 9s ease-in-out infinite}
.tc-cloud[data-tc-look="layered"]:focus-within .tc-float,.tc-cloud[data-tc-look="layered"].tc-held .tc-float,.tc-cloud[data-tc-look="layered"].tc-sizing .tc-float,.tc-cloud[data-tc-look="layered"].tc-hover .tc-float{animation-play-state:paused}
@keyframes tcSway{0%,100%{transform:rotateY(-2.2deg) rotateX(1deg)}50%{transform:rotateY(2.2deg) rotateX(-1deg)}}
.tc-back{display:none}
.tc-cloud[data-tc-look="layered"] .tc-back{display:block;position:absolute;inset:0;border-radius:24px;transform:translateZ(-9px);pointer-events:none;
  background:linear-gradient(180deg,var(--tc-wall),color-mix(in srgb,var(--tc-wall) 70%,#000));
  box-shadow:0 0 0 1px var(--tc-rim),0 4px 8px rgba(var(--tc-fam),.16),0 14px 26px rgba(var(--tc-fam),.14),0 28px 44px -10px rgba(var(--tc-fam),.16)}
.tc-el[data-tc-night="1"][data-tc-look="layered"] .tc-back{box-shadow:0 0 0 1px var(--tc-rim),0 4px 8px rgba(0,0,0,.42),0 14px 26px rgba(0,0,0,.40),0 28px 44px -10px rgba(0,0,0,.42)}
.tc-cloud[data-tc-look="layered"].tc-tall .tc-back{border-radius:20px}
.tc-cloud[data-tc-look="layered"] .tc-body{
  background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 46%),linear-gradient(180deg,var(--tc-face-a),var(--tc-face-b) 60%,color-mix(in srgb,var(--tc-face-b) 92%,var(--tc-wall)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(var(--tc-fam),.10),0 0 0 1px var(--tc-rim)}
.tc-el[data-tc-night="1"][data-tc-look="layered"] .tc-body{
  background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 46%),linear-gradient(180deg,var(--tc-face-a),var(--tc-face-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.4),0 0 0 1px var(--tc-rim)}
.tc-cloud[data-tc-look="layered"] .tc-field{transform:translateZ(5px)}
.tc-cloud[data-tc-look="layered"] .tc-keys,.tc-cloud[data-tc-look="layered"] .tc-ask{transform:translateZ(12px)}
.tc-cloud[data-tc-look="layered"] .tc-glyph{transform:translateZ(18px)}
.tc-cloud[data-tc-look="layered"].tc-hover .tc-lift{transform:translateZ(14px)}
.tc-cloud[data-tc-look="layered"].tc-held .tc-lift{transform:translateZ(22px) scale(1.01)}
.tc-cloud[data-tc-look="layered"].tc-down .tc-lift{transform:translateZ(-4px);transition-duration:.08s}
.tc-el[data-tc-still="1"][data-tc-look="layered"] .tc-float{animation:none}
.tc-el[data-tc-still="1"][data-tc-look="layered"] .tc-tilt{transform:none}
@media (prefers-reduced-motion:reduce){.tc-cloud[data-tc-look="layered"] .tc-float{animation:none}.tc-cloud[data-tc-look="layered"] .tc-tilt{transform:none}}

/* ---------- the 💭's number: the bell's treatment, in the app's own colour ---------- */
.tc-badge{position:absolute !important;top:-3px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;box-sizing:border-box;
  background:linear-gradient(180deg,var(--tc-badge-hi),var(--tc-badge));color:var(--tc-badge-ink);font:800 10px/18px var(--tc-sans) !important;text-align:center;letter-spacing:0;text-shadow:none !important;filter:none !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.15),0 1px 0 rgba(var(--tc-fam),.35),0 2px 4px rgba(var(--tc-fam),.30);z-index:4;pointer-events:none;transform:none;animation:none}
.tc-badge.tc-bump{animation:tcBadge .5s var(--tc-spring)}
@keyframes tcBadge{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.tc-draft{position:absolute !important;font-size:0 !important;left:-4px;bottom:1px;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:4;
  background:linear-gradient(180deg,var(--tc-face-a),var(--tc-face-b));box-shadow:0 0 0 2px var(--tc-acc),0 1px 0 rgba(var(--tc-fam),.3),0 2px 4px rgba(var(--tc-fam),.25);
  animation:tcDraft 3.4s ease-in-out infinite}
@keyframes tcDraft{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.tc-wiggle{animation:tcWiggle .8s ease-in-out}
