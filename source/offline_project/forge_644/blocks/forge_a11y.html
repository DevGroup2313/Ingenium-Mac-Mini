   1. the line under each room's head that says what is happening underneath (#tutorLine) was grey on grey, 2.4 to 4.4 to
      1 against the 4.5 the rule asks for: it now has 6.2 by day and 8.3 by night;
   2. the save notice was still read while it faded away (a word nearly the colour of the page): it is hidden once faded;
      Fabrica's two narrow-screen tabs not chosen were 4.0 to 1: now 5.6;
   3. in Fabrica, a divider the keyboard can move said nothing of where it stood, and a panel that scrolls could not be
      scrolled from the keyboard. Ingenium had these put right in its own Fabrica (its module r152); the same is done here.
   And as in Ingenium, the icons drawn beside the words of a key are hidden from screen readers, as decoration.
   The accessibility tree (rig/a11y/ax_tree.js) found two more in every room: the Forge had no main region (a screen
   reader's way to the room, past the masthead and the rail), and a few words that can be edited in place were read as
   nothing. The room is the main region now, the rail the rooms' navigation, and an editable line a text box with its name.
   Each is put right as each room opens. */
html body #section-forge #tutorLine#tutorLine,html body #tutorLine#tutorLine{color:#4f565d !important}
body[data-theme="night"] #section-forge #tutorLine#tutorLine,body[data-theme="night"] #tutorLine#tutorLine{color:#a3aab1 !important}
#cd-save-notice[style*="opacity: 0"]{visibility:hidden;transition:visibility 0s .3s}

#fb .f-pn-b[tabindex="0"]:focus-visible{outline:2px solid var(--f-acc,#17577a);outline-offset:-2px}
